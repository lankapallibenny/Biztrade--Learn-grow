kouts] మరియు [fakeouts] Gold (XAUUSD)కు వర్తిస్తాయి: మీరు $1,920 వద్ద విరిగిపోవటం చూసినప్పుడు, తక్షణమైన [entry]కు ముందు నిజమైన [momentum]లో ధృవీకరణ వేయండి. ఉదాహరణ: $1,920పై బ్రేకౌట్, కానీ ఇది నిలిపివేయబడింది; $100 లాభం (1,000 pips) కోసం వేచేవారు నష్టపోయారు. ప్రమాదం: [fakeouts] సరిగ్గా నిర్వహించబడిన [stop losses]తో సంరక్షించండి.\u003c/p>\n\n\n**Note:** For accurate Telugu educational content, I recommend having a native Telugu speaker review this lesson material, as technical finance terminology requires precise translation."}},"15":{"en":"\u003cp>A moving average (MA) smooths out price by averaging the closing prices of a set number of recent periods. Because it filters out short-term noise, beginners often use it to see the overall direction of a market. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"Price trending upward above a rising moving average\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Calculation:\u003c/strong> A 10-period simple moving average (SMA) adds the last 10 closing prices and divides by 10. Each new candle drops the oldest price and adds the newest, so the line \"moves.\"\u003c/li>\n\u003cli>\u003cstrong>Reading direction:\u003c/strong> Price above a rising MA suggests an uptrend. Price below a falling MA suggests a downtrend. A flat MA often means a range.\u003c/li>\n\u003cli>\u003cstrong>SMA vs. EMA:\u003c/strong> The exponential moving average (EMA) gives more weight to recent prices, so it reacts faster but can produce more false signals. Both lag, because they are based on past prices.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD closes at 1.0800, 1.0810, 1.0820, 1.0830 and 1.0840 over five days. The 5-day SMA is (1.0800 + 1.0810 + 1.0820 + 1.0830 + 1.0840) / 5 = 1.0820. Today's price of 1.0840 is 20 pips above the average, which hints at upward momentum.\u003c/p>\n\u003cp>For scale: on a standard lot (100,000 units), 1 pip is about $10, so a 20-pip move equals roughly $200. On a micro lot (1,000 units), it is about $2. Moves can go against you just as easily, so this is only an illustration, not a trade recommendation.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A moving average smooths price to help show trend direction.\u003c/li>\n\u003cli>MAs lag behind price; they describe the past and do not predict the future.\u003c/li>\n\u003cli>They work best in trending markets and give more false signals in ranges.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> If the last 4 closes of a pair are 1.2000, 1.2020, 1.2040 and 1.2060, what is the 4-period SMA?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> (1.2000 + 1.2020 + 1.2040 + 1.2060) / 4 = 1.2030.\u003c/p>","te":"\n\u003cp>ధరలు పైకి కిందకి వేగంగా మారుతుంటే, చార్ట్ గందరగోళంగా కనిపిస్తుంది. మూవింగ్ యావరేజ్ (Moving Average - MA) ఆ గందరగోళాన్ని తగ్గించి, ధర ఏ దిశలో వెళ్తుందో సులభంగా చూపించే ఒక గీత. ఇది విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"ధర మూవింగ్ యావరేజ్ పైన ఉంటూ అప్‌ట్రెండ్ (uptrend) లో కదులుతోంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>గత కొన్ని క్యాండిల్స్ (candles) యొక్క క్లోజింగ్ ధరల సగటును తీసుకుని, ప్రతి కొత్త క్యాండిల్‌తో గీతను ముందుకు జరుపుతారు. దీన్ని సింపుల్ మూవింగ్ యావరేజ్ (SMA) అంటారు.\u003c/li>\n\u003cli>ధర MA పైన ఉంటే అప్‌ట్రెండ్ (uptrend) అని, కింద ఉంటే డౌన్‌ట్రెండ్ (downtrend) అని సూచన. 20 లేదా 50 వంటి పీరియడ్స్ (periods) వాడతారు.\u003c/li>\n\u003cli>MA వెనుక వచ్చే సూచిక (lagging indicator); ధర జరిగిన తర్వాతే అది స్పందిస్తుంది. రేంజ్ (range) మార్కెట్‌లో తప్పుడు సంకేతాలు ఎక్కువ.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD చివరి 5 రోజుల క్లోజింగ్ ధరలు: 1.1000, 1.1020, 1.1040, 1.1060, 1.1080. వీటి సగటు (5-period SMA) = 1.1040. ఇప్పుడు ధర 1.1080 వద్ద ఉంది, అంటే MA కంటే 40 పిప్స్ (pips) పైన ఉంది; ఇది అప్‌ట్రెండ్ సూచన. 1 స్టాండర్డ్ లాట్ (lot)లో 1 పిప్ ≈ 10 USD, కాబట్టి 40 పిప్స్ కదలిక ≈ 400 USD. అదే 0.01 మైక్రో లాట్‌లో 1 పిప్ ≈ 0.10 USD, అంటే 40 పిప్స్ ≈ 4 USD. ఇది కేవలం ఉదాహరణ; లాభం హామీ కాదు, నష్టం కూడా జరగవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>మూవింగ్ యావరేజ్ ధర సగటును చూపి ట్రెండ్‌ను సులభతరం చేస్తుంది.\u003c/li>\n\u003cli>ఇది వెనుకబడి వచ్చే సూచిక (lagging indicator); భవిష్యత్తును ఖచ్చితంగా చెప్పదు.\u003c/li>\n\u003cli>ఒంటరిగా కాకుండా స్టాప్ లాస్ (stop loss) మరియు రిస్క్ మేనేజ్‌మెంట్ (risk management) తో కలిపి నేర్చుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర 50-period MA కంటే కింద ఉంటే సాధారణంగా అది ఏ ట్రెండ్‌ను సూచిస్తుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> డౌన్‌ట్రెండ్ (downtrend) ను సూచిస్తుంది.\u003c/p>","t":"మూవింగ్ యావరేజెస్ (Moving Averages)","g":{"en":"\n\u003cp>Moving averages help smooth gold price noise and identify trends. For example, when the 50-period MA crosses above the 200-period MA on XAUUSD, it signals potential uptrend—if gold rises from $2,000 to $2,050, that's a 500-pip gain worth $5,000 per lot. \u003cstrong>Risk tip:\u003c/strong> Always use stop-losses below support levels to protect against sudden reversals in volatile precious metals markets.\u003c/p>\n","te":"\n\u003cp>సోన్నపై [Moving Averages] వాడటం చాలా ఉపయోగకరం. ఉదాహరణకు, 50-రోజుల సగటు ₹2,000కు పైన ఉంటే, ధర పెరిగే సంకేతం. 100 [lot] ఉంటే, 50 [pips] లాభం = $500. కానీ మార్కెట్ విపరీతం పోతుంది - ఎప్పుడూ [Stop Loss] ఉపయోగించండి!\u003c/p>\n"}},"16":{"en":"\u003cp>Moving averages smooth out price noise so beginners can see the trend more clearly. The two most common types are the Simple Moving Average (SMA) and the Exponential Moving Average (EMA). When a faster average crosses a slower one, traders often treat it as a possible sign that momentum is shifting. This lesson is education only, not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"Price trending up with a fast average crossing above a slow average\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>SMA:\u003c/strong> the plain average of the last N closing prices. Every candle has equal weight, so it reacts more slowly.\u003c/li>\n\u003cli>\u003cstrong>EMA:\u003c/strong> gives more weight to recent prices, so it reacts faster to new moves but can also give more false signals.\u003c/li>\n\u003cli>\u003cstrong>Crossover:\u003c/strong> when a fast average (e.g. 20) rises above a slow one (e.g. 50), it is called a bullish cross. When it falls below, it is a bearish cross. Crossovers lag price and often fail in sideways markets.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD trades at 1.0800 when the 20 EMA crosses above the 50 EMA. A trader who studies this signal buys 1 mini lot (10,000 units), where 1 pip is about $1. Price rises to 1.0860, a gain of 60 pips, or about $60. If instead the signal fails and price falls to 1.0770, the loss is 30 pips, or about $30. A pre-planned stop-loss at 1.0770 would have kept the loss to that amount. Real results vary, and losses can exceed expectations in fast markets.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>EMA reacts faster than SMA; SMA is smoother but slower.\u003c/li>\n\u003cli>Crossovers are lagging signals, not predictions.\u003c/li>\n\u003cli>They work best in trends and often mislead in ranges, so always manage risk.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Which average reacts faster to recent price changes, the EMA or the SMA?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The EMA, because it gives more weight to recent prices.\u003c/p>","te":"\n\u003cp>చార్ట్‌లో ధరల హెచ్చుతగ్గులను సులభంగా చూడడానికి మూవింగ్ యావరేజ్ (moving average) వాడతాం. అందులో రెండు రకాలు ఉన్నాయి: SMA మరియు EMA. ఈ పాఠంలో వాటి తేడా, రెండు యావరేజ్‌లు ఒకదాన్ని ఒకటి దాటినప్పుడు (crossover) ఏమి సూచిస్తాయో నేర్చుకుందాం. ఇది కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"వేగవంతమైన EMA నెమ్మదైన యావరేజ్‌ను పైకి దాటడం - అప్‌ట్రెండ్ సూచన\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>SMA (సింపుల్ మూవింగ్ యావరేజ్):\u003c/strong> గత కొన్ని క్యాండిల్స్ ముగింపు ధరల సాధారణ సగటు. అన్ని ధరలకూ సమాన ప్రాముఖ్యత. ఇది నెమ్మదిగా స్పందిస్తుంది.\u003c/li>\n\u003cli>\u003cstrong>EMA (ఎక్స్‌పొనెన్షియల్ మూవింగ్ యావరేజ్):\u003c/strong> ఇటీవలి ధరలకు ఎక్కువ ప్రాముఖ్యత ఇస్తుంది. అందుకే ధర మార్పులకు త్వరగా స్పందిస్తుంది, కానీ తప్పుడు సంకేతాలు (false signals) కూడా ఎక్కువ రావచ్చు.\u003c/li>\n\u003cli>\u003cstrong>క్రాస్‌ఓవర్ (crossover):\u003c/strong> వేగవంతమైన యావరేజ్ (ఉదా: 10) నెమ్మదైన దాన్ని (ఉదా: 50) పైకి దాటితే బుల్లిష్ (bullish) సూచన; కిందకు దాటితే బేరిష్ (bearish) సూచన. ఇవి ఖచ్చితమైన హామీలు కావు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD లో 10 EMA, 50 EMA ని పైకి దాటింది అనుకుందాం. ధర 1.0800 వద్ద ఉంది. ఒక ట్రేడర్ 1.0800 వద్ద కొని, స్టాప్ లాస్ (stop loss) ను 30 పిప్స్ (pips) కింద 1.0770 వద్ద పెట్టాడు. ఒక మినీ లాట్ (0.1 lot) లో 1 పిప్ ≈ $1. అంటే నష్టం గరిష్టంగా సుమారు $30. ధర 60 పిప్స్ పెరిగితే లాభం సుమారు $60. కానీ రేంజ్ మార్కెట్‌లో ఇలాంటి క్రాస్‌ఓవర్లు తరచూ విఫలమవుతాయి, నష్టం కూడా రావచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>EMA వేగంగా, SMA నెమ్మదిగా స్పందిస్తాయి.\u003c/li>\n\u003cli>క్రాస్‌ఓవర్ ఒక సూచన మాత్రమే, గ్యారంటీ కాదు; ట్రెండ్ ఉన్నప్పుడే బాగా పనిచేస్తుంది.\u003c/li>\n\u003cli>ఫారెక్స్ అధిక రిస్క్ కలది; ఎల్లప్పుడూ స్టాప్ లాస్ వాడండి, ముందు డెమో ఖాతాలో ప్రాక్టీస్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర మార్పులకు త్వరగా స్పందించే యావరేజ్ ఏది: SMA లేదా EMA?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> EMA, ఎందుకంటే అది ఇటీవలి ధరలకు ఎక్కువ ప్రాముఖ్యత ఇస్తుంది.\u003c/p>","t":"EMA vs SMA & క్రాస్‌ఓవర్లు (Crossovers)","g":{"en":"\n\u003cp>EMA and SMA crossovers work well for gold trading. When a faster EMA crosses above a slower SMA, it signals potential uptrend entry. For example, if you buy 1 lot at $2000/oz with a 20-pip stop loss, your risk is $200 (20 pips × $0.10 × 100 oz). Always use stops to limit losses on crossover trades, as false signals occur frequently in volatile gold markets.\u003c/p>\n","te":"\n\u003cp>సువర్ణం [Gold/XAUUSD] వర్తకంలో [EMA] మరియు [SMA] క్రాస్‌ఓవర్‌లు ఎంత ఉపయోగకరమైనవో చూడండి. ఉదాహరణకు, 20-[EMA] 50-[SMA]ను పైనుండి క్రిందికి దాటినప్పుడు, ఇది డౌన్‌ట్రెండ్ సంకేతం. 1 [lot] వర్తకంలో 50 [pip] నష్టం $500 నష్టానికి సమానం. ఎల్లప్పుడు [stop-loss] నిర్ణయించుకోండి మరియు ఆర్థిక ప్రమాదాలను నిర్వహించండి.\u003c/p>\n"}},"17":{"en":"\u003cp>The Relative Strength Index (RSI) is a popular momentum indicator that shows how fast and how far price has moved recently. It is displayed as a line moving between 0 and 100. Beginners often use it to judge whether a move may be running out of steam. This lesson is for education only and is not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"dtop\" data-c=\"Price makes a higher high while momentum weakens, a classic RSI warning sign\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The scale:\u003c/strong> RSI is usually calculated over 14 candles. A reading above 70 is called \"overbought\" and below 30 is called \"oversold\".\u003c/li>\n\u003cli>\u003cstrong>What it suggests:\u003c/strong> Overbought means price rose quickly and may slow or pull back. Oversold means price fell quickly and may bounce. In a strong trend, RSI can stay extreme for a long time.\u003c/li>\n\u003cli>\u003cstrong>Divergence:\u003c/strong> If price makes a new high but RSI makes a lower high, momentum is fading. This can hint at a possible reversal, but it is not a guarantee.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine EUR/USD rises 120 pips over several days, from 1.0800 to 1.0920, and RSI reaches 76. Price then pushes to 1.0935, but RSI only reaches 68, which is a bearish divergence. A learner might watch for a pullback and practise on a demo account with a 0.1 lot (about $1 per pip). If price drops 40 pips, that is roughly $40 in the trade's favour. If price instead keeps rising 30 pips, that is about a $30 loss. This is why a stop-loss and small position size matter.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>RSI measures momentum on a 0 to 100 scale; 70 and 30 are common reference levels.\u003c/li>\n\u003cli>Overbought or oversold does not mean price must reverse, especially in strong trends.\u003c/li>\n\u003cli>Use RSI together with other tools, such as trend lines and support and resistance, and always manage risk.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> RSI reads 82 during a strong uptrend. Does that mean price will definitely fall?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> No. An overbought reading only shows strong recent momentum. In strong trends RSI can stay high for a long time, so it should be confirmed with other signals.\u003c/p>","te":"\u003cp>RSI (Relative Strength Index) అనేది ధర ఎంత వేగంగా పెరుగుతోందో లేదా తగ్గుతోందో చూపించే ఒక సాధనం. ఇది 0 నుండి 100 మధ్య ఒక సంఖ్యగా కనిపిస్తుంది. ఇది విద్యా సమాచారం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది.\u003c/p>\n\u003cfigure data-k=\"range\" data-c=\"ధర రేంజ్‌లో కదులుతున్నప్పుడు RSI ఓవర్‌బాట్, ఓవర్‌సోల్డ్ జోన్లను తాకడం\">\u003c/figure>\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>70 పైన:\u003c/strong> ధర చాలా వేగంగా పెరిగింది, దీనిని ఓవర్‌బాట్ (overbought) అంటారు. ధర కొంత తగ్గే అవకాశం ఉండొచ్చు.\u003c/li>\n\u003cli>\u003cstrong>30 కింద:\u003c/strong> ధర చాలా వేగంగా పడింది, దీనిని ఓవర్‌సోల్డ్ (oversold) అంటారు. ధర కొంత పెరిగే అవకాశం ఉండొచ్చు.\u003c/li>\n\u003cli>\u003cstrong>గమనిక:\u003c/strong> బలమైన ట్రెండ్ (trend) లో RSI చాలా రోజులు 70 పైన లేదా 30 కింద ఉండిపోవచ్చు. కాబట్టి ఒక్క RSI చూసి మాత్రమే నిర్ణయం తీసుకోకూడదు. సాధారణంగా 14 పీరియడ్ల సెట్టింగ్ వాడతారు.\u003c/li>\n\u003c/ul>\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర రేంజ్‌లో ఉంది. RSI 28 కి పడింది (ఓవర్‌సోల్డ్). ఒక ట్రేడర్ ధర పెరగొచ్చని భావించి 1.0800 వద్ద కొనుగోలు చేశాడు. స్టాప్ లాస్ (stop loss) 20 పిప్స్ (pips) కింద, అంటే 1.0780 వద్ద పెట్టాడు. టేక్ ప్రాఫిట్ (take profit) 40 పిప్స్ పైన, 1.0840 వద్ద. 0.1 లాట్‌లో 1 పిప్ ≈ 1 USD అనుకుంటే, గరిష్ట నష్టం సుమారు 20 USD, లాభం సుమారు 40 USD. ధర వ్యతిరేకంగా వెళ్తే నష్టం కూడా జరగవచ్చు.\u003c/p>\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>RSI 0 నుండి 100 మధ్య ఉంటుంది; 70 పైన ఓవర్‌బాట్, 30 కింద ఓవర్‌సోల్డ్.\u003c/li>\n\u003cli>బలమైన ట్రెండ్‌లో RSI సంకేతాలు తప్పు కావచ్చు.\u003c/li>\n\u003cli>RSI తో పాటు స్టాప్ లాస్ (stop loss) మరియు ఇతర విశ్లేషణ వాడండి.\u003c/li>\n\u003c/ul>\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> RSI విలువ 75 ఉంటే దాని అర్థం ఏమిటి?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> ఇది ఓవర్‌బాట్ (overbought) స్థితి. ధర వేగంగా పెరిగిందని, కొంత తగ్గే అవకాశం ఉండొచ్చని సూచిస్తుంది, కానీ ఖచ్చితంగా తగ్గుతుందని కాదు.\u003c/p>","t":"RSI ఇండికేటర్ (RSI Indicator)","g":{"en":"\n\u003cp>The RSI indicator helps identify overbought/oversold conditions in gold trading. When XAUUSD RSI exceeds 70, gold may be overextended and due for a pullback; conversely, RSI below 30 suggests potential bounce opportunities. For example, if gold trades at $2,000 with RSI at 75, a 20-pip correction would mean a $2.00 loss per lot (100 oz). Always combine RSI with other analysis and use stop-losses to manage risk effectively.\u003c/p>\n","te":"\n\u003cp>సోने (XAUUSD) వర్తకంలో [RSI Indicator] అత్యంత ఉపయోగకరమైనది. ఉదాహరణకు, [RSI] 70 కంటే ఎక్కువ ఉంటే సోన [overbought] అవుతుంది - ధర తగ్గే సూచన. 1 [lot] = 100 oz వద్ద, $1900 వద్ద కొన్న సోన $1899 కు పడితే $10 నష్టం ([10 pips]). [RSI] ఏక సూచకంపై ఆధారపడకండి - ఇతర [indicators] సతీకరించండి మరియు [stop-loss] ఉపయోగించండి.\u003c/p>\n"}},"18":{"en":"\u003cp>The MACD (Moving Average Convergence Divergence) is a popular indicator that helps traders see the strength and direction of a trend. It shows how two moving averages of price relate to each other. This lesson is for education only, not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"dtop\" data-c=\"Price makes a higher high while momentum weakens, a classic MACD divergence\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The MACD line:\u003c/strong> the 12-period EMA minus the 26-period EMA. When it rises, short-term momentum is getting stronger than long-term momentum.\u003c/li>\n\u003cli>\u003cstrong>The signal line:\u003c/strong> a 9-period EMA of the MACD line. When MACD crosses above it, momentum is turning up. When it crosses below, momentum is turning down.\u003c/li>\n\u003cli>\u003cstrong>The histogram:\u003c/strong> the gap between the two lines, shown as bars. Growing bars suggest strengthening momentum, and shrinking bars suggest fading momentum. The zero line separates bullish from bearish territory.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine EUR/USD trades at 1.0800 when the MACD line crosses above its signal line. A trader who follows this signal buys 1 mini lot (10,000 units), where each pip is worth about $1. Price rises to 1.0850, a gain of 50 pips, or about $50. If instead the signal fails and price falls to 1.0770, the loss is 30 pips, or about $30. Many traders place a stop-loss to limit such losses. MACD signals are often wrong in sideways markets, so no single signal is a guarantee.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>MACD measures momentum using the difference between two EMAs.\u003c/li>\n\u003cli>Crossovers of the MACD and signal lines, and the histogram, show shifts in momentum.\u003c/li>\n\u003cli>It works best in trending markets and can give false signals in ranges, so it is often combined with other tools.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What does it usually suggest when the MACD line crosses below the signal line?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Bearish momentum may be building, meaning price could be weakening. It is a possible clue, not a certain prediction.\u003c/p>","te":"\n\u003cp>MACD (Moving Average Convergence Divergence) అనేది ధర ఏ దిశలో వెళ్తోంది, దాని వేగం పెరుగుతోందా తగ్గుతోందా అని చూపించే ప్రసిద్ధ ఇండికేటర్ (indicator). ఇది రెండు మూవింగ్ యావరేజ్‌ల (moving average) మధ్య దూరాన్ని కొలుస్తుంది. ఇది విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంది.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"ధర పైకి వెళ్తున్నప్పుడు MACD కూడా పైకి కదులుతుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>MACD లైన్ (MACD line):\u003c/strong> 12 కాలాల EMA నుండి 26 కాలాల EMA ను తీసివేస్తే వచ్చే విలువ. ఇది ట్రెండ్ వేగాన్ని చూపుతుంది.\u003c/li>\n\u003cli>\u003cstrong>సిగ్నల్ లైన్ (signal line):\u003c/strong> MACD లైన్ యొక్క 9 కాలాల యావరేజ్. MACD లైన్ దీనిని పైకి దాటితే బుల్లిష్ (bullish) సూచన, కిందికి దాటితే బేరిష్ (bearish) సూచన.\u003c/li>\n\u003cli>\u003cstrong>హిస్టోగ్రామ్ (histogram):\u003c/strong> రెండు లైన్ల మధ్య తేడాను బార్లుగా చూపుతుంది. బార్లు పెద్దవైతే మొమెంటం బలంగా ఉంది; చిన్నవైతే బలహీనపడుతోంది. జీరో లైన్ (zero line) పైన ఉంటే సాధారణంగా అప్‌ట్రెండ్, కింద ఉంటే డౌన్‌ట్రెండ్.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.0800 వద్ద ఉందనుకోండి. MACD లైన్ సిగ్నల్ లైన్‌ను పైకి దాటింది. ఒక ట్రేడర్ 1 స్టాండర్డ్ లాట్ (standard lot)తో కొనుగోలు చేసి, స్టాప్ లాస్ (stop loss) 30 పిప్స్ (pips) కింద పెట్టాడు. 1 లాట్‌లో ప్రతి పిప్ విలువ సుమారు $10. ధర 60 పిప్స్ పెరిగితే లాభం సుమారు $600. స్టాప్ లాస్ తగిలితే నష్టం సుమారు $300. MACD సిగ్నల్స్ ఎప్పుడూ సరిగ్గా ఉండవు; రేంజ్ మార్కెట్‌లో (range market) తప్పుడు సిగ్నల్స్ ఎక్కువ వస్తాయి.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>MACD ట్రెండ్ దిశను మరియు మొమెంటంను చూపుతుంది.\u003c/li>\n\u003cli>లైన్ల క్రాస్‌ఓవర్ (crossover) మరియు హిస్టోగ్రామ్ మార్పులను గమనించాలి.\u003c/li>\n\u003cli>ఇది వెనుకబడి వచ్చే (lagging) ఇండికేటర్; ఎల్లప్పుడూ స్టాప్ లాస్ వాడి రిస్క్ నియంత్రించండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> MACD లైన్ సిగ్నల్ లైన్‌ను కిందికి దాటితే సాధారణంగా అది ఏ సూచన?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> బేరిష్ (bearish) సూచన, అంటే పైకి వెళ్లే మొమెంటం బలహీనపడి ధర తగ్గే అవకాశం ఉందని అర్థం.\u003c/p>","t":"MACD – ట్రెండ్ మరియు మొమెంటం సూచిక","g":{"en":"\n\u003cp>The MACD indicator helps traders identify gold trend changes and momentum shifts. For example, when MACD crosses above the signal line on XAUUSD, it may signal an uptrend—if gold rises from $2,000 to $2,010, that's a 100-pip gain worth $1,000 per lot. Always use stop-losses to protect against false signals; gold can be volatile, and unexpected geopolitical events may cause sharp reversals that exceed your risk tolerance.\u003c/p>\n","te":"\n\u003cp>సోने (XAUUSD) వర్తకంలో [MACD] సూచిక ట్రెండ్ మార్పులను గుర్తించడానికి సహాయపడుతుంది. ఉదాహరణకు, [MACD] [signal line] పైకి క్రాస్ చేసినప్పుడు, ఇది కొనుగోలు సంకేతం ఇవ్వచ్చు - ఒక [lot] (100 అౌన్సుల) కోసం $10 లాభం 100 [pips] పర్యంతం సాధ్యమవుతుంది. అయితే, [MACD] ఏకకాలంలో [overbought] లేదా [oversold] నుండి రాకపోయినట్లు ధృవీకరించండి, ఎందుకంటే తప్పు సంకేతాలు నష్టానికి దారితీస్తాయి.\u003c/p>\n"}},"19":{"en":"\u003cp>Bollinger Bands are a popular tool that shows how far price has stretched from its recent average. They help beginners see when a market is calm, when it is active, and when price may be unusually far from normal. This lesson is for education only, not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price moving between the upper and lower Bollinger Bands in a range\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Three lines:\u003c/strong> A middle line (usually a 20-period simple moving average) plus an upper and lower band, typically set 2 standard deviations away from it.\u003c/li>\n\u003cli>\u003cstrong>Width shows volatility:\u003c/strong> Bands that squeeze together suggest a quiet market. Bands that widen suggest bigger price swings.\u003c/li>\n\u003cli>\u003cstrong>Touching a band is not a signal by itself:\u003c/strong> In a range, price often turns back toward the middle line. In a strong trend, price can \"walk\" along a band for a long time.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Say EUR/USD has been moving sideways. The middle line sits at 1.0850, the upper band at 1.0890, and the lower band at 1.0810. That is a band width of 80 pips. Price drops to touch the lower band at 1.0810, and a learner watching a practice account notes a possible bounce toward the middle line, 40 pips away.\u003c/p>\n\u003cp>On a standard 100,000-unit lot, one pip is about $10, so 40 pips is about $400. On a micro lot (1,000 units), one pip is about $0.10, so 40 pips is about $4. If the trend were strong and price kept falling, a 30-pip move against the idea would cost about $3 on a micro lot. This shows why the bands alone are unreliable and why risk limits matter.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Bollinger Bands measure volatility and how stretched price is relative to its average.\u003c/li>\n\u003cli>A band touch is a prompt to look closer, not an automatic buy or sell signal.\u003c/li>\n\u003cli>Always practice on a demo account and limit risk on every trade.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What does it usually mean when the Bollinger Bands squeeze closer together?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Volatility is low and the market is quiet. A larger price move may follow, but the bands do not show which direction it will go.\u003c/p>","te":"\n\u003cp>బాలింజర్ బ్యాండ్స్ (Bollinger Bands) అనేది చార్ట్ మీద కనిపించే మూడు గీతల సాధనం. ఇది ధర ఎంత వేగంగా, ఎంత పరిధిలో కదులుతోందో చూపిస్తుంది. ఇది విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో అధిక రిస్క్ ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ధర పై మరియు కింది బ్యాండ్ల మధ్య కదులుతున్న రేంజ్ (range)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>మూడు గీతలు:\u003c/strong> మధ్యలో 20 కాలాల సాధారణ సగటు (20-period moving average), దాని పైన అప్పర్ బ్యాండ్ (upper band), కింద లోయర్ బ్యాండ్ (lower band). బ్యాండ్లు సాధారణంగా సగటుకు 2 స్టాండర్డ్ డీవియేషన్ (standard deviation) దూరంలో ఉంటాయి.\u003c/li>\n\u003cli>\u003cstrong>వెడల్పు మారుతుంది:\u003c/strong> మార్కెట్ ఎక్కువ కదిలితే బ్యాండ్లు విశాలమవుతాయి; నిశ్శబ్దంగా ఉంటే ఇరుకవుతాయి (squeeze). ఇరుకైన తర్వాత పెద్ద కదలిక రావచ్చు, కానీ ఏ దిశలో అనేది ఖచ్చితంగా చెప్పలేం.\u003c/li>\n\u003cli>\u003cstrong>బ్యాండ్ తాకడం:\u003c/strong> ధర అప్పర్ బ్యాండ్ తాకితే \"ఎక్కువగా పెరిగింది\" అనిపించవచ్చు, కానీ బలమైన ట్రెండ్ (trend) లో ధర బ్యాండ్ వెంటే సాగుతుంది. కాబట్టి ఇది ఒక్కటే సంకేతం కాదు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD మధ్య గీత 1.1000, అప్పర్ బ్యాండ్ 1.1040, లోయర్ బ్యాండ్ 1.0960 అనుకుందాం. అంటే బ్యాండ్ల మధ్య దూరం 80 పిప్స్ (pips). ధర 1.0962 దగ్గర లోయర్ బ్యాండ్ను తాకి పైకి తిరిగితే, ఒక ట్రేడర్ 0.10 లాట్ (lot) తో కొనవచ్చు (1 పిప్ ≈ $1). స్టాప్ లాస్ (stop loss) 15 పిప్స్ కింద పెడితే గరిష్ట నష్టం సుమారు $15. లక్ష్యం మధ్య గీత 1.1000 అయితే లాభం సుమారు 38 పిప్స్ ≈ $38. ఇది కేవలం ఉదాహరణ; ఫలితం హామీ కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>బాలింజర్ బ్యాండ్స్ ధర యొక్క ఊగిసలాట (volatility) ను చూపుతాయి.\u003c/li>\n\u003cli>బ్యాండ్ తాకడం అంటే వెంటనే రివర్సల్ (reversal) అని కాదు.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ వాడండి మరియు ఇతర సాధనాలతో నిర్ధారించుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> మార్కెట్ నిశ్శబ్దంగా ఉన్నప్పుడు బాలింజర్ బ్యాండ్స్ ఎలా కనిపిస్తాయి?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> బ్యాండ్లు ఇరుకుగా (squeeze) అవుతాయి, అంటే ఊగిసలాట తక్కువగా ఉందని అర్థం.\u003c/p>","t":"బాలింజర్ బ్యాండ్స్ (Bollinger Bands)","g":{"en":"\n\u003cp>Bollinger Bands help identify overbought/oversold conditions in gold. When XAUUSD price touches the upper band around $2,050, it may signal a pullback opportunity. For example, if bands show 20-pip width ($2.00), consider tighter stops of 15 pips ($1.50 loss per lot) to protect against false breakouts. \u003cstrong>Risk tip:\u003c/strong> Gold volatility spikes during economic data releases; avoid trading Bollinger Band bounces during major announcements.\u003c/p>\n","te":"\n\u003cp>\nగోల్డ్ ట్రేడింగ్‌లో [Bollinger Bands] అంటే ధరల చేపట్టిన సీమలను చూడటం. ఉదాహరణకు, ఒక [lot] గోల్డ్ ధర [upper band] స్పర్శించినప్పుడు, అది అధిక విలువ సూచిస్తుంది. అప్పుడు విక్రయించిన 1 [lot] $50 లాభం ఇవ్వచ్చు. కానీ [bands] ఎల్లప్పుడు సరిగా పని చేయవు, కాబట్టి ఎల్లప్పుడు [stop loss] ఉపయోగించండి.\n\u003c/p>\n"}},"20":{"en":"\u003cp>The Stochastic Oscillator is a momentum indicator that compares a currency pair's latest closing price to its price range over a set period, usually 14 candles. It moves between 0 and 100 and helps beginners see when a move may be running out of steam. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price moving sideways in a range, where stochastic signals are often most useful\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Two lines:\u003c/strong> The fast line (%K) shows where price closed within its recent range. The slower line (%D) is a moving average of %K and smooths out the noise.\u003c/li>\n\u003cli>\u003cstrong>Zones:\u003c/strong> A reading above 80 is called \"overbought\" and below 20 is called \"oversold.\" These are warnings that momentum is stretched, not automatic reasons to trade.\u003c/li>\n\u003cli>\u003cstrong>Crossovers:\u003c/strong> When %K crosses %D inside an extreme zone, some traders see it as an early hint that momentum is shifting. In a strong trend, the indicator can stay overbought or oversold for a long time, so signals often fail.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine EUR/USD bounces between 1.0800 and 1.0900 for several days. Price rises to 1.0890 and the stochastic reads 88 with %K crossing below %D. A learner might note this as a possible pause or pullback. If price then falls 40 pips to 1.0850, a position of 10,000 units (a micro lot, about $0.10 per pip) would show a move of about $4. If price instead broke out to 1.0930, the same position would be down about 40 pips, or $4, if it was a short trade. The signal is only a clue, and losses are always possible.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Stochastic measures momentum on a 0 to 100 scale, with 80 and 20 as common zones.\u003c/li>\n\u003cli>It tends to work better in sideways markets than in strong trends.\u003c/li>\n\u003cli>Use it alongside other tools, and always consider risk before acting.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> A stochastic reading of 15 suggests which condition?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Oversold. Price is closing near the bottom of its recent range, which may hint at a bounce, but it is not a guarantee, especially in a strong downtrend.\u003c/p>","te":"\n\u003cp>స్టోకాస్టిక్ ఆసిలేటర్ (Stochastic Oscillator) అనేది ఒక మొమెంటమ్ ఇండికేటర్ (momentum indicator). ఇటీవలి కాలంలో ధర తన అత్యధిక, అత్యల్ప స్థాయిల మధ్య ఎక్కడ ముగిసిందో ఇది 0 నుండి 100 మధ్య చూపిస్తుంది. ఇది విద్యా ప్రయోజనం కోసం మాత్రమే; ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ధర రేంజ్‌లో కదులుతున్నప్పుడు స్టోకాస్టిక్ బాగా పనిచేస్తుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>రెండు లైన్లు ఉంటాయి: %K (వేగవంతమైన లైన్) మరియు %D (నెమ్మదైన సగటు లైన్). సాధారణ సెట్టింగ్ 14,3,3.\u003c/li>\n\u003cli>80 పైన ఉంటే ఓవర్‌బాట్ (overbought), 20 కింద ఉంటే ఓవర్‌సోల్డ్ (oversold) అని భావిస్తారు. అంటే ధర మలుపు తిరిగే అవకాశం ఉండొచ్చు, కానీ ఖచ్చితం కాదు.\u003c/li>\n\u003cli>%K లైన్ %D ని దాటినప్పుడు (crossover) సంకేతంగా చూస్తారు. బలమైన ట్రెండ్ (trend) లో ఇది చాలాసార్లు తప్పుడు సంకేతాలు ఇస్తుంది, అందుకే రేంజ్ మార్కెట్‌లో ఎక్కువ ఉపయోగపడుతుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD 1.0800 నుండి 1.0850 మధ్య రేంజ్‌లో తిరుగుతోంది అనుకుందాం. ధర 1.0805 దగ్గర ఉండగా స్టోకాస్టిక్ 15 కి పడి, పైకి క్రాస్ అయింది. ఒక ట్రేడర్ ఉదాహరణకు 1.0808 వద్ద కొని, స్టాప్ లాస్ (stop loss) 1.0790 (18 పిప్స్) పెట్టి, టార్గెట్ 1.0845 (37 పిప్స్) అనుకున్నాడు. 0.1 లాట్ (lot) కు 1 పిప్ ≈ 1 USD కాబట్టి, రిస్క్ సుమారు 18 USD, సంభావ్య లాభం సుమారు 37 USD. ధర వేరే దిశలో వెళ్తే నష్టం కూడా జరగవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>స్టోకాస్టిక్ 0 నుండి 100 మధ్య మొమెంటమ్‌ను చూపిస్తుంది.\u003c/li>\n\u003cli>80 పైన, 20 కింద ఉన్నప్పుడు మలుపు సూచన కావచ్చు, కానీ హామీ కాదు.\u003c/li>\n\u003cli>ఎప్పుడూ స్టాప్ లాస్ వాడండి, ఇతర సాధనాలతో నిర్ధారించుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> స్టోకాస్టిక్ 15 వద్ద ఉంటే అది ఏ స్థితిని సూచిస్తుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> ఓవర్‌సోల్డ్ (oversold) స్థితి. ధర పైకి మలుపు తిరిగే అవకాశం ఉండొచ్చు, కానీ అది ఖచ్చితం కాదు.\u003c/p>","t":"స్టోకాస్టిక్ ఆసిలేటర్ (Stochastic Oscillator)","g":{"en":"\n\u003cp>The Stochastic Oscillator helps identify gold overbought/oversold conditions. When XAUUSD reaches overbought levels above 80, consider potential reversals. For example, if gold rallies to $2,050 with Stochastic above 80, a pullback of just 5 pips ($0.50 per lot) could signal a correction. Always use stop losses—unexpected news can reverse extremes quickly, risking significant losses on leveraged positions.\u003c/p>\n","te":"\n\u003cp>సోने వర్తకంలో [Stochastic Oscillator] 0-100 స్కేల్‌లో ధర చలనం చూపిస్తుంది. [Overbought] (80+ పై) అయిన సోన ధర పడిపోవచ్చు, [oversold] (20 కిందకి) అయిన సోన ధర పైకి వెళ్లవచ్చు. ఉదాహరణకు, సోన ధర $1900 వద్ద [oscillator] 85 చూపిస్తే, [pullback] కోసం ఎదురుచూడండి - 50 [pips] ($5) డ్రాప్ సాధ్యం. ప్రమాదం: [indicator] ఒక్కటే ఆధారంగా వర్తకం చేయవద్దు, ఎక్కువ సూచికలను సంయోగం చేయండి.\u003c/p>\n"}},"21":{"en":"\u003cp>Fibonacci retracement is a charting tool that helps traders estimate how far a price might pull back before continuing in its original direction. It is based on a series of ratios, and many traders watch the same levels, which is why price sometimes reacts near them. It is a guide, not a prediction. Forex trading is high risk, and this lesson is for education only, not financial advice.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"An uptrend pulls back to a Fibonacci level before moving higher again\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Pick two points:\u003c/strong> In an uptrend, anchor the tool at the swing low and drag it to the swing high. In a downtrend, do the reverse.\u003c/li>\n\u003cli>\u003cstrong>Read the levels:\u003c/strong> The common retracement levels are 23.6%, 38.2%, 50%, 61.8% and 78.6%. They mark possible pullback zones.\u003c/li>\n\u003cli>\u003cstrong>Watch the reaction:\u003c/strong> Traders look for signs such as slowing momentum or reversal candles near a level. Price often ignores levels, so never rely on one tool alone.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD rises from 1.0800 to 1.1000, a move of 200 pips. A 38.2% retracement is about 76 pips, so the level sits near 1.0924. A 61.8% retracement is about 124 pips, so it sits near 1.0876. If price pulls back to 1.0924 and shows signs of bouncing, a trader might study that area. On a standard lot, one pip is worth about $10, so a 76-pip pullback equals roughly $760 of price movement per lot. If the level fails, losses can be just as large, which is why risk limits matter.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Fibonacci levels highlight possible pullback zones, not guaranteed turning points.\u003c/li>\n\u003cli>Always draw from swing low to swing high in an uptrend, and the reverse in a downtrend.\u003c/li>\n\u003cli>Combine the tool with other analysis and sound risk management.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> A pair rises from 1.2000 to 1.2100 (100 pips). Where is the 50% retracement level?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Half of 100 pips is 50 pips, so the level is at 1.2050.\u003c/p>","te":"\n\u003cp>ధర ఒక పెద్ద కదలిక చేశాక, కొంత వెనక్కి తగ్గి మళ్లీ ముందుకు వెళ్లడం తరచుగా చూస్తాం. ఈ వెనక్కి తగ్గే స్థాయిలను అంచనా వేయడానికి ట్రేడర్లు ఫిబొనాచి రిట్రేస్‌మెంట్ (Fibonacci Retracement) టూల్ వాడతారు. ఇది విద్యా సమాచారం మాత్రమే, ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"అప్‌ట్రెండ్‌లో ధర వెనక్కి తగ్గి మళ్లీ పైకి వెళ్లడం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>మొదట ఒక స్పష్టమైన కదలికలో స్వింగ్ లో (swing low), స్వింగ్ హై (swing high) మధ్య టూల్‌ను గీయాలి.\u003c/li>\n\u003cli>చార్ట్‌పై 38.2%, 50%, 61.8% వంటి లెవెల్స్ (levels) కనిపిస్తాయి. ధర వెనక్కి తగ్గితే ఇక్కడ ఆగవచ్చని ట్రేడర్లు చూస్తారు.\u003c/li>\n\u003cli>ఇవి కచ్చితమైన హామీలు కావు. ధర ఈ లెవెల్స్ వద్ద ఆగకుండా దాటిపోవచ్చు కూడా. కాబట్టి ఇతర సంకేతాలతో కలిపి చూడాలి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 నుండి 1.1200 వరకు పెరిగింది (200 పిప్స్ (pips)). 61.8% రిట్రేస్‌మెంట్ అంటే 200 × 0.618 ≈ 124 పిప్స్ వెనక్కి, అంటే సుమారు 1.1076 వద్ద. ఇక్కడ ధర ఆగుతుందేమో అని గమనించవచ్చు. 1 స్టాండర్డ్ లాట్ (standard lot)లో ఒక పిప్ సుమారు $10 విలువ. కాబట్టి 124 పిప్స్ వెనకడుగు అంటే సుమారు $1,240 హెచ్చుతగ్గు. చిన్న లాట్ సైజ్ వాడితే ఈ నష్టభయం తగ్గుతుంది. స్టాప్ లాస్ (stop loss) ఎప్పుడూ పెట్టుకోవాలి.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ఫిబొనాచి లెవెల్స్ సంభావ్య సపోర్ట్ (support), రెసిస్టెన్స్ (resistance) ప్రాంతాలను సూచిస్తాయి.\u003c/li>\n\u003cli>38.2%, 50%, 61.8% అత్యంత ప్రాచుర్యం పొందిన లెవెల్స్.\u003c/li>\n\u003cli>ఇది అంచనా సాధనం మాత్రమే. ఫారెక్స్ (forex) అధిక రిస్క్ కలది, రిస్క్ మేనేజ్‌మెంట్ తప్పనిసరి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర 1.3000 నుండి 1.3100 వరకు పెరిగితే, 50% రిట్రేస్‌మెంట్ లెవెల్ ఎంత?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> కదలిక 100 పిప్స్, దానిలో సగం 50 పిప్స్. కాబట్టి 1.3100 − 0.0050 = 1.3050.\u003c/p>","t":"ఫిబొనాచి రిట్రేస్‌మెంట్ (Fibonacci Retracement)","g":{"en":"\n\u003cp>Fibonacci retracement helps identify potential support levels in gold trading. If XAUUSD drops from $2,000 to $1,900, the 61.8% retracement level sits around $1,939. Traders watch for bounces here. \u003cstrong>Risk tip:\u003c/strong> Always use stop-losses below key Fibonacci levels—never risk more than 1-2% of your account per trade, especially with gold's volatility.\u003c/p>\n","te":"\n\u003cp>సోने (XAUUSD) [gold] ధరలు నిండా కొంచెం పెరిగిన అనంతరం ఆ పెరుగుదల కొంత తిరిగి వస్తుంది. ఉదాహరణకు, సోన ధర $2000 నుండి $2050 వరకు పెరిగితే, [fibonacci retracement] సూచిస్తుంది $2035 (50% స్థాయిలో) ఇక్కడ ధర తిరిగి వచ్చవచ్చు. మీరు [1 lot] కోసం $500 ఖర్చు చేయకండి - [risk management] చేసి [stop loss] ఉపయోగించండి.\u003c/p>\n"}},"22":{"en":"\u003cp>Pivot points are price levels calculated from the previous day's high, low, and close. Many traders watch them as possible areas where price might pause, bounce, or break through. They are a tool for reading the market, not a prediction of what will happen. Forex is high risk, and this lesson is for education only, never financial advice.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price bouncing between support and resistance levels, as pivot points often frame\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The main pivot (P):\u003c/strong> P = (High + Low + Close) ÷ 3, using yesterday's values. Traders often view price above P as more bullish and price below P as more bearish.\u003c/li>\n\u003cli>\u003cstrong>Support and resistance:\u003c/strong> R1 = (2 × P) − Low and S1 = (2 × P) − High. These mark possible ceilings and floors for the day.\u003c/li>\n\u003cli>\u003cstrong>Not guaranteed:\u003c/strong> Price can bounce off a level, slice through it, or ignore it. Many traders combine pivots with other tools.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD yesterday had a high of 1.1100, a low of 1.1000, and a close of 1.1040.\u003c/p>\n\u003cul>\n\u003cli>P = (1.1100 + 1.1000 + 1.1040) ÷ 3 = \u003cstrong>1.1047\u003c/strong>\u003c/li>\n\u003cli>R1 = (2 × 1.1047) − 1.1000 = \u003cstrong>1.1094\u003c/strong>\u003c/li>\n\u003cli>S1 = (2 × 1.1047) − 1.1100 = \u003cstrong>1.0994\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>The distance from P to R1 is about 47 pips. On a standard lot (100,000 units), 1 pip is roughly $10, so 47 pips is about $470. On a micro lot (1,000 units), 1 pip is about $0.10, so 47 pips is about $4.70. Gains and losses work the same way, so a move against you costs real money.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Pivot points are calculated from the prior day's high, low, and close.\u003c/li>\n\u003cli>They show potential support and resistance zones, not certainties.\u003c/li>\n\u003cli>Always manage risk, since any level can fail.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Yesterday's high was 1.2050, low was 1.1950, and close was 1.2000. What is the pivot point P?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> (1.2050 + 1.1950 + 1.2000) ÷ 3 = 3.6000 ÷ 3 = \u003cstrong>1.2000\u003c/strong>.\u003c/p>","te":"\n\u003cp>పివట్ పాయింట్స్ (pivot points) అనేవి నిన్నటి ధరల ఆధారంగా ఈ రోజు ధర ఎక్కడ ఆగవచ్చో లేదా తిరగవచ్చో అంచనా వేయడానికి వాడే సులభమైన గీతలు. చాలా మంది ట్రేడర్లు ఒకే స్థాయిలను చూస్తారు కాబట్టి ఇవి ఉపయోగపడతాయి. ఇది కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ధర పివట్ చుట్టూ సపోర్ట్, రెసిస్టెన్స్ మధ్య తిరుగుతోంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>నిన్నటి హై (High), లో (Low), క్లోజ్ (Close) తీసుకుని పివట్ (P) లెక్కిస్తారు: P = (H + L + C) ÷ 3.\u003c/li>\n\u003cli>దీని నుండి రెసిస్టెన్స్ (R1) = (2 × P) − L, మరియు సపోర్ట్ (S1) = (2 × P) − H వస్తాయి. ఇవి ధర ఆగే అవకాశం ఉన్న స్థాయిలు.\u003c/li>\n\u003cli>ధర పివట్ పైన ఉంటే మార్కెట్ బలంగా (bullish), కింద ఉంటే బలహీనంగా (bearish) ఉందని సూచన. ఇది ఖచ్చితం కాదు, కేవలం సూచన మాత్రమే.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD నిన్న: హై 1.1050, లో 1.0950, క్లోజ్ 1.1000 అనుకుందాం.\u003c/p>\n\u003cul>\n\u003cli>P = (1.1050 + 1.0950 + 1.1000) ÷ 3 = 1.1000\u003c/li>\n\u003cli>R1 = (2 × 1.1000) − 1.0950 = 1.1050\u003c/li>\n\u003cli>S1 = (2 × 1.1000) − 1.1050 = 1.0950\u003c/li>\n\u003c/ul>\n\u003cp>ధర 1.1000 పైన ఉండి R1 (1.1050) వైపు వెళ్తే, పివట్ నుండి R1 వరకు 50 పిప్స్ (pips) దూరం. 1 స్టాండర్డ్ లాట్ (standard lot)లో 1 పిప్ ≈ 10 USD, కాబట్టి 50 పిప్స్ ≈ 500 USD లాభం లేదా నష్టం కావచ్చు. చిన్న లాట్‌లో ఇది తక్కువ ఉంటుంది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>పివట్ పాయింట్స్ నిన్నటి హై, లో, క్లోజ్ నుండి లెక్కిస్తారు.\u003c/li>\n\u003cli>S1, R1 సంభావ్య సపోర్ట్, రెసిస్టెన్స్ స్థాయిలుగా పనిచేస్తాయి, కానీ హామీ లేదు.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ (stop loss) వాడండి; ఫారెక్స్ అధిక రిస్క్ కలిగినది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> హై 1.2050, లో 1.1950, క్లోజ్ 1.2000 అయితే పివట్ (P) ఎంత?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> (1.2050 + 1.1950 + 1.2000) ÷ 3 = 1.2000.\u003c/p>","t":"పివట్ పాయింట్స్ (Pivot Points)","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>Pivot points help identify potential support and resistance levels for gold trading. For example, if gold's daily pivot is calculated at $2,050, traders might watch for bounces near this level. With 1 lot = 100 oz and 1 pip = $0.10, a 50-pip move equals $5,000 profit or loss. Always use stop-losses below support levels to manage risk when pivot levels fail.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>సోने కోసం [pivot points] ఉపయోగించడం ఆధారభూత స్థాయిలను కనుగొనడానికి సహాయపడుతుంది. ఉదాహరణకు, [pivot point] $2000 వద్ద ఉంటే, [resistance] $2005 (50 పిప్‌లు = $5) కి ఉండవచ్చు. ఈ స్థాయిలు [entry] మరియు [exit] నిర్ణయాలకు గైడ్‌గా ఉపయోగించబడతాయి. ఎప్పుడూ ఈ స్థాయిల మీద ఆధారపడకుండా, [risk management] మరియు [stop loss] ఆచరణ చేయండి.\u003c/p>\n"}},"23":{"en":"\u003cp>Volume shows how much trading activity happens in a market. In forex there is no single central exchange, so true volume is hard to measure. Most charting platforms show \u003cstrong>tick volume\u003c/strong> instead: the number of price changes (ticks) in each candle. Beginners often use it as a rough gauge of how busy the market is.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"A breakout candle with a surge in tick volume may show stronger participation.\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Tick volume counts updates, not lots.\u003c/strong> A candle with 1,200 price changes was busier than one with 300, but the count does not tell you how much money was traded.\u003c/li>\n\u003cli>\u003cstrong>Rising volume can add weight to a move.\u003c/strong> A breakout above a range on high tick volume is often treated as more convincing than one on low volume, though it is never a guarantee.\u003c/li>\n\u003cli>\u003cstrong>Volume follows the clock.\u003c/strong> Activity is usually higher during the London and New York sessions and lower late in the day, so compare candles from similar times.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD trades in a range between 1.0800 and 1.0850 (50 pips). Typical hourly candles show about 400 ticks. Then one candle closes at 1.0865 with 1,100 ticks, a break of 15 pips above the range. A learner might note that the heavy volume supports the breakout. For a standard lot (100,000 units), 15 pips is about $150 at roughly $10 per pip, and a move against you could cost the same. Volume is one clue, and the price can still reverse. This is an illustration only, not a trade suggestion.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Tick volume counts price changes and is a proxy for activity, not true traded volume.\u003c/li>\n\u003cli>Higher volume during a breakout may signal stronger interest, but it can still fail.\u003c/li>\n\u003cli>Compare volume across similar sessions and combine it with other tools. Forex is high risk, and this lesson is education, not financial advice.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What does tick volume measure on a forex chart?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The number of price changes (ticks) during a candle, which serves as a rough indicator of market activity rather than the actual amount traded.\u003c/p>","te":"\n\u003cp>మార్కెట్‌లో ధర ఎంత కదిలింది అనేదానితో పాటు, ఎంత యాక్టివిటీ జరిగిందో కూడా తెలుసుకోవడం ముఖ్యం. దానిని వాల్యూమ్ (volume) చూపిస్తుంది. ఈ పాఠం విద్యా ఉద్దేశం కోసం మాత్రమే; ఇది ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) ట్రేడింగ్‌లో అధిక రిస్క్ ఉంది.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"బ్రేక్‌అవుట్ సమయంలో వాల్యూమ్ పెరగడం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>ఫారెక్స్ మార్కెట్ కేంద్రీకృత ఎక్స్ఛేంజ్ కాదు, కాబట్టి మొత్తం నిజమైన వాల్యూమ్ (real volume) అందుబాటులో ఉండదు. అందుకే బ్రోకర్లు \u003cstrong>టిక్ వాల్యూమ్ (tick volume)\u003c/strong> చూపిస్తారు.\u003c/li>\n\u003cli>టిక్ వాల్యూమ్ అంటే ఒక క్యాండిల్ (candle) సమయంలో ధర ఎన్నిసార్లు మారిందో లెక్క. ఇది ట్రేడ్ సైజ్ (size) కాదు, ధర మార్పుల సంఖ్య మాత్రమే.\u003c/li>\n\u003cli>వాల్యూమ్ ఎక్కువగా ఉంటే మార్కెట్‌లో ఆసక్తి ఎక్కువని, తక్కువగా ఉంటే ఆసక్తి తక్కువని సూచిస్తుంది. బ్రేక్‌అవుట్ (breakout) సమయంలో వాల్యూమ్ పెరిగితే ఆ కదలిక బలంగా ఉండే అవకాశం ఉంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర కొంతసేపు 1.0800 – 1.0820 మధ్య తిరుగుతోంది. ఆ సమయంలో గంట క్యాండిల్‌కు సుమారు 800 టిక్స్ ఉన్నాయి. తర్వాత ధర 1.0820 పైకి దాటి, ఆ క్యాండిల్‌లో 2,000 టిక్స్ నమోదయ్యాయి. అంటే యాక్టివిటీ బాగా పెరిగింది. ధర 20 పిప్స్ (pips) పెరిగింది అనుకుందాం. 0.1 లాట్ (lot) ట్రేడ్‌కు 1 పిప్ ≈ 1 USD అయితే, ఇది సుమారు 20 USD లాభం. కానీ ధర వెనక్కి తిరిగితే అదే మొత్తంలో నష్టం కూడా రావచ్చు. అందుకే స్టాప్ లాస్ (stop loss) వాడటం ముఖ్యం.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>టిక్ వాల్యూమ్ అంటే క్యాండిల్‌లో ధర మార్పుల సంఖ్య, నిజమైన ట్రేడ్ పరిమాణం కాదు.\u003c/li>\n\u003cli>వాల్యూమ్ పెరగడం కదలికకు బలం ఇవ్వచ్చు, కానీ ఫలితానికి హామీ కాదు.\u003c/li>\n\u003cli>వాల్యూమ్‌ను ఒక్కటే కాకుండా ధర, ట్రెండ్ (trend), రిస్క్ మేనేజ్‌మెంట్‌తో కలిపి చూడండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ఫారెక్స్‌లో టిక్ వాల్యూమ్ దేనిని సూచిస్తుంది?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> ఒక క్యాండిల్ సమయంలో ధర ఎన్నిసార్లు మారిందో ఆ సంఖ్యను సూచిస్తుంది; ఇది మార్కెట్ యాక్టివిటీకి ఒక అంచనా మాత్రమే.\u003c/p>","t":"వాల్యూమ్ & టిక్ వాల్యూమ్ (Volume & Tick Volume)","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Volume and tick volume reveal gold's liquidity and momentum. High tick volume during US session opens often signals strong directional moves. For example, if gold breaks $2,050 on 50,000+ tick volume, a 20-pip move ($2.00 per lot) becomes more probable than on low volume. \u003cem>Risk tip: Always use stop losses—gold can spike 30-40 pips on economic data, risking $3-4 per lot without protection.\u003c/em>\u003c/p>\n","te":"\n\u003cp>గోల్డ్ ట్రేడింగ్‌లో [volume] మరియు [tick volume] చాలా ముఖ్యమైనవి. అధిక [volume] ఉన్నప్పుడు ధర కదలికలు విశ్వసనీయమైనవి. ఉదాహరణకు, 1 [lot] (100 oz) గోల్డ్‌లో 10 [pips] లాభం = $100 లాభం. కానీ [tick volume] తక్కువ ఉన్నప్పుడు గోల్డ్ ధర హఠాత్తుగా మారవచ్చు, కాబట్టి [low volume] సమయాల్లో ట్రేడ్ చేయకండి.\u003c/p>\n"}},"24":{"en":"\u003cp>Price tells a different story depending on how far you zoom in. Multi-timeframe analysis means looking at the same currency pair on several chart periods, such as weekly, daily, and hourly, so you can see the big picture before deciding on the details. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"A higher-timeframe uptrend with smaller pullbacks inside it\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Start high:\u003c/strong> Use a longer timeframe (daily or weekly) to identify the main trend and major support and resistance zones.\u003c/li>\n\u003cli>\u003cstrong>Zoom in:\u003c/strong> Move to a middle timeframe (4-hour or 1-hour) to spot pullbacks, ranges, or patterns within that bigger trend.\u003c/li>\n\u003cli>\u003cstrong>Refine the timing:\u003c/strong> Use a short timeframe (15-minute) to find a precise entry level and a sensible stop-loss. Many people choose three timeframes, each roughly 4 to 6 times larger than the last.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>On the daily chart, EUR/USD has been rising for weeks, so the bigger trend is up. On the 1-hour chart, price dips from 1.1000 to 1.0960, a 40-pip pullback, then stalls near a support zone. On the 15-minute chart, a small bounce appears at 1.0962.\u003c/p>\n\u003cp>A learner studying this setup might place a hypothetical stop at 1.0942 (20 pips of risk) with a target at 1.1002 (40 pips of reward). On a 10,000-unit position (a 0.1 lot), each pip is about $1, so the risk is roughly $20 and the potential reward roughly $40. This is a made-up illustration, and real trades can lose more than planned.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>The higher timeframe shows the trend; lower timeframes help with timing.\u003c/li>\n\u003cli>Trades that agree with the bigger trend are often considered more reliable than trades against it, though nothing is guaranteed.\u003c/li>\n\u003cli>Always define your risk in pips and dollars before entering any trade.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why do traders check the daily chart before using a 15-minute chart?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The daily chart reveals the main trend and key levels, so the short-term entry is placed with the larger context in mind rather than reacting to small, noisy price moves.\u003c/p>","te":"\n\u003cp>ఒకే చార్ట్‌ను చూసి ట్రేడ్ చేస్తే పూర్తి చిత్రం కనిపించదు. ఒకే కరెన్సీ జతను వేర్వేరు కాలపరిమితులలో (timeframes) చూడటాన్ని బహుళ కాలపరిమితి విశ్లేషణ (multi-timeframe analysis) అంటారు. దీనివల్ల పెద్ద ట్రెండ్ ఏ దిశలో ఉందో, చిన్న చార్ట్‌లో ఏం జరుగుతోందో అర్థమవుతుంది.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"పెద్ద కాలపరిమితిలో అప్‌ట్రెండ్ (uptrend)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>పెద్ద చార్ట్ (higher timeframe):\u003c/strong> డైలీ (daily) లేదా 4-గంటల (4H) చార్ట్‌లో ప్రధాన ట్రెండ్‌ను, ముఖ్యమైన సపోర్ట్ (support), రెసిస్టెన్స్ (resistance) స్థాయిలను గుర్తించండి.\u003c/li>\n\u003cli>\u003cstrong>మధ్య చార్ట్ (middle timeframe):\u003c/strong> 1-గంట (1H) చార్ట్‌లో ధర ఆ స్థాయిల దగ్గర ఎలా ప్రవర్తిస్తోందో చూడండి.\u003c/li>\n\u003cli>\u003cstrong>చిన్న చార్ట్ (lower timeframe):\u003c/strong> 15-నిమిషాల (15M) చార్ట్‌లో ఎంట్రీ (entry) సమయాన్ని ఎంచుకోండి. సాధారణంగా పెద్ద ట్రెండ్ దిశలోనే చూడటం సురక్షితం అని చెబుతారు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD డైలీ చార్ట్‌లో అప్‌ట్రెండ్ ఉందనుకోండి. 1H చార్ట్‌లో ధర 1.1000 సపోర్ట్ దగ్గరకు తగ్గింది. 15M చార్ట్‌లో ధర మళ్లీ పైకి తిరగడం కనిపించింది. ఉదాహరణకు 1.1010 వద్ద కొనుగోలు (buy), స్టాప్ లాస్ (stop loss) 1.0980 వద్ద (30 పిప్స్ రిస్క్), టేక్ ప్రాఫిట్ (take profit) 1.1070 వద్ద (60 పిప్స్) అనుకుందాం. 0.1 లాట్‌లో 1 పిప్ ≈ 1 USD కాబట్టి, రిస్క్ సుమారు 30 USD, లాభ లక్ష్యం సుమారు 60 USD. రిస్క్:రివార్డ్ (risk:reward) 1:2. ఇది కేవలం నేర్చుకోవడానికి ఉదాహరణ, సలహా కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ముందు పెద్ద చార్ట్ చూసి, తర్వాత చిన్న చార్ట్‌కు వెళ్లండి.\u003c/li>\n\u003cli>వేర్వేరు కాలపరిమితులు ఒకే దిశను సూచిస్తే సంకేతం బలంగా ఉంటుంది.\u003c/li>\n\u003cli>మరీ ఎక్కువ చార్ట్‌లు వాడితే గందరగోళం వస్తుంది; 2–3 సరిపోతాయి. ఫారెక్స్ అధిక రిస్క్ కలది, నష్టాలు సంభవించవచ్చు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ప్రధాన ట్రెండ్‌ను గుర్తించడానికి ఏ చార్ట్‌ను ముందుగా చూడాలి?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> పెద్ద కాలపరిమితి చార్ట్ (higher timeframe), ఉదాహరణకు డైలీ లేదా 4H చార్ట్.\u003c/p>","t":"బహుళ కాలపరిమితి విశ్లేషణ (Multi-Timeframe Analysis)","g":{"en":"\n\u003cp>Multi-timeframe analysis helps gold traders confirm trends across different chart periods. For example, if the daily chart shows an uptrend while the 4-hour chart indicates a pullback, you might enter a buy position near support, risking 50 pips ($5.00 on one lot) for a 100-pip ($10.00) daily target. Always verify signals on at least two timeframes before trading to avoid false breakouts.\u003c/p>\n","te":"\n\u003cp>\n[Multi-Timeframe Analysis] ఉపయోగించి [Gold] వర్తకం చేస్తే మంచి ఫలితాలు వస్తాయి. ఉదాహరణకు, [daily chart] లో [uptrend] ఉన్నప్పుడు [4-hour chart] పై [buy signal] కోసం చూడండి. [1 lot] లో $10 [profit] పై [stop loss] ఉంచితే, [risk management] బాగుంటుంది. [Multiple timeframes] పరిశీలించకుండా వర్తకం చేయడం ప్రమాదకరం.\n\u003c/p>\n"}},"25":{"en":"\u003cp>When you trade forex, you don't just click \"buy\" or \"sell.\" You choose an \u003cstrong>order type\u003c/strong>, which tells your broker how and when to enter or exit a trade. Knowing the main types helps you control your entry price and manage risk. This lesson is for education only, not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"Price breaking above resistance, where a stop entry order could trigger\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Market order:\u003c/strong> Executes immediately at the best available price. It is fast, but the fill price can differ slightly from what you saw (slippage).\u003c/li>\n\u003cli>\u003cstrong>Limit order:\u003c/strong> Enters at a specified price or better. A buy limit sits below the current price, and a sell limit sits above it.\u003c/li>\n\u003cli>\u003cstrong>Stop order:\u003c/strong> Triggers once price reaches a level. A buy stop sits above the current price and is often used for breakouts. A stop-loss is a stop order that closes a losing trade to cap your loss.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD trades at 1.1000. You expect a breakout if it moves above resistance at 1.1020, so you place a \u003cstrong>buy stop\u003c/strong> at 1.1020 with a \u003cstrong>stop-loss\u003c/strong> at 1.1000 (20 pips of risk) and a \u003cstrong>take-profit\u003c/strong> limit at 1.1060 (40 pips of potential gain).\u003c/p>\n\u003cp>With a 10,000-unit position (a mini lot), each pip is worth about $1. Risk is roughly $20 and the potential reward is roughly $40. Price might never reach your entry, and in that case no trade happens. Stops are also not guaranteed in fast markets and can fill worse than planned.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Market orders prioritize speed; limit and stop orders prioritize price and planning.\u003c/li>\n\u003cli>A stop-loss defines your maximum risk before you enter.\u003c/li>\n\u003cli>Pending orders (limit and stop) wait for price to reach your level before they activate.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> EUR/USD is at 1.1000 and you want to buy only if it falls to 1.0950. Which order type do you use?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> A buy limit at 1.0950, because it enters at a specified price below the current market.\u003c/p>","te":"\n\u003cp>ఫారెక్స్‌లో ట్రేడ్ చేయాలంటే మీరు బ్రోకర్‌కు \"ఏ ధరకు, ఎలా\" కొనాలో లేదా అమ్మాలో చెప్పాలి. ఆ సూచననే ఆర్డర్ (order) అంటారు. ఈ పాఠం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"ధర రెసిస్టెన్స్ దాటినప్పుడు బ్రేక్‌అవుట్ ఆర్డర్ యాక్టివేట్ అవుతుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>మార్కెట్ ఆర్డర్ (market order):\u003c/strong> ప్రస్తుత ధరకే వెంటనే ట్రేడ్ తెరుస్తుంది. వేగంగా అమలవుతుంది, కానీ ధర కొంచెం మారవచ్చు (స్లిప్పేజ్, slippage).\u003c/li>\n\u003cli>\u003cstrong>పెండింగ్ ఆర్డర్ (pending order):\u003c/strong> మీరు ఎంచుకున్న ధరకు మార్కెట్ చేరినప్పుడే తెరుచుకుంటుంది. లిమిట్ (limit) ఆర్డర్ మెరుగైన ధర కోసం, స్టాప్ (stop) ఆర్డర్ ధర ఒక స్థాయిని దాటినప్పుడు ట్రేడ్ కోసం వాడతారు.\u003c/li>\n\u003cli>\u003cstrong>స్టాప్ లాస్ (stop loss) మరియు టేక్ ప్రాఫిట్ (take profit):\u003c/strong> నష్టాన్ని పరిమితం చేయడానికి, లాభాన్ని లాక్ చేయడానికి ట్రేడ్‌కు జోడించే ఆర్డర్లు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 వద్ద ఉంది. ధర 1.1020 దాటితే పైకి వెళ్తుందని మీరు అనుకుంటున్నారు. మీరు 1.1020 వద్ద బై స్టాప్ (buy stop) పెండింగ్ ఆర్డర్ పెట్టారు. స్టాప్ లాస్ 1.1000 వద్ద (20 పిప్స్ రిస్క్), టేక్ ప్రాఫిట్ 1.1060 వద్ద (40 పిప్స్ లక్ష్యం). 1 మినీ లాట్ (10,000 యూనిట్లు) అయితే ప్రతి పిప్ సుమారు 1 USD. కాబట్టి గరిష్ఠ నష్టం సుమారు 20 USD, లక్ష్య లాభం సుమారు 40 USD. ధర 1.1020 చేరకపోతే ట్రేడ్ తెరుచుకోదు. ఇది కేవలం ఉదాహరణ, ఫలితం హామీ కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>మార్కెట్ ఆర్డర్ వేగం కోసం, పెండింగ్ ఆర్డర్ నిర్దిష్ట ధర కోసం.\u003c/li>\n\u003cli>ప్రతి ట్రేడ్‌కు స్టాప్ లాస్ (stop loss) పెట్టడం రిస్క్ నియంత్రణలో ముఖ్యమైన అలవాటు.\u003c/li>\n\u003cli>డెమో ఖాతాలో ఆర్డర్లను ముందు ప్రాక్టీస్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ప్రస్తుత ధరకే వెంటనే ట్రేడ్ తెరిచే ఆర్డర్ ఏది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> మార్కెట్ ఆర్డర్ (market order).\u003c/p>","t":"ఆర్డర్ రకాలు (Order Types)","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Understanding order types is crucial for gold trading. Market orders execute immediately at current price, ideal for quick entries when gold breaks $2,050. Limit orders let you buy at $2,048 without overpaying—if gold drops 20 pips ($2.00), you save $200 per lot. \u003cstrong>Risk tip:\u003c/strong> Always set stop-losses before entering; gold's volatility can swing 50+ pips rapidly, risking $500+ per lot without protection.\u003c/p>\n","te":"\n\u003cp>సోने (XAUUSD) వర్తకం చేస్తున్నప్పుడు, సరైన [order types] ఉపయోగించడం చాలా ముఖ్యం. ఉదాహరణకు, సోన ధర $2000 వద్ద [limit order] ఇస్తే, అది సరిగ్గా ఆ ధరకు రావచ్చు. 1 [lot] = 100 [oz] అయితే, 100 [pips] కదలిక = $1000 లాభం లేదా నష్టం. ఎల్లప్పుడు [stop loss] సెట్ చేయండి నష్టాలను నియంత్రించడానికి.\u003c/p>\n"}},"26":{"en":"\u003cp>Every trade can go wrong, and in forex it can go wrong fast. A \u003cstrong>stop loss\u003c/strong> is an order that automatically closes your trade at a set price to cap your loss. A \u003cstrong>take profit\u003c/strong> is an order that closes it automatically once a target gain is reached. Together they let you decide your risk and reward before you enter, instead of making emotional choices while the market moves. This lesson is for education only, not financial advice. Forex trading carries a high risk of loss.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"Price breaks above resistance: stop placed below the breakout, target set above\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Stop loss:\u003c/strong> placed at a level that, if hit, shows your trade idea was wrong, such as just below a recent support level for a buy trade.\u003c/li>\n\u003cli>\u003cstrong>Take profit:\u003c/strong> placed at a realistic target, such as near the next resistance level for a buy trade.\u003c/li>\n\u003cli>\u003cstrong>Risk-to-reward ratio:\u003c/strong> compare the distance to your target with the distance to your stop. Risking 25 pips to gain 50 pips is a 1:2 ratio.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose you buy 1 mini lot (10,000 units) of EUR/USD at 1.1000, where one pip is worth about $1. You set a stop loss at 1.0975 (25 pips below) and a take profit at 1.1050 (50 pips above).\u003c/p>\n\u003cul>\n\u003cli>If the stop is hit: loss of about 25 pips, or roughly \u003cstrong>$25\u003c/strong>.\u003c/li>\n\u003cli>If the target is hit: gain of about 50 pips, or roughly \u003cstrong>$50\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Be aware that in fast markets, price can jump past your stop (called slippage), so the actual loss can be larger than planned.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Decide your stop loss and take profit before you enter a trade.\u003c/li>\n\u003cli>Place stops where your idea is proven wrong, not just at a random distance.\u003c/li>\n\u003cli>A stop loss limits risk but does not guarantee against slippage or remove the possibility of loss.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> You risk 20 pips with a stop loss and set a take profit 60 pips away. What is your risk-to-reward ratio?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> 1:3, because you risk 20 pips to potentially gain 60 pips (60 ÷ 20 = 3).\u003c/p>","te":"\n\u003cp>ట్రేడింగ్‌లో నష్టాన్ని పరిమితం చేయడం, లాభాన్ని కాపాడుకోవడం చాలా ముఖ్యం. దీనికి రెండు సాధనాలు ఉన్నాయి: స్టాప్ లాస్ (stop loss), టేక్ ప్రాఫిట్ (take profit). ఇది కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"ధర రెసిస్టెన్స్ దాటి పైకి వెళ్ళింది; స్టాప్ లాస్ కింద, టేక్ ప్రాఫిట్ పైన ఉంటాయి\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>స్టాప్ లాస్ (stop loss):\u003c/strong> ధర మీకు వ్యతిరేకంగా ఒక స్థాయికి వెళ్తే ట్రేడ్ ఆటోమేటిక్‌గా మూసేస్తుంది. నష్టం అక్కడే ఆగుతుంది.\u003c/li>\n\u003cli>\u003cstrong>టేక్ ప్రాఫిట్ (take profit):\u003c/strong> ధర మీరు అనుకున్న లాభ స్థాయికి చేరగానే ట్రేడ్ ఆటోమేటిక్‌గా మూసేస్తుంది.\u003c/li>\n\u003cli>\u003cstrong>రిస్క్-రివార్డ్ (risk-reward):\u003c/strong> నష్ట అవకాశం కన్నా లాభ అవకాశం ఎక్కువగా ఉండేలా స్థాయిలను ఎంచుకోవడం మంచి అలవాటు, ఉదాహరణకు 1:2.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీరు EUR/USD ని 1.1000 వద్ద కొన్నారు (buy). స్టాప్ లాస్ 1.0950 వద్ద (50 పిప్స్ కింద), టేక్ ప్రాఫిట్ 1.1100 వద్ద (100 పిప్స్ పైన) పెట్టారు. ట్రేడ్ సైజు 0.1 లాట్ (lot) అయితే ప్రతి పిప్ (pip) విలువ సుమారు $1. ధర కిందకు వెళ్తే నష్టం సుమారు $50. పైకి వెళ్తే లాభం సుమారు $100. ఇక్కడ రిస్క్-రివార్డ్ 1:2.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>స్టాప్ లాస్ నష్టాన్ని పరిమితం చేస్తుంది; ట్రేడ్ తెరిచే ముందే దాన్ని నిర్ణయించండి.\u003c/li>\n\u003cli>టేక్ ప్రాఫిట్ లాభాన్ని ముందుగా నిర్ణయించిన స్థాయిలో లాక్ చేస్తుంది.\u003c/li>\n\u003cli>మీరు కోల్పోయినా భరించగలిగిన మొత్తం మాత్రమే రిస్క్ చేయండి; స్టాప్ లాస్ ఉన్నా నష్టం పూర్తిగా తప్పదు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> మీరు 1.2000 వద్ద కొన్నారు, స్టాప్ లాస్ 1.1960 వద్ద ఉంది. రిస్క్ ఎన్ని పిప్స్?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> 40 పిప్స్ (1.2000 − 1.1960 = 0.0040).\u003c/p>","t":"స్టాప్ లాస్ & టేక్ ప్రాఫిట్ (Stop Loss & Take Profit)","g":{"en":"\n\u003cp>When trading gold (XAUUSD), stop loss and take profit levels are crucial for managing volatility. For example, buying 1 lot at $2,050 with a 50-pip stop loss ($5 risk) and 150-pip take profit ($15 gain) gives you a favorable 1:3 risk-reward ratio. \u003cstrong>Risk tip:\u003c/strong> Always set your stops before entering; gold's intraday swings can quickly erase profits without predefined exit levels.\u003c/p>\n","te":"\n\u003cp>సిద్ధ ధర [Gold/XAUUSD] వర్తకం చేస్తున్నప్పుడు చాలా ముఖ్యమైనది. ఉదాహరణకు, మీరు $2000 వద్ద కొన్నారు, [stop loss] $1950 వద్ద, [take profit] $2050 వద్ద సెట్ చేయండి. 1 [lot] = 100 [oz] కాబట్టి, 500 [pips] లాభం $5000 అవుతుంది. కానీ గుర్తుంచుకోండి: [volatility] ఎక్కువ, [risk] ఎక్కువ. ఎల్లప్పుడు మీ [account] నష్టం పరిమితం చేయండి.\u003c/p>\n"}},"27":{"en":"\u003cp>Position sizing decides how many units of a currency pair you trade so that a losing trade costs only a small, planned amount of your account. Beginners often pick a lot size at random, but experienced traders work it out from their risk limit and stop-loss distance. This lesson is educational only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price moving in a range: the stop-loss distance in pips sets your position size\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Set your risk first:\u003c/strong> Choose a small percentage of your account to risk per trade (many educators mention 1-2%). Convert it to dollars.\u003c/li>\n\u003cli>\u003cstrong>Measure the stop distance:\u003c/strong> Count the pips between your entry and your stop-loss. A wider stop means a smaller position.\u003c/li>\n\u003cli>\u003cstrong>Calculate the lot size:\u003c/strong> Lot size = Risk in USD ÷ (Stop in pips × Pip value per lot). A standard lot (100,000 units) is about $10 per pip on EUR/USD, a mini lot (10,000) about $1, and a micro lot (1,000) about $0.10.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Your account is $2,000 and you risk 1%, so your risk is \u003cstrong>$20\u003c/strong>. You plan to buy EUR/USD with a stop-loss \u003cstrong>50 pips\u003c/strong> away.\u003c/p>\n\u003cp>Risk per pip = $20 ÷ 50 = $0.40 per pip. Since a micro lot is about $0.10 per pip, you would trade about \u003cstrong>4 micro lots (0.04 standard lots)\u003c/strong>. If the stop is hit, you lose roughly $20. If you doubled the stop to 100 pips, you would halve the position to 2 micro lots to keep the same $20 risk.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Decide your dollar risk before choosing a lot size.\u003c/li>\n\u003cli>Wider stops require smaller positions; tighter stops allow larger ones.\u003c/li>\n\u003cli>Consistent sizing helps you survive losing streaks, but it never removes risk.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> You risk $30 on a trade with a 60-pip stop. What is your risk per pip?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> $30 ÷ 60 = $0.50 per pip, which is about 5 micro lots on a pair where a micro lot is worth roughly $0.10 per pip.\u003c/p>","te":"\n\u003cp>ట్రేడ్ చేసే ముందు \"ఎంత పరిమాణంతో ట్రేడ్ చేయాలి?\" అని తెలుసుకోవడం చాలా ముఖ్యం. దీన్నే పొజిషన్ సైజింగ్ (position sizing) అంటారు. సరైన లాట్ సైజ్ (lot size) ఎంచుకుంటే ఒక్క ట్రేడ్ నష్టం మీ ఖాతాను దెబ్బతీయదు. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"స్టాప్ లాస్ దూరం ఆధారంగా లాట్ సైజ్ నిర్ణయించడం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ముందుగా రిస్క్ నిర్ణయించండి:\u003c/strong> ఒక ట్రేడ్‌లో ఖాతాలో కొద్ది శాతం (ఉదా. 1%) మాత్రమే రిస్క్ (risk) చేయండి.\u003c/li>\n\u003cli>\u003cstrong>స్టాప్ లాస్ దూరం (stop loss distance):\u003c/strong> ఎంట్రీ నుండి స్టాప్ లాస్ వరకు ఎన్ని పిప్స్ (pips) ఉన్నాయో లెక్కించండి.\u003c/li>\n\u003cli>\u003cstrong>లాట్ సైజ్ సూత్రం:\u003c/strong> లాట్ సైజ్ = రిస్క్ మొత్తం ÷ (స్టాప్ లాస్ పిప్స్ × పిప్ విలువ). EUR/USD లో 1 స్టాండర్డ్ లాట్ (standard lot) కు పిప్ విలువ సుమారు $10.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>ఖాతా: $1,000. రిస్క్: 1% = $10. స్టాప్ లాస్: 50 పిప్స్.\u003c/p>\n\u003cp>లాట్ సైజ్ = 10 ÷ (50 × 10) = 0.02 లాట్. అంటే 0.02 లాట్‌కు పిప్ విలువ సుమారు $0.20. స్టాప్ లాస్ తగిలితే నష్టం 50 × $0.20 = $10 మాత్రమే. స్టాప్ లాస్ 25 పిప్స్ అయితే లాట్ సైజ్ 0.04 అవుతుంది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ముందు రిస్క్ మొత్తం, తర్వాతే లాట్ సైజ్ నిర్ణయించండి.\u003c/li>\n\u003cli>స్టాప్ లాస్ దూరం పెరిగితే లాట్ సైజ్ తగ్గించాలి.\u003c/li>\n\u003cli>చిన్న రిస్క్ శాతం మీ ఖాతాను ఎక్కువ కాలం కాపాడుతుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ఖాతా $2,000, రిస్క్ 1%, స్టాప్ లాస్ 40 పిప్స్, పిప్ విలువ లాట్‌కు $10 అయితే లాట్ సైజ్ ఎంత?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> రిస్క్ = $20. లాట్ సైజ్ = 20 ÷ (40 × 10) = 0.05 లాట్.\u003c/p>","t":"పొజిషన్ సైజింగ్ & లాట్ సైజ్ లెక్కింపు (Position Sizing & Lot Size)","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Position sizing is critical for gold trading since price swings can be substantial. If gold moves 50 pips against a 1-lot position, you lose $500 (50 pips × $0.10). Calculate your lot size based on your account risk—if risking $100 per trade on a $10,000 account, you'd use 0.2 lots maximum. \u003cem>Risk tip: Gold volatility increases during economic data releases; reduce position size accordingly.\u003c/em>\u003c/p>\n","te":"\n\u003cp>గోల్డ్ [XAUUSD] ట్రేడింగ్‌లో సరైన [lot size] ఎంచుకోవడం చాలా ముఖ్యం. ఉదాహరణకు, మీ ఖాతాలో $1000 ఉంటే, $100 రిస్క్‌కు [0.1 lot] ($10 నష్టం = 100 [pips]) సరిపోతుంది. ఎల్లప్పుడు మీ ఖాతాలో 1-2% కంటే ఎక్కువ రిస్క్ చేయవద్దు [per trade].\u003c/p>\n"}},"28":{"en":"\u003cp>Every trade carries a risk: the amount you could lose if the market moves against you. It also carries a possible reward: the amount you could gain if it moves in your favor. The \u003cstrong>risk-reward ratio\u003c/strong> compares the two, and it helps you decide whether a trade is worth taking. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"Entry, stop-loss below support, and target above resistance\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Risk\u003c/strong> is the distance in pips from your entry price to your stop-loss, the order that closes the trade if price moves against you.\u003c/li>\n\u003cli>\u003cstrong>Reward\u003c/strong> is the distance in pips from your entry to your take-profit target.\u003c/li>\n\u003cli>\u003cstrong>Ratio\u003c/strong> = reward ÷ risk. Risking 20 pips to target 40 pips is a 1:2 ratio. A higher ratio means you need fewer winning trades to come out ahead, but targets that are farther away are also less likely to be reached.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine buying EUR/USD at 1.1000 with a stop-loss at 1.0980 (20 pips of risk) and a target at 1.1040 (40 pips of reward). With a standard pip value of about $1 per pip on a micro lot (1,000 units), here is how the numbers look:\u003c/p>\n\u003cul>\n\u003cli>Risk: 20 pips × $1 = \u003cstrong>$20\u003c/strong>\u003c/li>\n\u003cli>Reward: 40 pips × $1 = \u003cstrong>$40\u003c/strong>\u003c/li>\n\u003cli>Ratio: \u003cstrong>1:2\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>If you took ten such trades and won only four, you would gain $160 and lose $120 on the six losers, ending up $40 ahead before costs such as spreads. Real results vary, and nothing is guaranteed.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Decide your stop-loss and target before you enter a trade.\u003c/li>\n\u003cli>A good ratio does not guarantee profit. Win rate matters too.\u003c/li>\n\u003cli>Costs like spreads and slippage reduce your real reward and increase your real risk.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> You risk 25 pips with a target of 50 pips. What is the risk-reward ratio?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> 50 ÷ 25 = 2, so the ratio is 1:2.\u003c/p>","te":"\n\u003cp>ప్రతి ట్రేడ్‌లో మనం ఎంత రిస్క్ తీసుకుంటున్నాం, ఎంత లాభం ఆశిస్తున్నాం అనేది పోల్చి చూడటమే రిస్క్-రివార్డ్ నిష్పత్తి (risk-reward ratio). ఇది విద్యా సమాచారం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది, నష్టాలు రావచ్చు.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"బ్రేక్అవుట్ తర్వాత టార్గెట్ స్టాప్ లాస్ కంటే దూరంగా ఉండాలి\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>ఎంట్రీ (entry) నుండి స్టాప్ లాస్ (stop loss) వరకు ఉన్న దూరం మీ రిస్క్ (risk).\u003c/li>\n\u003cli>ఎంట్రీ నుండి టేక్ ప్రాఫిట్ (take profit) వరకు ఉన్న దూరం మీ రివార్డ్ (reward).\u003c/li>\n\u003cli>రివార్డ్‌ను రిస్క్‌తో భాగిస్తే నిష్పత్తి వస్తుంది. ఉదా: 1:2 అంటే 1 రిస్క్‌కు 2 లాభం ఆశిస్తున్నాం.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD లో ఎంట్రీ నుండి స్టాప్ లాస్ \u003cstrong>20 పిప్స్ (pips)\u003c/strong> దూరంలో, టేక్ ప్రాఫిట్ \u003cstrong>40 పిప్స్\u003c/strong> దూరంలో ఉంది. ఒక పిప్ విలువ $1 అనుకుందాం. రిస్క్ = $20, రివార్డ్ = $40. అంటే నిష్పత్తి \u003cstrong>1:2\u003c/strong>.\u003c/p>\n\u003cp>10 ట్రేడ్‌లలో కేవలం 4 గెలిచి 6 ఓడినా: లాభం 4 × $40 = $160, నష్టం 6 × $20 = $120. నికరం +$40. అయితే ఇది ఒక ఉదాహరణ మాత్రమే; వాస్తవంలో స్ప్రెడ్ (spread), స్లిప్పేజ్ (slippage) వల్ల ఫలితాలు మారతాయి, లాభానికి హామీ లేదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ట్రేడ్ తీసుకునే ముందే రిస్క్-రివార్డ్ లెక్కించండి.\u003c/li>\n\u003cli>మంచి నిష్పత్తి ఉంటే తక్కువ విజయ శాతంతో కూడా నష్టాలను తగ్గించుకోవచ్చు, కానీ లాభం గ్యారంటీ కాదు.\u003c/li>\n\u003cli>స్టాప్ లాస్ లేకుండా నిష్పత్తికి అర్థం లేదు; రిస్క్‌ను ఎప్పుడూ ముందే నిర్ణయించుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> స్టాప్ లాస్ 30 పిప్స్, టేక్ ప్రాఫిట్ 90 పిప్స్ అయితే రిస్క్-రివార్డ్ నిష్పత్తి ఎంత?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> 90 ÷ 30 = 3, కాబట్టి నిష్పత్తి 1:3.\u003c/p>","t":"రిస్క్-రివార్డ్ నిష్పత్తి (Risk-Reward Ratio)","g":{"en":"\n\u003cp>In gold trading, the risk-reward ratio determines profitable setups. For example, if you risk $50 (500 pips × $0.10) on a 1-lot position, aim for at least a $100+ reward (1000+ pips) to maintain a favorable 1:2 ratio. Always calculate your potential loss before entering: define your stop-loss level and ensure the reward justifies the risk taken on each trade.\u003c/p>\n","te":"\n\u003cp>\n[Gold (XAUUSD)] వర్తకంలో [risk-reward ratio] చాలా ముఖ్యం. ఉదాహరణకు, మీరు $100 నష్టం [risk] చేసి $300 లాభం [reward] ఆశించినట్లయితే, ఇది 1:3 నిష్పత్తి. ఒక [lot] (100 oz) వద్ద 50 [pip] నష్టం = $500 (50 × $0.10), 150 [pip] లాభం = $1500. ఎల్లప్పుడు లాభం నష్టం కంటే ఎక్కువగా ఉండేటట్లు ప్లాన్ చేయండి.\n\u003c/p>\n"}},"29":{"en":"\u003cp>Every trader loses sometimes. What separates those who last from those who don't is how they limit losses. Risk management means deciding in advance how much you can afford to lose on a trade, before you think about how much you might win. This lesson is for education only and is not financial advice. Forex trading is high risk, and you can lose more than you expect.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"A stop-loss placed just beyond a broken level caps the loss if price reverses\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cp>\u003cstrong>1. Risk a small percentage per trade.\u003c/strong> Many educators suggest 1-2% of your account, so one bad trade cannot do serious damage.\u003c/p>\n\u003cp>\u003cstrong>2. Use a stop-loss.\u003c/strong> This is an order that closes your trade at a set price, fixing your maximum loss before you enter.\u003c/p>\n\u003cp>\u003cstrong>3. Compare risk to reward.\u003c/strong> A risk-reward ratio of 1:2 means you aim to gain twice what you risk. This lets you be wrong often and still come out fine.\u003c/p>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Account: $1,000. Risk per trade: 1% = \u003cstrong>$10\u003c/strong>.\u003c/p>\n\u003cp>You buy EUR/USD and place a stop-loss 20 pips below your entry. To risk only $10 over 20 pips, each pip must be worth $0.50. That is a position size of about 5,000 units (a \"micro lot\" is 1,000 units, worth about $0.10 per pip).\u003c/p>\n\u003cp>Your target is 40 pips above entry, a 1:2 ratio. If the stop is hit, you lose $10. If the target is hit, you gain $20. Even if you win only 4 of 10 trades, the math is: 4 × $20 = $80 won, 6 × $10 = $60 lost, a net of +$20 before costs. Real results vary, and costs like spreads reduce them.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Decide your maximum loss \u003cstrong>before\u003c/strong> entering a trade.\u003c/li>\n\u003cli>Size your position from your stop distance and account risk, not from a hunch.\u003c/li>\n\u003cli>Protecting your capital keeps you in the game; no strategy wins every time.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> On a $2,000 account, you risk 1% per trade. How many dollars is that?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> $20 (1% of $2,000). Your stop-loss and position size should be set so that a losing trade costs about this amount.\u003c/p>","te":"\n\u003cp>ట్రేడింగ్‌లో లాభాలు సంపాదించడం కంటే ముందు, నష్టాలను అదుపులో ఉంచుకోవడం నేర్చుకోవాలి. రిస్క్ మేనేజ్‌మెంట్ (risk management) అంటే ప్రతి ట్రేడ్‌లో మీరు ఎంత నష్టపోవడానికి సిద్ధంగా ఉన్నారో ముందే నిర్ణయించుకోవడం. ఫారెక్స్ (forex) అధిక రిస్క్ ఉన్న మార్కెట్. ఈ పాఠం కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"down\" data-c=\"ధర స్టాప్ లాస్ స్థాయికి చేరితే ట్రేడ్ ఆటోమేటిక్‌గా ముగుస్తుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ఒక ట్రేడ్‌కు పరిమిత రిస్క్:\u003c/strong> మీ ఖాతాలో సాధారణంగా 1–2% కంటే ఎక్కువ ఒక ట్రేడ్‌లో రిస్క్ చేయకూడదని చాలామంది నియమంగా పెట్టుకుంటారు.\u003c/li>\n\u003cli>\u003cstrong>స్టాప్ లాస్ (stop loss):\u003c/strong> ధర మీకు వ్యతిరేకంగా వెళ్తే, నిర్ణీత స్థాయి వద్ద ట్రేడ్‌ను ఆటోమేటిక్‌గా ముగించే ఆర్డర్.\u003c/li>\n\u003cli>\u003cstrong>రిస్క్-రివార్డ్ రేషియో (risk-reward ratio):\u003c/strong> సంభావ్య లాభం, సంభావ్య నష్టం కంటే ఎక్కువగా ఉండాలి, ఉదాహరణకు 1:2.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీ ఖాతాలో $1,000 ఉంది. ఒక ట్రేడ్‌లో 2% అంటే $20 వరకు మాత్రమే రిస్క్ చేయాలని నిర్ణయించారు. స్టాప్ లాస్ 20 పిప్స్ (pips) దూరంలో పెట్టారు. అప్పుడు ప్రతి పిప్ విలువ సుమారు $1 ఉండేలా పొజిషన్ సైజ్ (position size) ఎంచుకోవాలి. అంటే నష్టం గరిష్ఠంగా 20 × $1 = $20. టేక్ ప్రాఫిట్ (take profit) 40 పిప్స్ వద్ద పెడితే, లాభం $40 అవుతుంది. ఇది 1:2 రిస్క్-రివార్డ్. ఈ సంఖ్యలు ఉదాహరణ మాత్రమే; నిజమైన ఫలితాలు మారవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ప్రతి ట్రేడ్‌కు ముందే గరిష్ఠ నష్టాన్ని నిర్ణయించుకోండి.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ వాడండి, భావోద్వేగాలతో నిర్ణయాలు మార్చకండి.\u003c/li>\n\u003cli>మీరు కోల్పోయినా ఇబ్బంది లేని డబ్బుతో మాత్రమే ట్రేడ్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> $500 ఖాతాలో 2% రిస్క్ నియమం పెడితే, ఒక ట్రేడ్‌లో గరిష్ఠంగా ఎంత నష్టం అనుమతించాలి?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> $500 × 2% = $10.\u003c/p>","t":"రిస్క్ మేనేజ్‌మెంట్ నియమాలు","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>Risk management is critical when trading gold. For example, if you risk $50 per trade (500 pips × $0.10), you could lose half a lot on a single bad trade. Always set stop losses before entering: if gold is at $2,000, place your stop at $1,990 to limit losses to $100 per lot. Never risk more than 1-2% of your account on any single trade.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] వర్తకంలో [trading] ఝুঁకి నిర్వహణ [risk management] చాలా ముఖ్యమైనది. ఉదాహరణకు, మీరు 1 [lot] (100 oz) కొన్నట్లు ఊహించండి. 50 [pips] న
