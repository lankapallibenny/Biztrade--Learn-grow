<script id="d" type="application/json">{"ls":{"0":{"en":"\u003cp>Forex (foreign exchange) is the global market where one currency is traded for another. Travelers, businesses, banks and individual traders all take part, and it is open around the clock on weekdays. This lesson is for education only and is not financial advice. Forex trading is high risk, and you can lose money quickly.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Currencies often move sideways between support and resistance, showing how an exchange rate fluctuates\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Currencies trade in pairs.\u003c/strong> In EUR/USD, the first currency (EUR) is the base and the second (USD) is the quote. A price of 1.1000 means 1 euro costs 1.10 US dollars.\u003c/li>\n\u003cli>\u003cstrong>Prices move in pips.\u003c/strong> A pip is usually the fourth decimal place (0.0001) for most pairs. It is the standard unit for measuring price changes.\u003c/li>\n\u003cli>\u003cstrong>You buy or sell.\u003c/strong> Buying a pair means you expect the base currency to rise against the quote. Selling means you expect it to fall. Either expectation can turn out wrong.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD moves from 1.1000 to 1.1050. That is a 50-pip rise. On a standard lot (100,000 euros), one pip is worth about $10, so 50 pips equals roughly $500. If the price had fallen 50 pips instead, the same position would lose about $500. Gains and losses work in both directions, which is why risk matters so much.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Forex is the exchange of one currency for another, quoted in pairs.\u003c/li>\n\u003cli>A pip is the standard unit of price movement, usually 0.0001.\u003c/li>\n\u003cli>Forex is high risk, and losses can be as large as gains.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> If EUR/USD rises from 1.2000 to 1.2030, how many pips did it move?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> 30 pips, since the change of 0.0030 equals 30 pips of 0.0001 each.\u003c/p>","te":"\n\u003cp>ఫారెక్స్ (Forex) అంటే విదేశీ కరెన్సీల మార్పిడి మార్కెట్. ఇక్కడ ఒక దేశ కరెన్సీని మరొక దేశ కరెన్సీతో కొని, అమ్ముతారు. ఇది ప్రపంచంలోనే అతిపెద్ద మార్కెట్, వారంలో 5 రోజులు, రోజులో 24 గంటలు నడుస్తుంది. ఈ పాఠం కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్‌లో రిస్క్ (risk) చాలా ఎక్కువ, డబ్బు నష్టపోయే అవకాశం ఉంది.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"కరెన్సీ ధర రెండు స్థాయిల మధ్య అటూ ఇటూ కదులుతున్న దృశ్యం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>కరెన్సీలు జతలుగా (currency pair) ట్రేడ్ అవుతాయి, ఉదాహరణకు EUR/USD. మొదటి కరెన్సీ విలువ రెండో కరెన్సీలో ఎంతో ఇది చూపిస్తుంది.\u003c/li>\n\u003cli>ధర మారినప్పుడు జరిగే చిన్న కదలికను పిప్ (pip) అంటారు. EUR/USD లో 0.0001 మార్పు ఒక పిప్.\u003c/li>\n\u003cli>ట్రేడర్ ధర పెరుగుతుందని అనుకుంటే కొనుగోలు (buy), తగ్గుతుందని అనుకుంటే అమ్మకం (sell) చేస్తాడు. అంచనా తప్పైతే నష్టం వస్తుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 వద్ద ఉందనుకుందాం. ఒక స్టాండర్డ్ లాట్ (standard lot = 100,000 యూనిట్లు) లో ఒక పిప్ విలువ సుమారు 10 USD. ధర 1.1020 కి పెరిగితే అది 20 పిప్స్, అంటే కొన్నవారికి సుమారు 200 USD లాభం. కానీ ధర 1.0980 కి పడిపోతే, 20 పిప్స్ నష్టం, అంటే సుమారు 200 USD నష్టం. ఇది కేవలం అర్థం చేసుకోవడానికి ఇచ్చిన ఉదాహరణ, నిజమైన ఫలితాలకు హామీ కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ఫారెక్స్ అంటే ఒక కరెన్సీని మరో కరెన్సీతో మార్చుకునే గ్లోబల్ మార్కెట్.\u003c/li>\n\u003cli>కరెన్సీలు జతలుగా ట్రేడ్ అవుతాయి, ధర కదలికను పిప్స్‌లో కొలుస్తారు.\u003c/li>\n\u003cli>లాభం లాగే నష్టం కూడా వేగంగా రావచ్చు, కాబట్టి రిస్క్ గురించి ముందు నేర్చుకోవాలి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> EUR/USD లో ధర 1.1000 నుండి 1.1015 కి మారితే అది ఎన్ని పిప్స్?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> 15 పిప్స్ (1.1015 − 1.1000 = 0.0015, అంటే 15 × 0.0001).\u003c/p>","t":"ఫారెక్స్ అంటే ఏమిటి?","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Just as forex pairs move in pips, gold prices fluctuate in small increments. If gold rises from $2,000 to $2,000.10 per ounce, that's one pip worth $0.10 on a standard lot (100 oz). Understanding these micro-movements helps you recognize profit/loss potential. \u003cem>Risk tip:\u003c/em> Always use stop losses, as gold can gap during economic news, potentially triggering losses larger than expected.\u003c/p>\n","te":"\n\u003cdiv>\n  \u003ch3>Gold (XAUUSD) Corner\u003c/h3>\n  \u003cp>\n    Forex సూత్రాలు [currency pairs] వలె Gold [XAUUSD] కూడా వర్తిస్తాయి. Gold ధరలు ప్రతిదిన మారుతూ ఉంటాయి. ఉదాహరణకు, మీరు [1 lot] (100 oz) కొన్నట్లు అనుకోండి. ధర 10 [pips] పెరిగితే ($1.00 లాభం). కానీ ఎల్లప్పుడు [stop loss] రక్షణ ఉపయోగించండి రిస్క్ నియంత్రణ కోసం.\n  \u003c/p>\n\u003c/div>\n"}},"1":{"en":"\u003cp>Every forex trade involves two currencies at once. You buy one and sell the other, so prices are always quoted as a \u003cstrong>pair\u003c/strong>, such as EUR/USD. Pairs are grouped by how widely they are traded, and this affects cost and volatility. This lesson is for education only, not financial advice. Forex trading carries a high risk of loss.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Major pairs often move in ranges, with prices bouncing between support and resistance\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Majors:\u003c/strong> pairs that include the US dollar and another large economy's currency, such as EUR/USD, GBP/USD, USD/JPY and USD/CHF. They are the most traded and usually have the lowest spreads (the cost of entering a trade).\u003c/li>\n\u003cli>\u003cstrong>Minors (crosses):\u003c/strong> pairs of major currencies that don't include USD, such as EUR/GBP or EUR/JPY. They are less liquid, so spreads are often a bit wider.\u003c/li>\n\u003cli>\u003cstrong>Exotics:\u003c/strong> a major currency paired with one from a smaller or emerging economy, such as USD/TRY or USD/ZAR. They tend to have wide spreads and sharp, unpredictable moves.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD moves from 1.1000 to 1.1050. That is a 50-pip move, since a pip is usually 0.0001. On a standard lot (100,000 euros), each pip is worth about $10, so 50 pips equals about $500 gained or lost, depending on your direction. If the spread is 1 pip on a major, the cost is about $10. An exotic with a 30-pip spread could cost far more before the trade moves at all.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Majors are the most liquid and usually the cheapest to trade.\u003c/li>\n\u003cli>Minors and exotics typically have wider spreads and can be more volatile.\u003c/li>\n\u003cli>Always consider trading costs and risk before choosing a pair.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Is GBP/JPY a major, a minor, or an exotic pair?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> A minor (cross), because it combines two major currencies but doesn't include the US dollar.\u003c/p>","te":"\n\u003cp>ఫారెక్స్‌లో కరెన్సీలు ఎప్పుడూ జతగా (currency pair) ట్రేడ్ అవుతాయి. ఒక కరెన్సీ విలువను మరొక కరెన్సీతో పోలుస్తాము. ఈ పాఠంలో పెయిర్స్ రకాలను తెలుసుకుందాం. ఇది కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"EUR/USD ధర ఒక పరిధిలో కదులుతున్న చార్ట్\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>మేజర్స్ (Majors):\u003c/strong> అమెరికన్ డాలర్ (USD)తో ఉండే ప్రధాన పెయిర్స్, ఉదా: EUR/USD, GBP/USD, USD/JPY. వీటిలో ట్రేడింగ్ ఎక్కువ, స్ప్రెడ్ (spread) తక్కువ.\u003c/li>\n\u003cli>\u003cstrong>మైనర్స్ (Minors):\u003c/strong> USD లేని ప్రధాన కరెన్సీల జతలు, ఉదా: EUR/GBP, EUR/JPY. స్ప్రెడ్ కొంచెం ఎక్కువ ఉంటుంది.\u003c/li>\n\u003cli>\u003cstrong>ఎక్సోటిక్స్ (Exotics):\u003c/strong> ఒక ప్రధాన కరెన్సీ + చిన్న లేదా వర్ధమాన దేశ కరెన్సీ, ఉదా: USD/INR, USD/TRY. స్ప్రెడ్ ఎక్కువ, ధర వేగంగా మారవచ్చు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 నుండి 1.1050కి పెరిగింది అనుకుందాం. అది 50 పిప్స్ (pips) మార్పు. 1 స్టాండర్డ్ లాట్ (100,000 యూనిట్లు) అయితే ప్రతి పిప్ విలువ సుమారు 10 USD. కాబట్టి 50 పిప్స్ = సుమారు 500 USD. ధర అదే మేరకు వ్యతిరేక దిశలో వెళ్తే 500 USD నష్టం కూడా వస్తుంది. అందుకే చిన్న లాట్ సైజుతో నేర్చుకోవడం మంచిది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>మేజర్స్‌లో USD ఉంటుంది; అవి అత్యధికంగా ట్రేడ్ అవుతాయి.\u003c/li>\n\u003cli>మైనర్స్‌లో USD ఉండదు; ఎక్సోటిక్స్‌లో స్ప్రెడ్ ఎక్కువ, రిస్క్ ఎక్కువ.\u003c/li>\n\u003cli>లాభం లాగే నష్టం కూడా పిప్స్ ద్వారానే లెక్కిస్తారు; రిస్క్‌ను ఎప్పుడూ గుర్తుంచుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> EUR/GBP ఏ రకం పెయిర్?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> మైనర్ (Minor), ఎందుకంటే రెండూ ప్రధాన కరెన్సీలే కానీ USD లేదు.\u003c/p>","t":"కరెన్సీ పెయిర్స్: మేజర్స్, మైనర్స్ & ఎక్సోటిక్స్","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Gold trades as a single asset rather than a currency pair, but pair concepts apply—you're buying/selling gold against USD. Understanding major moves helps: if gold rises $5/oz on strong USD weakness, that's a $500 gain per lot (100 oz × $5). Always use stop-losses; gold volatility can swing 50+ pips daily, risking $500+ per lot without protection.\u003c/p>\n","te":"\n\u003cp>గోల్డ్ [XAUUSD] వర్తకంలో, [pair] ధరల సంబంధం చూడటం ముఖ్యం. ఉదాహరణకు, గోల్డ్ $1950 నుండి $1951 కి పెరిగితే, ఒక [lot] (100 oz) పై మీరు $100 లాభం పొందుతారు (10 [pips] × $0.10). గోల్డ్ ధరలు వేగంగా మారతాయి కాబట్టి, [risk management] వంటి [stop loss] నిర్ణయం చేయండి.\u003c/p>\n"}},"2":{"en":"\u003cp>Every forex trade is measured in tiny price moves, sized in standardized amounts, and often magnified by borrowed money. Understanding \u003cstrong>pips, lots and leverage\u003c/strong> is essential before you ever place a trade. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose more than you expect.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"A rising price: each pip gained or lost changes your profit or loss according to your lot size\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Pip:\u003c/strong> the standard unit of price movement. For most pairs, such as EUR/USD, one pip is 0.0001. For pairs with the Japanese yen, it is 0.01.\u003c/li>\n\u003cli>\u003cstrong>Lot:\u003c/strong> the size of your trade. A standard lot is 100,000 units of currency, a mini lot is 10,000, and a micro lot is 1,000. Larger lots make each pip worth more.\u003c/li>\n\u003cli>\u003cstrong>Leverage:\u003c/strong> a loan from your broker that lets you control a larger position with less of your own money. At 50:1, $1,000 controls $50,000. It magnifies gains \u003cem>and\u003c/em> losses equally.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>You buy 1 micro lot (1,000 units) of EUR/USD at 1.1000. On this size, one pip is worth about $0.10.\u003c/p>\n\u003cul>\n\u003cli>Price rises to 1.1050, a 50-pip gain: 50 x $0.10 = \u003cstrong>+$5\u003c/strong>.\u003c/li>\n\u003cli>Price falls to 1.0950, a 50-pip loss: 50 x $0.10 = \u003cstrong>-$5\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Now imagine a standard lot, where one pip is about $10. The same 50-pip move means $500 gained or lost. With leverage, a small account can reach that kind of exposure quickly, which is why losses can mount fast.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A pip is the basic unit of price change, and lot size determines what each pip is worth.\u003c/li>\n\u003cli>Leverage magnifies both profits and losses, so it increases risk.\u003c/li>\n\u003cli>Beginners often start with micro lots to keep potential losses small.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> If you trade 1 mini lot (10,000 units) of EUR/USD, where one pip is worth about $1, and price moves 30 pips against you, how much do you lose?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> About $30 (30 pips x $1).\u003c/p>","te":"\n\u003cp>ఫారెక్స్ ట్రేడింగ్‌లో లాభనష్టాలను కొలవడానికి మూడు ముఖ్యమైన పదాలు ఉన్నాయి: పిప్ (pip), లాట్ (lot), లెవరేజ్ (leverage). ఈ పాఠం కేవలం విద్య కోసం మాత్రమే, ఇది ఆర్థిక సలహా కాదు. ఫారెక్స్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ధర ఒక పరిధిలో కదులుతూ పిప్స్ రూపంలో మారుతుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>పిప్ (pip):\u003c/strong> ధరలో అతి చిన్న కదలిక. EUR/USD వంటి జంటలలో 0.0001 మార్పు అంటే 1 పిప్.\u003c/li>\n\u003cli>\u003cstrong>లాట్ (lot):\u003c/strong> ట్రేడ్ పరిమాణం. స్టాండర్డ్ లాట్ = 100,000 యూనిట్లు, మినీ లాట్ = 10,000, మైక్రో లాట్ = 1,000.\u003c/li>\n\u003cli>\u003cstrong>లెవరేజ్ (leverage):\u003c/strong> బ్రోకర్ ఇచ్చే అప్పు లాంటి సదుపాయం. 1:100 అంటే $100 తో $10,000 విలువైన ట్రేడ్ చేయవచ్చు. లాభాలు, నష్టాలు రెండూ పెరుగుతాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీరు EUR/USD లో 1 మైక్రో లాట్ (1,000 యూనిట్లు) కొన్నారనుకోండి. ఇక్కడ 1 పిప్ విలువ సుమారు $0.10. ధర 1.1000 నుండి 1.1050 కి పెరిగితే అది 50 పిప్స్, అంటే సుమారు $5 లాభం. ధర 30 పిప్స్ తగ్గితే సుమారు $3 నష్టం. 1:100 లెవరేజ్‌తో ఈ ట్రేడ్‌కు మార్జిన్ (margin) సుమారు $11 అవసరం. అదే ట్రేడ్‌ను 1 స్టాండర్డ్ లాట్‌తో చేస్తే ప్రతి పిప్‌కు సుమారు $10 మారుతుంది, అందుకే నష్టం వేగంగా పెరుగుతుంది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>పిప్ అంటే ధర కదలిక కొలత; లాట్ అంటే ట్రేడ్ పరిమాణం.\u003c/li>\n\u003cli>లెవరేజ్ లాభాలను పెంచినట్లే నష్టాలను కూడా పెంచుతుంది.\u003c/li>\n\u003cli>ప్రారంభంలో చిన్న లాట్ సైజ్ వాడి, స్టాప్ లాస్ (stop loss) పెట్టడం నేర్చుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> 1 మైక్రో లాట్‌లో EUR/USD 20 పిప్స్ పెరిగితే సుమారు ఎంత లాభం?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> 1 పిప్ ≈ $0.10 కాబట్టి 20 × $0.10 = సుమారు $2 లాభం.\u003c/p>","t":"పిప్స్, లాట్స్ & లెవరేజ్","g":{"en":"\n\u003cp>In gold trading, pips and lots work similarly to forex pairs. A 1-lot position (100 oz) means each $0.10 pip movement equals $10 profit or loss. With leverage, a $1,000 account could control multiple lots, amplifying gains and risks. Always use stop losses to manage leverage exposure, as gold volatility can quickly deplete undercapitalized accounts.\u003c/p>\n","te":"\n\u003cp>\nగోల్డ్ ట్రేడింగ్‌లో [pips], [lots] మరియు [leverage] అర్థం చేసుకోవడం చాలా ముఖ్యం. ఉదాహరణకు, మీరు 1 [lot] (100 oz) గోల్డ్‌కు 1:100 [leverage] వాడితే, $1,000 డిపాజిట్ నుండి $100,000 వర్తిస్తుంది. 10 [pips] పెరిగితే $100 లాభం, కానీ 10 [pips] పడితే $100 నష్టం వస్తుంది. ఎప్పుడూ అధిక [leverage] సతర్కతతో ఉపయోగించండి - తక్కువ [lots] ఎంచుకోండి మరియు [stop-loss] సెట్ చేయండి.\n\u003c/p>\n"}},"3":{"en":"\u003cp>The forex market runs 24 hours a day, five days a week, but it is not equally active all the time. Trading is spread across major financial centers, and activity rises and falls as each one opens and closes. Knowing these sessions helps you understand why prices sometimes move a lot and sometimes barely at all. This lesson is for education only and is not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Quiet sessions often show price moving sideways in a range\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Four main sessions:\u003c/strong> Sydney, Tokyo, London and New York. Each is busiest during its local business hours.\u003c/li>\n\u003cli>\u003cstrong>Overlaps matter:\u003c/strong> When two sessions are open together, such as London and New York, there are more participants. This usually means higher volume and tighter spreads (the cost to trade).\u003c/li>\n\u003cli>\u003cstrong>Pairs have favorite times:\u003c/strong> A pair tends to move most when its home markets are open. For example, EUR/USD is often most active during London and New York hours, while USD/JPY often reacts during the Tokyo session.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine EUR/USD moves only 20 pips during the quiet Asian session. During the London and New York overlap, it moves 80 pips. On a standard lot (100,000 units), one pip is worth about $10. So a 20-pip move equals roughly $200, while an 80-pip move equals roughly $800. More movement means more opportunity, but also more risk, because losses grow just as fast as gains.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Forex is open 24/5, but activity changes by session.\u003c/li>\n\u003cli>The London and New York overlap is usually the most active period.\u003c/li>\n\u003cli>More volatility means bigger potential gains and bigger potential losses, so manage your risk.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Which session overlap is typically the busiest for forex trading?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The London and New York overlap, when two of the largest financial centers are open at the same time.\u003c/p>","te":"\n\u003cp>ఫారెక్స్ మార్కెట్ వారంలో 5 రోజులు, 24 గంటలూ తెరిచే ఉంటుంది. కానీ అన్ని సమయాల్లో ఒకేలా కదలిక (movement) ఉండదు. ప్రపంచంలోని వేర్వేరు నగరాల్లో మార్కెట్లు తెరిచే సమయాలను బట్టి \"సెషన్లు\" (sessions) ఏర్పడతాయి. ఇది కేవలం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ఆసియా సెషన్‌లో ధర తరచుగా ఒక పరిధిలోనే (range) తిరుగుతుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ప్రధాన సెషన్లు:\u003c/strong> సిడ్నీ/టోక్యో (ఆసియా), లండన్ (యూరప్), న్యూయార్క్ (అమెరికా). ఒక్కో సెషన్ సుమారు 8-9 గంటలు ఉంటుంది.\u003c/li>\n\u003cli>\u003cstrong>ఓవర్‌ల్యాప్ (overlap):\u003c/strong> రెండు సెషన్లు కలిసే సమయంలో ట్రేడర్లు ఎక్కువగా ఉంటారు. లండన్-న్యూయార్క్ ఓవర్‌ల్యాప్ (భారత సమయం ప్రకారం సుమారు రాత్రి 6:30 నుండి 9:30 వరకు, కాలానుగుణంగా మారవచ్చు) అత్యంత చురుకైనది.\u003c/li>\n\u003cli>\u003cstrong>లిక్విడిటీ (liquidity) &amp; స్ప్రెడ్ (spread):\u003c/strong> యాక్టివ్ సమయాల్లో స్ప్రెడ్ తక్కువగా ఉంటుంది. నిశ్శబ్ద సమయాల్లో స్ప్రెడ్ పెరిగి ఖర్చు ఎక్కువవుతుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD జంట ఆసియా సెషన్‌లో రోజంతా కేవలం 25 పిప్స్ (pips) మాత్రమే కదిలిందనుకుందాం. అదే జంట లండన్-న్యూయార్క్ ఓవర్‌ల్యాప్‌లో 60 పిప్స్ కదలవచ్చు. 1 స్టాండర్డ్ లాట్‌లో 1 పిప్ ≈ 10 USD అయితే, 25 పిప్స్ = 250 USD, 60 పిప్స్ = 600 USD కదలిక. ఎక్కువ కదలిక అంటే లాభం మాత్రమే కాదు, నష్ట అవకాశమూ అంతే పెరుగుతుంది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ఫారెక్స్‌లో ప్రధాన సెషన్లు మూడు: ఆసియా, లండన్, న్యూయార్క్.\u003c/li>\n\u003cli>ఓవర్‌ల్యాప్ సమయాల్లో కదలిక, లిక్విడిటీ ఎక్కువ; స్ప్రెడ్ తక్కువ.\u003c/li>\n\u003cli>ఎక్కువ కదలిక అంటే ఎక్కువ రిస్క్ కూడా. ఎప్పుడూ స్టాప్ లాస్ (stop loss) ఉపయోగించండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> రోజులో అత్యంత చురుకైన ఫారెక్స్ సమయం సాధారణంగా ఏది?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> లండన్ మరియు న్యూయార్క్ సెషన్లు కలిసే ఓవర్‌ల్యాప్ సమయం.\u003c/p>","t":"ఫారెక్స్ సెషన్లు & ట్రేడ్ చేయడానికి మంచి సమయాలు","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Gold follows similar session patterns to forex pairs. During the London open, XAUUSD often sees increased volatility and volume. For example, a 50-pip move during London hours equals $500 profit or loss on one standard lot. \u003cstrong>Risk Tip:\u003c/strong> Always use stop losses during high-volatility sessions to protect against sudden price swings, especially during overlaps between major trading centers.\u003c/p>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] వర్తక సమయాలు అతిపముఖం. లండన్ [London session] మరియు న్యూయార్క్ [New York session] సమయాలలో సోన ఎక్కువ చలనశీలత ఉంటుంది. ఉదాహరణకు, నీ [1 lot = 100 oz] లో 50 [pips] లాభం = $500. కానీ ప్రమాదం: అధిక [volatility] సమయాలలో [stop loss] లేనిది ఖతరనాక. ఎల్లప్పుడు [risk management] గమనించండి.\u003c/p>\n"}},"4":{"en":"\u003cp>Before you can trade forex, you need a \u003cstrong>broker\u003c/strong>: a company that connects you to the currency market. Brokers earn money mainly from the \u003cstrong>spread\u003c/strong> (and sometimes commissions), so understanding their costs is your first lesson in risk management. This lesson is educational only, not financial advice. Forex trading is high risk and you can lose more than you expect.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price moving sideways: the spread is a cost you pay on every entry, even when price goes nowhere\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Spread:\u003c/strong> every pair has two prices. The \u003cem>bid\u003c/em> is where you sell and the \u003cem>ask\u003c/em> is where you buy. The gap between them is the spread, usually measured in pips. You start every trade slightly in the red by that amount.\u003c/li>\n\u003cli>\u003cstrong>Broker types:\u003c/strong> market makers set their own prices, while ECN/STP brokers pass on prices from liquidity providers and often charge a commission plus a tighter spread. Check that your broker is regulated in your region.\u003c/li>\n\u003cli>\u003cstrong>Platforms:\u003c/strong> MetaTrader 4 (MT4) and MetaTrader 5 (MT5) are popular free platforms for charts, indicators and placing orders. MT4 is simpler and focused on forex. MT5 adds more timeframes, order types and markets. Always practise first on a \u003cstrong>demo account\u003c/strong> using virtual money.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD shows bid 1.1000 and ask 1.1002. The spread is \u003cstrong>2 pips\u003c/strong>. You buy 1 standard lot (100,000 units) at 1.1002. At that size, one pip is worth about \u003cstrong>$10\u003c/strong>, so the spread costs you roughly \u003cstrong>$20\u003c/strong> immediately. Price must rise 2 pips just for you to break even. With a 0.1 mini lot (10,000 units), one pip is about $1, so the same spread costs about $2.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>The spread is the difference between bid and ask, and it is a real cost on every trade.\u003c/li>\n\u003cli>Choose a regulated broker and compare spreads, commissions and fees.\u003c/li>\n\u003cli>Learn MT4 or MT5 on a demo account before risking real money.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> A pair has bid 1.2500 and ask 1.2503. What is the spread in pips?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> 3 pips (1.2503 − 1.2500 = 0.0003, and 0.0001 is one pip).\u003c/p>","te":"\n\u003cp>ఫారెక్స్‌లో ట్రేడ్ చేయాలంటే మీకు బ్రోకర్ (broker) అవసరం. బ్రోకర్ అంటే మార్కెట్‌కు మిమ్మల్ని కలిపే సంస్థ. ఈ పాఠంలో బ్రోకర్ ఎలా సంపాదిస్తాడో, స్ప్రెడ్ (spread) అంటే ఏమిటో, MT4/MT5 ప్లాట్‌ఫామ్‌లు ఎలా పనిచేస్తాయో తెలుసుకుందాం. ఇది కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంది.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ధర చిన్న పరిధిలో కదులుతున్నప్పుడు స్ప్రెడ్ ఖర్చు ప్రభావం ఎక్కువగా కనిపిస్తుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>స్ప్రెడ్ (spread):\u003c/strong> కొనుగోలు ధర (ask), అమ్మకం ధర (bid) మధ్య తేడా. ఇది బ్రోకర్‌కు వచ్చే ప్రధాన ఖర్చు, ట్రేడ్ తెరిచిన వెంటనే మీరు చెల్లించేది.\u003c/li>\n\u003cli>\u003cstrong>బ్రోకర్ ఎంపిక:\u003c/strong> నియంత్రణ (regulation), తక్కువ స్ప్రెడ్, కమిషన్ (commission), డబ్బు విత్‌డ్రా సౌలభ్యం చూడాలి. ముందుగా డెమో ఖాతా (demo account) వాడండి.\u003c/li>\n\u003cli>\u003cstrong>ప్లాట్‌ఫామ్ (platform):\u003c/strong> MT4, MT5 ద్వారా చార్టులు చూడవచ్చు, ఆర్డర్లు పెట్టవచ్చు, స్టాప్ లాస్ (stop loss) సెట్ చేయవచ్చు. MT5లో ఎక్కువ టైమ్‌ఫ్రేమ్‌లు, సాధనాలు ఉంటాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USDలో bid 1.1000, ask 1.1002 అనుకోండి. స్ప్రెడ్ 2 పిప్స్ (pips). 1 స్టాండర్డ్ లాట్ (lot)లో 1 పిప్ ≈ 10 USD, కాబట్టి ట్రేడ్ తెరవగానే సుమారు 20 USD ఖర్చు అవుతుంది. అదే 0.1 లాట్ అయితే 1 పిప్ ≈ 1 USD, ఖర్చు సుమారు 2 USD. ధర కనీసం 2 పిప్స్ మీ వైపు కదిలితేనే మీరు బ్రేక్‌ఈవెన్ (breakeven) చేరతారు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>స్ప్రెడ్ అనేది ప్రతి ట్రేడ్‌లో ఉండే ఖర్చు.\u003c/li>\n\u003cli>నియంత్రణ ఉన్న బ్రోకర్‌ను ఎంచుకోండి, ముందు డెమోలో ప్రాక్టీస్ చేయండి.\u003c/li>\n\u003cli>MT4, MT5 ప్రముఖ ప్లాట్‌ఫామ్‌లు; రెండింటిలోనూ రిస్క్ నియంత్రణ సాధనాలు ఉన్నాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> bid 1.2500, ask 1.2503 అయితే స్ప్రెడ్ ఎంత?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> 3 పిప్స్ (1.2503 − 1.2500 = 0.0003).\u003c/p>","t":"బ్రోకర్లు, స్ప్రెడ్లు & ప్లాట్‌ఫామ్‌లు (MT4/MT5)","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Understanding spreads is crucial for gold trading since wider spreads directly impact your profitability. If gold trades at a 0.40 pip spread on your MT4 platform, that's $0.04 cost per standard lot before price movement. Trading 1 lot (100 oz) with a 50 pip stop-loss costs $5 in spread alone. Always compare spreads across brokers and avoid trading during low-liquidity sessions when spreads widen dramatically.\u003c/p>\n","te":"\n\u003cp>\n[Gold trading] లో కూడా [brokers], [spreads] మరియు [platforms] ముఖ్యమైనవి. ఉదాహరణకు, XAUUSD పై 2 [pip] [spread] ఉంటే ఇది $0.20 నష్టం (1 [lot] = 100 oz కోసం). మంచి [broker] తక్కువ [spread] ఇస్తుంది. [Risk] కోసం: చిన్న [lot size] ఉపయోగించండి, [platform] నిర్ভరమైనది కాదా లేదా నెమ్మదిగా ఉందా అని పరీక్షించండి.\n\u003c/p>\n"}},"5":{"en":"\u003cp>Candlesticks are the most popular way to display price on a forex chart. Each candle summarizes what a currency pair did during one time period, such as one hour or one day. Learning to read them is like learning the alphabet of charts. This lesson is for education only and is not financial advice. Forex trading carries a high level of risk.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"A run of bullish candles shows buyers pushing price higher\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Body:\u003c/strong> The thick part shows the open and close prices. A bullish candle (often green) closes higher than it opened. A bearish candle (often red) closes lower.\u003c/li>\n\u003cli>\u003cstrong>Wicks:\u003c/strong> The thin lines above and below the body are the shadows. They show the highest and lowest prices reached in that period.\u003c/li>\n\u003cli>\u003cstrong>Size matters:\u003c/strong> A long body suggests strong movement in one direction. A small body with long wicks suggests indecision between buyers and sellers.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Say EUR/USD opens a daily candle at 1.1000, climbs to a high of 1.1060, dips to a low of 1.0980, and closes at 1.1040. The body spans 40 pips (1.1000 to 1.1040), so it is bullish. The upper wick is 20 pips and the lower wick is 20 pips. On a standard lot (100,000 units), one pip is about $10, so that 40-pip body represents roughly $400 of movement per lot. Smaller position sizes scale this down, for example about $1 per pip on a micro lot.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Each candle shows four prices: open, high, low, and close.\u003c/li>\n\u003cli>Body color and size show direction and strength; wicks show the extremes.\u003c/li>\n\u003cli>A single candle is only a clue, not a guarantee of what price will do next.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> A candle opens at 1.2500 and closes at 1.2450. Is it bullish or bearish, and how big is the body?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> It is bearish because it closed below its open. The body is 50 pips (1.2500 minus 1.2450).\u003c/p>","te":"\n\u003cp>ఫారెక్స్ చార్ట్‌లో ధర కదలికను చూపించడానికి ఎక్కువగా వాడేది క్యాండిల్‌స్టిక్ (candlestick). ప్రతి క్యాండిల్ ఒక నిర్దిష్ట సమయంలో (ఉదాహరణకు 1 గంట) ధర ఎలా కదిలిందో చెబుతుంది. ఈ పాఠం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"వరుసగా పెరుగుతున్న క్యాండిల్స్ అప్‌ట్రెండ్ (uptrend) చూపిస్తాయి\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>నాలుగు ధరలు:\u003c/strong> ప్రతి క్యాండిల్‌లో ఓపెన్ (open), హై (high), లో (low), క్లోజ్ (close) అనే నాలుగు ధరలు ఉంటాయి.\u003c/li>\n\u003cli>\u003cstrong>బాడీ (body):\u003c/strong> ఓపెన్, క్లోజ్ మధ్య మందపాటి భాగం. క్లోజ్ ఓపెన్ కంటే పైన ఉంటే బుల్లిష్ (bullish, సాధారణంగా ఆకుపచ్చ), కింద ఉంటే బేరిష్ (bearish, సాధారణంగా ఎరుపు).\u003c/li>\n\u003cli>\u003cstrong>విక్ (wick):\u003c/strong> బాడీ పైన, కింద ఉండే సన్నని గీతలు. ఆ సమయంలో ధర చేరిన అత్యధిక, అత్యల్ప స్థాయిలను చూపుతాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD 1 గంట క్యాండిల్‌లో ఓపెన్ 1.1000, హై 1.1060, లో 1.0980, క్లోజ్ 1.1040 అనుకోండి. క్లోజ్ ఓపెన్ కంటే పైన ఉంది కాబట్టి ఇది బుల్లిష్ క్యాండిల్. బాడీ = 40 పిప్స్ (pips). పై విక్ = 20 పిప్స్, కింది విక్ = 20 పిప్స్. మొత్తం పరిధి 80 పిప్స్. 1 స్టాండర్డ్ లాట్‌కు పిప్ విలువ సుమారు 10 USD కాబట్టి, 40 పిప్స్ కదలిక అంటే 1 లాట్‌కు సుమారు 400 USD తేడా. ఇది ఎంత రిస్క్ ఉంటుందో అర్థం చేసుకోవడానికి మాత్రమే ఉదాహరణ; ఇది లాభం హామీ కాదు, నష్టం కూడా జరగవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ఒక క్యాండిల్ = ఓపెన్, హై, లో, క్లోజ్ అనే నాలుగు ధరలు.\u003c/li>\n\u003cli>బాడీ ఓపెన్-క్లోజ్ దిశను, విక్స్ ధర ఎంత దూరం వెళ్లిందో చూపుతాయి.\u003c/li>\n\u003cli>ఒక్క క్యాండిల్‌ను బట్టి నిర్ణయం తీసుకోకండి; ట్రెండ్‌తో కలిపి చూడండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> క్లోజ్ ధర ఓపెన్ ధర కంటే తక్కువగా ఉంటే ఆ క్యాండిల్ ఏమిటి?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> బేరిష్ క్యాండిల్ (bearish candle), ఎందుకంటే ఆ సమయంలో ధర కిందకు వెళ్లి ముగిసింది.\u003c/p>","t":"క్యాండిల్‌స్టిక్స్ చదవడం","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Candlestick patterns reveal gold's price direction through open, high, low, and close prices. A bullish engulfing pattern—where a larger green candle completely covers the prior red candle—suggests upward momentum. For example, if gold closes at $2,050 after such a pattern forms, you might see a 20-pip move ($2 profit per lot). Always use stop losses below support levels to protect against sudden reversals in volatile precious metals markets.\u003c/p>\n","te":"\n\u003cp>\nగోల్డ్ [Gold/XAUUSD] ట్రేడింగ్‌లో [candlestick] నమూనాలు చేసిన కదలికలను చూసుకోవడం చాలా ముఖ్యమైనది. ఉదాహరణకు, ఒక [bullish engulfing candlestick] ఏర్పడితే అది కిందికి వెళ్లిన ధరలు ఇప్పుడు పైకి వెళ్లగలవని చూపిస్తుంది. 1 [lot] = 100 [oz] వద్ద, ధర $20 పెరిగితే ఆ [candlestick] నుండి $200 లాభం సాధ్యమవుతుంది. కానీ ఎల్లప్పుడు [stop loss] నిర్ణయించుకోండి, ఎందుకంటే ధరలు వ్యతిరేక దిశకు కూడా వెళ్లవచ్చు.\n\u003c/p>\n"}},"6":{"en":"\u003cp>Price rarely moves in a straight line. It often stalls or turns around at certain levels, and traders mark these levels on their charts. \u003cstrong>Support\u003c/strong> is a price area where falling prices have tended to pause or bounce. \u003cstrong>Resistance\u003c/strong> is a price area where rising prices have tended to stall or reverse. This lesson is for education only, not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price bouncing between support below and resistance above\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Memory of the market:\u003c/strong> Traders remember past turning points. When price returns to them, many act again, so the level may hold. Nothing guarantees it will.\u003c/li>\n\u003cli>\u003cstrong>Zones, not exact lines:\u003c/strong> Support and resistance are usually areas a few pips wide. Price may poke slightly through a level and still respect it.\u003c/li>\n\u003cli>\u003cstrong>Roles can flip:\u003c/strong> If price breaks clearly above resistance, that level may later act as support. If it breaks below support, that level may become resistance.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD has bounced three times from 1.0800 (support) and turned down twice from 1.0900 (resistance). The range is 100 pips wide.\u003c/p>\n\u003cp>On a standard lot (100,000 units), one pip is worth about $10. On a mini lot (10,000 units), one pip is worth about $1. If a trader bought a mini lot at 1.0810 and price rose to 1.0890, that is an 80-pip move, or roughly $80 in profit. If price instead broke below 1.0800 and fell 50 pips, the same position would lose roughly $50 or more. Levels can fail, which is why risk is real.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Support is a floor where price has bounced; resistance is a ceiling where price has stalled.\u003c/li>\n\u003cli>Treat these levels as zones, and expect them to fail sometimes.\u003c/li>\n\u003cli>A broken level can switch roles, so support may become resistance and vice versa.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Price breaks clearly above a resistance level and later falls back to it. What might that level now act as?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Support. Broken resistance often flips into support, though it is not guaranteed.\u003c/p>","te":"\n\u003cp>చార్ట్‌లో ధర మళ్లీ మళ్లీ ఆగే లేదా వెనక్కి తిరిగే స్థాయిలు ఉంటాయి. వాటినే సపోర్ట్ (support), రెసిస్టెన్స్ (resistance) అంటారు. ఇవి ట్రేడర్లు ఎక్కువగా గమనించే ప్రాథమిక సాధనాలు. ఈ పాఠం కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ధర సపోర్ట్ మరియు రెసిస్టెన్స్ మధ్య కదులుతోంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>సపోర్ట్ (support):\u003c/strong> ధర పడిపోతున్నప్పుడు కొనుగోలుదారులు ప్రవేశించి ఆపే కింది స్థాయి. ఇది నేలలా పనిచేస్తుంది.\u003c/li>\n\u003cli>\u003cstrong>రెసిస్టెన్స్ (resistance):\u003c/strong> ధర పెరుగుతున్నప్పుడు అమ్మకందారులు ప్రవేశించి ఆపే పై స్థాయి. ఇది పైకప్పులా పనిచేస్తుంది.\u003c/li>\n\u003cli>\u003cstrong>బ్రేక్అవుట్ (breakout):\u003c/strong> ధర ఈ స్థాయిని దాటితే, అది కొత్త దిశలో కదలవచ్చు. అప్పుడు పాత రెసిస్టెన్స్ కొత్త సపోర్ట్‌గా మారవచ్చు. అయితే తప్పుడు బ్రేక్అవుట్‌లు (false breakout) కూడా జరుగుతాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 దగ్గర మూడుసార్లు ఆగి పైకి తిరిగింది. అంటే 1.1000 సపోర్ట్. పైన 1.1100 దగ్గర రెసిస్టెన్స్ ఉంది. ఈ రెండింటి మధ్య దూరం 100 పిప్స్ (pips).\u003c/p>\n\u003cp>ఒక ట్రేడర్ 1.1010 దగ్గర కొని, స్టాప్ లాస్ (stop loss) 1.0980 దగ్గర, అంటే 30 పిప్స్ రిస్క్ పెట్టాడనుకుందాం. 1 స్టాండర్డ్ లాట్‌కు పిప్ విలువ సుమారు $10, కాబట్టి రిస్క్ సుమారు $300. టార్గెట్ 1.1090 అయితే లాభం 80 పిప్స్ అంటే సుమారు $800. 0.1 లాట్ (mini lot) అయితే పిప్‌కు సుమారు $1, రిస్క్ $30, లాభం $80. ఇది ఉదాహరణ మాత్రమే; ధర ఎప్పుడైనా వ్యతిరేక దిశలో వెళ్లవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>సపోర్ట్ కింద, రెసిస్టెన్స్ పైన ఉంటాయి; ధర ఇక్కడ తరచుగా స్పందిస్తుంది.\u003c/li>\n\u003cli>ఇవి ఖచ్చితమైన గీతలు కావు, ఒక ప్రాంతం (zone) లాంటివి.\u003c/li>\n\u003cli>ఎప్పుడూ స్టాప్ లాస్ (stop loss) వాడండి; ఏ స్థాయి కూడా విఫలం కాదని హామీ లేదు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర రెసిస్టెన్స్‌ను బలంగా దాటి పైకి వెళ్లిన తర్వాత, ఆ పాత రెసిస్టెన్స్ ఏ పాత్ర పోషించవచ్చు?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> అది కొత్త సపోర్ట్ (support)గా మారవచ్చు.\u003c/p>","t":"సపోర్ట్ & రెసిస్టెన్స్ (Support & Resistance)","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>Support and resistance levels are critical when trading gold (XAUUSD). For example, if gold repeatedly bounces off $2,000/oz (resistance), traders watch for breakouts above this level. With 1 lot = 100 oz, a 10-pip move equals $100 profit or loss. Always use stop-losses below support levels to protect against false breakouts that can trigger rapid losses.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>\nGold [XAUUSD] వర్తమానం [Support &amp; Resistance] స్థాయిలు ఎక్కువ ముఖ్యమైనవి. ఉదాహరణకు, gold $2000 వద్ద బలమైన [resistance] ఉంటే, ఆ ధర చేరిన తర్వాత రిబౌండ్ సంభవించవచ్చు. ఒక [1 lot] బిక్రయిస్తే, $2000 నుండి $1990 వరకు 100 పిప్‌ల [stop loss] ఉంచుకోండి - ఇది $1000 నష్టం. ఎల్లప్పుడు [risk management] గుర్తుంచుకోండి.\n\u003c/p>\n"}},"7":{"en":"\u003cp>A trend is the general direction price is moving over time. Spotting the trend is one of the first skills a forex trader learns, because it helps you understand whether buyers or sellers have been in control. A trendline is a simple straight line drawn on a chart to help you see that direction. This lesson is for education only, not financial advice. Forex trading is high risk, and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"An uptrend: higher highs and higher lows, with a rising trendline under the lows\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Three kinds of trend:\u003c/strong> an uptrend makes higher highs and higher lows, a downtrend makes lower highs and lower lows, and a range moves sideways without a clear direction.\u003c/li>\n\u003cli>\u003cstrong>Drawing a trendline:\u003c/strong> in an uptrend, connect two or more swing lows with a straight line. In a downtrend, connect swing highs. The more times price touches the line and turns, the more traders pay attention to it.\u003c/li>\n\u003cli>\u003cstrong>Trends can end:\u003c/strong> if price closes clearly beyond the trendline, the trend may be weakening or changing. A trendline is a guide, not a guarantee.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine EUR/USD rises from 1.0800 to 1.0900, dips to 1.0850, then rises to 1.0950. The lows (1.0800 and 1.0850) and highs (1.0900 and 1.0950) are both climbing, so this is an uptrend. From the first low to the latest high, the move is 150 pips. On a standard lot (100,000 units), one pip is about $10, so that swing equals roughly $1,500 on paper. Moves can also go the other way, and a trader holding a position against the trend could lose a similar amount.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A trend is the overall direction of price: up, down, or sideways.\u003c/li>\n\u003cli>Trendlines connect swing lows (uptrend) or swing highs (downtrend) to show that direction.\u003c/li>\n\u003cli>A break of a trendline is a warning sign, not proof that the trend has reversed.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> In a downtrend, which points do you connect to draw the trendline?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The swing highs. In a downtrend, price makes lower highs, so the line slopes downward above the price.\u003c/p>","te":"\n\u003cp>మార్కెట్‌లో ధర ఎప్పుడూ ఒకే దిశలో నేరుగా వెళ్లదు; పైకి కిందికి కదులుతూనే ఒక మొత్తం దిశను అనుసరిస్తుంది. ఆ దిశనే ట్రెండ్ (trend) అంటారు. ట్రెండ్‌ను గుర్తించడం చార్ట్ చదవడంలో మొదటి మెట్టు. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"అప్‌ట్రెండ్: ఎత్తైన హైస్ మరియు ఎత్తైన లోస్\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>అప్‌ట్రెండ్ (uptrend):\u003c/strong> ధర ఒక్కో శిఖరం (high), ఒక్కో లోయ (low) కంటే ఎత్తుగా ఏర్పడుతుంది. \u003cstrong>డౌన్‌ట్రెండ్ (downtrend):\u003c/strong> శిఖరాలు, లోయలు రెండూ క్రమంగా తగ్గుతూ వస్తాయి. ధర ఒక పరిధిలోనే తిరుగుతుంటే దాన్ని రేంజ్ (range) అంటారు.\u003c/li>\n\u003cli>\u003cstrong>ట్రెండ్‌లైన్ (trendline):\u003c/strong> అప్‌ట్రెండ్‌లో లోయలను కలుపుతూ, డౌన్‌ట్రెండ్‌లో శిఖరాలను కలుపుతూ గీసే గీత. కనీసం రెండు, ఆదర్శంగా మూడు బిందువులు తాకాలి.\u003c/li>\n\u003cli>\u003cstrong>బ్రేక్ (break):\u003c/strong> ధర ట్రెండ్‌లైన్‌ను దాటి గట్టిగా క్లోజ్ అయితే ట్రెండ్ బలహీనపడుతోందని, మారవచ్చని సూచన. కానీ ఇది హామీ కాదు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 నుండి 1.1050కి పెరిగి, 1.1020కి తగ్గి, మళ్లీ 1.1080కి చేరింది. తర్వాత 1.1050 వద్ద ఆగి, 1.1120కి వెళ్లింది. ఇక్కడ లోయలు (1.1000, 1.1020, 1.1050) పెరుగుతున్నాయి, అంటే అప్‌ట్రెండ్. 1.1000 నుండి 1.1120 వరకు కదలిక 120 పిప్స్ (pips). 1 స్టాండర్డ్ లాట్‌లో 1 పిప్ ≈ 10 USD కాబట్టి ఈ కదలిక విలువ సుమారు 1,200 USD; 0.01 మైక్రో లాట్‌లో సుమారు 12 USD. ఇది కేవలం ఉదాహరణ; నష్టాలు కూడా అంతే వేగంగా రావచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>అప్‌ట్రెండ్ అంటే ఎత్తైన హైస్ + ఎత్తైన లోస్; డౌన్‌ట్రెండ్ అంటే తగ్గుతున్న హైస్ + లోస్.\u003c/li>\n\u003cli>ట్రెండ్‌లైన్ ట్రెండ్ దిశను, సంభావ్య సపోర్ట్/రెసిస్టెన్స్‌ను చూపే మార్గదర్శి మాత్రమే.\u003c/li>\n\u003cli>ఏ ట్రెండ్ కూడా శాశ్వతం కాదు; ఫారెక్స్ అధిక రిస్క్, కాబట్టి స్టాప్ లాస్ (stop loss) వాడండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> అప్‌ట్రెండ్‌లో ట్రెండ్‌లైన్‌ను ఏ బిందువులను కలుపుతూ గీస్తారు?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> లోయలను (lows) కలుపుతూ, ధర కింద గీస్తారు.\u003c/p>","t":"ట్రెండ్‌లు & ట్రెండ్‌లైన్‌లు (Trends & Trendlines)","g":{"en":"\n\u003cp>In gold trading, trendlines help identify support and resistance levels. For example, if XAUUSD forms an uptrend at $2,000/oz and pulls back to this trendline, traders often watch for a bounce. Respect your stop losses carefully—if gold breaks below your trendline by just 5 pips ($0.50), your position on 1 lot risks $50 quickly. Always plan exits before entering.\u003c/p>\n","te":"\n\u003cp>సోने (XAUUSD) వర్తకరులు [trendlines] ఉపయోగించి ధర దిశ అంచనా వేయవచ్చు. ఉదాహరణకు, సోన ధర $1950-$1990 మధ్య [uptrend] చూపిస్తే, [trendline] నుండి బౌన్స్ వద్ద కొనవచ్చు—1 [lot] పై 40 పిప్‌ల లాభం = $400 సంభవితమవుతుంది. ఎక్కువ లాభం కోసం [trendline] విచ్ఛేదనకు ముందే [stop loss] నిర్ణయించండి.\u003c/p>\n"}},"8":{"en":"\u003cp>Market structure is the way price moves through a series of peaks (highs) and troughs (lows). Reading it helps you see whether a currency pair is trending up, trending down, or going nowhere. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"Uptrend: each high and each low is higher than the one before (HH/HL)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Uptrend:\u003c/strong> price makes Higher Highs (HH) and Higher Lows (HL). Each peak and each pullback bottom sits above the previous one.\u003c/li>\n\u003cli>\u003cstrong>Downtrend:\u003c/strong> price makes Lower Highs (LH) and Lower Lows (LL). Each peak and each dip sits below the previous one.\u003c/li>\n\u003cli>\u003cstrong>Structure break:\u003c/strong> when an uptrend fails to make a new HH, or price falls below the last HL, the trend may be weakening or reversing. It is a warning sign, not a guarantee.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD rises to 1.1000, pulls back to 1.0950, then rises to 1.1050. That is a Higher High (1.1050 above 1.1000). Price then dips to 1.1000, a Higher Low (above 1.0950). The pullback from 1.1050 to 1.1000 is 50 pips. On a standard lot (100,000 units), one pip is about $10, so that pullback equals roughly $500 of movement. If price then fell below 1.1000, the HL would be broken and the uptrend would be in question.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Uptrend = HH + HL; downtrend = LH + LL.\u003c/li>\n\u003cli>The most recent higher low (or lower high) is a key level to watch.\u003c/li>\n\u003cli>A break of structure signals possible change, but it can also be a false alarm. Risk management always matters.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Price has been making HH and HL, then drops below the last HL. What might this suggest?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The uptrend may be weakening or reversing, since the structure has been broken. It is a reason to be cautious, not a certain signal.\u003c/p>","te":"\n\u003cp>ఈ పాఠం విద్యా ప్రయోజనం కోసం మాత్రమే; ఇది ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది. ధర ఎప్పుడూ సరళ రేఖలో కదలదు; అది అలల్లా పైకి కిందకి వెళ్తుంది. ఈ అలల అమరికను మార్కెట్ స్ట్రక్చర్ (market structure) అంటారు. దీన్ని చూసి ట్రెండ్ (trend) దిశను అర్థం చేసుకోవచ్చు.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"అప్‌ట్రెండ్: ఒకదాని తర్వాత ఒకటి ఎత్తైన హైలు (HH) మరియు ఎత్తైన లోలు (HL)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>అప్‌ట్రెండ్ (uptrend):\u003c/strong> ధర హయ్యర్ హై (Higher High - HH), హయ్యర్ లో (Higher Low - HL) చేస్తూ పైకి వెళ్తుంది. అంటే ప్రతి శిఖరం, ప్రతి లోయ ముందుదానికంటే ఎత్తులో ఉంటాయి.\u003c/li>\n\u003cli>\u003cstrong>డౌన్‌ట్రెండ్ (downtrend):\u003c/strong> ధర లోయర్ హై (Lower High - LH), లోయర్ లో (Lower Low - LL) చేస్తూ కిందకి వెళ్తుంది.\u003c/li>\n\u003cli>\u003cstrong>ట్రెండ్ మారే సూచన:\u003c/strong> అప్‌ట్రెండ్‌లో ధర చివరి HL కింద ముగిస్తే, ట్రెండ్ బలహీనపడుతోందని సూచన కావచ్చు. ఇది ఖచ్చితం కాదు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 నుంచి 1.1050కి పెరిగింది (మొదటి హై). తర్వాత 1.1020కి తగ్గింది (HL). మళ్లీ 1.1080కి పెరిగింది (HH). ఇక్కడ HH మొదటి హై కంటే 30 పిప్స్ (pips) ఎక్కువ. 1 స్టాండర్డ్ లాట్‌లో 1 పిప్ ≈ 10 USD అనుకుంటే, 30 పిప్స్ కదలిక ≈ 300 USD విలువ. ఒక చిన్న 0.01 లాట్‌లో అది ≈ 3 USD మాత్రమే. ధర 1.1020 కింద ముగిస్తే HL విరిగింది, అప్‌ట్రెండ్ బలహీనపడవచ్చు. ఇది కేవలం ఉదాహరణ; నష్టాలు కూడా అంతే వేగంగా జరగవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>HH + HL = అప్‌ట్రెండ్; LH + LL = డౌన్‌ట్రెండ్.\u003c/li>\n\u003cli>ట్రెండ్ దిశను చూడటం ధర ప్రవర్తనను అర్థం చేసుకోవడానికి సహాయపడుతుంది, కానీ భవిష్యత్తును హామీ ఇవ్వదు.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ (stop loss)తో రిస్క్‌ను నియంత్రించడం నేర్చుకోండి; డెమో అకౌంట్‌లో ముందు ప్రాక్టీస్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర వరుసగా లోయర్ హై, లోయర్ లో చేస్తుంటే అది ఏ ట్రెండ్?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> డౌన్‌ట్రెండ్ (downtrend).\u003c/p>","t":"మార్కెట్ స్ట్రక్చర్ (HH/HL)","g":{"en":"\n\u003cp>In gold trading, identifying higher highs/lows helps confirm trends. For example, if XAUUSD forms a higher high at $2,050 after bouncing from $2,045, bullish momentum strengthens. Watch for breakouts: a 1-lot position risks $10 per pip, so place stops 20 pips below support ($2.00 risk per ounce) to manage downside exposure effectively during volatile reversals.\u003c/p>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] ట్రేడింగ్‌లో [Market Structure] నమూనాలు చాలా ముఖ్యమైనవి. ఉదాహరణకు, ఎగువ [Higher High] మరియు ఎగువ [Higher Low] లు గమనించినప్పుడు ఊర్ధ్వ ధోరణి [uptrend] ఉందని అర్థం. ఒక [lot] (100 oz) లో 50 [pips] లాభం $500 (50 × $10). ఏదైనా [Market Structure] ఆధారంగా, [Stop Loss] ని ఎల్లప్పుడు ఉపయోగించండి నష్టాలను నియంత్రించడానికి.\u003c/p>\n"}},"9":{"en":"\u003cp>Candlesticks show four prices for a chosen time period: the open, high, low, and close. Certain shapes can hint at hesitation or a possible shift in momentum. Two of the most common are the \u003cstrong>doji\u003c/strong> and the \u003cstrong>hammer\u003c/strong>. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"vee\" data-c=\"A hammer forming after a decline, showing buyers pushing price back up from the low\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Doji:\u003c/strong> The open and close are almost equal, so the body is tiny or flat. It shows indecision, as neither buyers nor sellers won the period.\u003c/li>\n\u003cli>\u003cstrong>Hammer:\u003c/strong> A small body near the top with a long lower wick, at least twice the body's length. Sellers pushed price down, but buyers drove it back up. It is most often noted after a decline.\u003c/li>\n\u003cli>\u003cstrong>Context matters:\u003c/strong> A single candle is a clue, not a signal. Traders usually wait for the next candle to confirm, and they look at the trend and nearby support levels.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD has been falling. One hourly candle opens at 1.0850, drops to 1.0810 (40 pips below), then closes at 1.0845. The body is just 5 pips, and the lower wick is 35 pips. That is a hammer shape.\u003c/p>\n\u003cp>On a standard lot (100,000 units), one pip is about $10, so the 40-pip drop was worth roughly $400 and the 35-pip recovery roughly $350. On a micro lot (1,000 units), one pip is about $0.10. If the next candle closes above 1.0850, some traders see it as confirmation. It is still not guaranteed, and price can keep falling.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A doji signals indecision, with open and close nearly equal.\u003c/li>\n\u003cli>A hammer has a small body and a long lower wick, suggesting buyers rejected lower prices.\u003c/li>\n\u003cli>Never rely on one candle alone. Look for confirmation and manage risk.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What does a doji candle usually suggest about the market?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Indecision. Buyers and sellers were balanced, so price closed at or near where it opened.\u003c/p>","te":"\n\u003cp>క్యాండిల్‌స్టిక్ (candlestick) చార్ట్‌లో ప్రతి క్యాండిల్ ఒక నిర్ణీత సమయంలో ధర ఎలా కదిలిందో చూపిస్తుంది. డోజీ (Doji) మరియు హ్యామర్ (Hammer) అనే రెండు ప్యాటర్న్స్ మార్కెట్‌లో కొనేవారు, అమ్మేవారి మధ్య పోరాటాన్ని అర్థం చేసుకోవడానికి సహాయపడతాయి. ఇది కేవలం విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"dbot\" data-c=\"down trend చివరిలో హ్యామర్ క్యాండిల్ రివర్సల్ సూచన కావచ్చు\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>డోజీ (Doji):\u003c/strong> ఓపెన్ (open), క్లోజ్ (close) ధరలు దాదాపు సమానంగా ఉంటాయి. క్యాండిల్ బాడీ (body) చాలా చిన్నగా ఉంటుంది. కొనేవారు, అమ్మేవారు సమానంగా ఉన్నారని, మార్కెట్ సందిగ్ధంలో ఉందని అర్థం.\u003c/li>\n\u003cli>\u003cstrong>హ్యామర్ (Hammer):\u003c/strong> చిన్న బాడీ పైన, కింద పొడవైన విక్ (wick/shadow) ఉంటుంది. ధర కిందకు పడి, మళ్లీ పైకి తిరిగి వచ్చిందని చూపుతుంది. ఇది డౌన్‌ట్రెండ్ (downtrend) చివరిలో వస్తే కొనేవారు బలం పుంజుకుంటున్నారనే సూచన కావచ్చు.\u003c/li>\n\u003cli>\u003cstrong>నిర్ధారణ (confirmation):\u003c/strong> ఒక్క క్యాండిల్‌తో నిర్ణయం తీసుకోకూడదు. తర్వాతి క్యాండిల్ ఆ దిశలో కదిలిందో లేదో చూడాలి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD డౌన్‌ట్రెండ్‌లో ఉందనుకోండి. ఒక క్యాండిల్ 1.0800 వద్ద ఓపెన్ అయి, 1.0750 వరకు పడి (50 pips కింద విక్), 1.0795 వద్ద క్లోజ్ అయింది. ఇది హ్యామర్. తర్వాతి క్యాండిల్ పైకి వెళ్తే నిర్ధారణ. ఉదాహరణకు 1.0805 వద్ద కొని, స్టాప్ లాస్ (stop loss) 1.0745 వద్ద (60 pips రిస్క్) పెడితే, 0.01 లాట్ (micro lot)లో ఒక pip ≈ $0.10, కాబట్టి గరిష్ట నష్టం ≈ $6. ఇది కేవలం ఉదాహరణ మాత్రమే; ఫారెక్స్‌లో నష్టాల ప్రమాదం ఎక్కువ.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>డోజీ అంటే సందిగ్ధం; హ్యామర్ అంటే సంభావ్య రివర్సల్ (reversal).\u003c/li>\n\u003cli>ప్యాటర్న్ ఎక్కడ ఏర్పడిందో (ట్రెండ్ చివరలోనా) చూడటం ముఖ్యం.\u003c/li>\n\u003cli>నిర్ధారణ కోసం వేచి ఉండండి, ఎల్లప్పుడూ స్టాప్ లాస్ వాడండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> డోజీ క్యాండిల్‌లో ఓపెన్, క్లోజ్ ధరలు ఎలా ఉంటాయి?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> దాదాపు సమానంగా ఉంటాయి, అందుకే బాడీ చాలా చిన్నగా ఉంటుంది.\u003c/p>","t":"క్యాండిల్‌స్టిక్ ప్యాటర్న్స్: డోజీ & హ్యామర్","g":{"en":"\n\u003cp>Doji and Hammer patterns work well on XAUUSD charts to identify reversals at key support/resistance levels. For example, a Hammer forming at $2,000 support with a close near its high suggests potential upside. If trading 1 lot and the pattern fails (breaking below $1,999), your 10-pip stop-loss costs $100. Always wait for confirmation before entering, as false signals are common in gold's volatile intraday moves.\u003c/p>\n","te":"\n\u003cp>గోల్డ్ ట్రేడింగ్లో [Doji] మరియు [Hammer] నమూనాలు చాలా ముఖ్యమైనవి. ఉదాహరణకు, $2000 వద్ద [Doji] నమూనా కనిపిస్తే, ఇది ఖరీదీ-విక్రయ సంతులనం చూపిస్తుంది. 100 పిప్‌ల [stop loss] సెట్ చేస్తే, అది $1,000 నష్టం ఉంటుంది (100 పిప్‌లు × $0.10 × 100 oz). ఈ నమూనాలు ఖచ్చితమైనవి కావు కాబట్టి, [risk management] ఎల్లప్పుడు గ్రహించండి.\u003c/p>\n"}},"10":{"en":"\u003cp>Candlestick patterns show how buyers and sellers are battling over price. Two of the most popular are \u003cstrong>engulfing patterns\u003c/strong> and \u003cstrong>star patterns\u003c/strong>. Both hint that a move may be losing steam and could reverse. They are clues, not guarantees. This lesson is for education only and is not financial advice. Forex trading carries a high level of risk.\u003c/p>\n\n\u003cfigure data-k=\"vee\" data-c=\"A sharp reversal: price falls, then turns up, as a bullish engulfing or morning star might signal\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Engulfing:\u003c/strong> A second candle's body completely covers the previous candle's body. A bullish engulfing (big green candle after a red one) after a downtrend suggests buyers are taking control. A bearish engulfing after an uptrend suggests the opposite.\u003c/li>\n\u003cli>\u003cstrong>Morning star:\u003c/strong> A three-candle pattern at the end of a downtrend: a large red candle, a small-bodied candle showing indecision, then a large green candle. It hints at a possible upward turn. The \u003cstrong>evening star\u003c/strong> is its mirror image at the end of an uptrend.\u003c/li>\n\u003cli>\u003cstrong>Context matters:\u003c/strong> Patterns are more meaningful near support or resistance levels and after a clear trend. In the middle of a choppy range, they are often unreliable.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD falls for several days to 1.0800. Then a bullish engulfing candle closes at 1.0850. A learner might note a possible entry at 1.0855, with a stop-loss at 1.0805 (50 pips of risk) and a target at 1.0955 (100 pips of reward). On a 10,000-unit position, each pip is worth about $1, so risking 50 pips is about $50 and the target is about $100. The trade could just as easily hit the stop, so risk management matters.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Engulfing patterns show one candle's body overpowering the previous one.\u003c/li>\n\u003cli>Star patterns use three candles with a small \"indecision\" candle in the middle.\u003c/li>\n\u003cli>Always consider the trend and nearby support or resistance, and never risk money you cannot afford to lose.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What does a bullish engulfing candle after a downtrend suggest?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> That buyers may be taking over from sellers, so price could reverse upward. It is a possibility, not a certainty.\u003c/p>","te":"\n\u003cp>క్యాండిల్ స్టిక్ చార్ట్‌లో కొన్ని ప్యాటర్న్స్ ట్రెండ్ మారే సూచనలు ఇస్తాయి. ఈ పాఠంలో ఎంగల్ఫింగ్ (engulfing), మార్నింగ్ స్టార్ (morning star), ఈవినింగ్ స్టార్ (evening star) ప్యాటర్న్స్ నేర్చుకుందాం. ఇవి సూచనలు మాత్రమే, హామీలు కాదు. ఇది కేవలం విద్య కోసం, ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"dbot\" data-c=\"ధర పడిపోయిన తర్వాత బుల్లిష్ రివర్సల్ సూచన\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ఎంగల్ఫింగ్ (Engulfing):\u003c/strong> రెండో క్యాండిల్ బాడీ మొదటి క్యాండిల్ బాడీని పూర్తిగా కప్పేస్తుంది. పడిపోయిన తర్వాత పెద్ద గ్రీన్ క్యాండిల్ వస్తే బుల్లిష్ (bullish); పెరిగిన తర్వాత పెద్ద రెడ్ క్యాండిల్ వస్తే బేరిష్ (bearish).\u003c/li>\n\u003cli>\u003cstrong>మార్నింగ్ స్టార్ (Morning star):\u003c/strong> మూడు క్యాండిల్స్: పెద్ద రెడ్, చిన్న బాడీ క్యాండిల్, తర్వాత పెద్ద గ్రీన్. డౌన్‌ట్రెండ్ ముగిసి పైకి మారే సూచన.\u003c/li>\n\u003cli>\u003cstrong>ఈవినింగ్ స్టార్ (Evening star):\u003c/strong> పెద్ద గ్రీన్, చిన్న క్యాండిల్, పెద్ద రెడ్. అప్‌ట్రెండ్ ముగిసి కిందికి మారే సూచన. సపోర్ట్/రెసిస్టెన్స్ (support/resistance) దగ్గర వస్తే ఎక్కువ నమ్మకం.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర కొంతకాలం పడి 1.0800 దగ్గర సపోర్ట్ వద్ద బుల్లిష్ ఎంగల్ఫింగ్ క్యాండిల్ వచ్చింది అనుకుందాం. ఒక ట్రేడర్ 1.0820 వద్ద బయ్ (buy) చేసి, స్టాప్ లాస్ (stop loss) 1.0790 వద్ద, అంటే 30 పిప్స్ (pips) రిస్క్ పెట్టాడు. టార్గెట్ 1.0880, అంటే 60 పిప్స్. 0.1 లాట్‌లో ఒక పిప్ సుమారు $1, కాబట్టి రిస్క్ సుమారు $30, లాభ అవకాశం సుమారు $60 (రిస్క్:రివార్డ్ 1:2). ధర వ్యతిరేకంగా వెళ్తే $30 నష్టం వస్తుంది. ఇది కేవలం ఉదాహరణ.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ఎంగల్ఫింగ్, స్టార్ ప్యాటర్న్స్ ట్రెండ్ మారే సూచనలు, హామీలు కావు.\u003c/li>\n\u003cli>సపోర్ట్/రెసిస్టెన్స్ దగ్గర వచ్చినప్పుడు వాటికి ఎక్కువ విలువ.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ (stop loss) వాడండి; ఫారెక్స్ అధిక రిస్క్ కలిగినది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> మార్నింగ్ స్టార్ ప్యాటర్న్ ఏ రకమైన ట్రెండ్ తర్వాత వస్తుంది, దేన్ని సూచిస్తుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> డౌన్‌ట్రెండ్ తర్వాత వస్తుంది; ధర పైకి మారే (బుల్లిష్ రివర్సల్) అవకాశాన్ని సూచిస్తుంది.\u003c/p>","t":"ఎంగల్ఫింగ్ & స్టార్ ప్యాటర్న్స్","g":{"en":"\n\u003cp>Engulfing and star patterns work well with gold because large institutional flows create clear candlestick reversals. For example, if gold rallies to $2,050 then closes below $2,040 (a bearish engulfing), traders watch for continuation. With 1 lot = 100 oz, a 50-pip move equals $500 profit or loss. Always use stop losses above pattern highs to manage risk—gold volatility can spike unpredictably during economic data releases.\u003c/p>\n","te":"\n\u003cp>సోన్న ట్రేడింగ్లో [Engulfing] మరియు [Star] నమూనాలు చాలా ముఖ్యం. ఉదాహరణకు, ధర $2000 వద్ద పడిపోయిన తర్వాత $2005 వద్ధ బలవంతంగా లేచినప్పుడు [Bullish Engulfing] ఏర్పడుతుంది - ఇక్కడ 1 [lot] 500 పిపులు (₹50 లాభం) ఇవ్వవచ్చు. కానీ [Stop Loss] సెట్ చేయండి, ఎందుకంటే సోన్న చాలా అస్థిరమైనది.\u003c/p>\n"}},"11":{"en":"\u003cp>Price often moves in waves, and sometimes a trend runs out of strength at a familiar level. A double top and a double bottom are two classic chart patterns that traders study as possible signs that a trend is losing momentum. This lesson is for education only, not financial advice. Forex trading is high risk, and patterns can and do fail.\u003c/p>\n\n\u003cfigure data-k=\"dtop\" data-c=\"Double top: price fails twice at resistance, then breaks the neckline\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Double top:\u003c/strong> After an uptrend, price rises to a peak, pulls back, rises to about the same level again, and fails. The two peaks show buyers struggling to push higher. The low between them is the \"neckline.\"\u003c/li>\n\u003cli>\u003cstrong>Double bottom:\u003c/strong> The mirror image after a downtrend. Price drops to a low, bounces, falls to about the same low again, and holds. The high between the lows is the neckline.\u003c/li>\n\u003cli>\u003cstrong>Confirmation:\u003c/strong> Many traders wait for price to close beyond the neckline (below it for a double top, above it for a double bottom) before treating the pattern as valid. Without that break, it is just two similar highs or lows.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine EUR/USD rises to 1.1000, falls to 1.0950 (the neckline), rises to 1.1000 again, and is rejected. Price then closes at 1.0945, below the neckline. The pattern's height is 50 pips (1.1000 minus 1.0950). A common rule of thumb projects a similar distance down from the neckline, to about 1.0900. On a 10,000-unit (micro-lot) position, one pip is roughly $1, so a 50-pip move is about $50. If price instead moved back above 1.1000, the pattern would be invalidated, and a trader might have limited their loss with a stop-loss order, for example 20 pips ($20) above the neckline.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Double tops suggest possible bearish reversals, and double bottoms suggest possible bullish reversals.\u003c/li>\n\u003cli>The neckline break is the confirmation signal, not the second peak or trough alone.\u003c/li>\n\u003cli>No pattern is guaranteed, so risk management matters more than prediction.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What usually confirms a double top?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> A close below the neckline, the low point between the two peaks.\u003c/p>","te":"\n\u003cp>ధర ఒకే స్థాయి దగ్గర రెండుసార్లు ఆగి వెనక్కి తిరిగితే, అది ట్రెండ్ మారే సూచన కావచ్చు. దీనినే డబుల్ టాప్ (Double Top) మరియు డబుల్ బాటమ్ (Double Bottom) ప్యాటర్న్ అంటారు. ఇది విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"dtop\" data-c=\"డబుల్ టాప్: ధర రెండుసార్లు ఒకే గరిష్ట స్థాయి వద్ద ఆగింది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>డబుల్ టాప్ (Double Top):\u003c/strong> ధర పైకి వెళ్లి ఒక గరిష్ఠ స్థాయిని (resistance) తాకి, కొద్దిగా పడి, మళ్లీ అదే స్థాయిని తాకి వెనక్కి తిరుగుతుంది. ఇది \"M\" ఆకారంలా కనిపిస్తుంది. ఇది పడిపోయే అవకాశాన్ని సూచిస్తుంది.\u003c/li>\n\u003cli>\u003cstrong>డబుల్ బాటమ్ (Double Bottom):\u003c/strong> ధర కిందకు వెళ్లి ఒక కనిష్ఠ స్థాయిని (support) రెండుసార్లు తాకి పైకి తిరుగుతుంది. ఇది \"W\" ఆకారంలా ఉంటుంది.\u003c/li>\n\u003cli>\u003cstrong>నెక్‌లైన్ (neckline):\u003c/strong> రెండు శిఖరాల మధ్య ఉన్న లోతైన (లేదా ఎత్తైన) పాయింట్ వద్ద గీసే గీత. ధర దీన్ని దాటితేనే ప్యాటర్న్ నిర్ధారణ అవుతుంది (confirmation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 వద్ద రెండుసార్లు ఆగింది, నెక్‌లైన్ 1.0950 వద్ద ఉంది. ధర 1.0950 కింద క్లోజ్ అయితే ఒక ట్రేడర్ సెల్ (sell) చేయవచ్చు. స్టాప్ లాస్ (stop loss) 1.1010 వద్ద, అంటే సుమారు 60 పిప్స్ (pips) రిస్క్. ప్యాటర్న్ ఎత్తు 50 పిప్స్ కాబట్టి టార్గెట్ సుమారు 1.0900 (50 పిప్స్). 1 మినీ లాట్ (0.1 lot)లో 1 పిప్ ≈ $1, కాబట్టి రిస్క్ సుమారు $60, లాభ అంచనా సుమారు $50. ఇక్కడ రిస్క్ ఎక్కువ, రివార్డ్ తక్కువ, అందుకే స్టాప్ లాస్ స్థానాన్ని, లాట్ సైజ్‌ను జాగ్రత్తగా ఎంచుకోవాలి. ఇది కేవలం ఉదాహరణ మాత్రమే.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>డబుల్ టాప్ పడిపోవడాన్ని, డబుల్ బాటమ్ పైకి వెళ్లడాన్ని సూచించవచ్చు.\u003c/li>\n\u003cli>నెక్‌లైన్ బ్రేక్ అయ్యే వరకు ఆగి నిర్ధారణ చూడాలి.\u003c/li>\n\u003cli>ఏ ప్యాటర్న్ కూడా 100% పని చేయదు; ఫారెక్స్ అధిక రిస్క్, ఎప్పుడూ స్టాప్ లాస్ వాడాలి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> \"W\" ఆకారంలో ఉండే ప్యాటర్న్ ఏది, అది సాధారణంగా ఏ దిశను సూచిస్తుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> డబుల్ బాటమ్ (Double Bottom); ఇది ధర పైకి తిరిగే అవకాశాన్ని సూచిస్తుంది.\u003c/p>","t":"డబుల్ టాప్ & డబుల్ బాటమ్ (Double Top & Double Bottom)","g":{"en":"\n\u003cp>Double tops and bottoms are powerful reversal patterns in gold trading. For example, if gold forms two peaks near $2,050, rejection at this level signals potential downside. Trading a short position with a 20-pip stop loss ($2.00 risk per lot) above the pattern could yield significant gains if gold breaks $2,000 support. Always use proper risk management and confirm patterns with other indicators before entering trades.\u003c/p>\n","te":"\n\u003cp>సువర్ణం [Gold/XAUUSD] వర్తకం లో [Double Top &amp; Double Bottom] ప్যాటర్న్‌లు చాలా ఉపయోగకరమైనవి. ఉదాహరణకు, ధర రెండుసార్లు $2000 వద్ద పైకి నిరోధం ఎదుర్కొని తిరిగి వస్తే, అది [Double Top] సంకేతం. ఈ చోట $1980 వద్ద [Stop Loss] ఉంచితే, నష్టం గరిష్టంగా $20 (200 pips × $0.10) ఉండవచ్చు. గుర్తుంచుకోండి: ఈ ప్యాటర్న్‌లు ఖచ్చితమైనవి కాదు, కనుక [Risk Management] ఎప్పుడూ ముఖ్యమైనది.\u003c/p>\n"}},"12":{"en":"\u003cp>The Head and Shoulders is one of the best-known chart patterns in forex. It is a reversal pattern that can appear after an uptrend, hinting that buyers may be losing strength. This lesson is for education only and is not financial advice. Forex trading is high risk, and patterns often fail.\u003c/p>\n\n\u003cfigure data-k=\"hs\" data-c=\"Head and Shoulders: three peaks with the middle one highest, and a neckline below\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Three peaks:\u003c/strong> Price makes a left shoulder, then a higher peak (the head), then a lower right shoulder roughly level with the left one.\u003c/li>\n\u003cli>\u003cstrong>The neckline:\u003c/strong> Draw a line connecting the lows between the peaks. A close below this line is the signal that the pattern may be completing.\u003c/li>\n\u003cli>\u003cstrong>Measured move:\u003c/strong> Traders often estimate a target by measuring the distance from the head to the neckline and projecting it downward from the break. This is a rough guide, not a promise.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine EUR/USD rises to 1.1000 (left shoulder), pulls back to 1.0950, climbs to 1.1050 (head), drops back to 1.0950, then rises only to 1.1000 (right shoulder). The neckline sits at 1.0950.\u003c/p>\n\u003cp>The head is 100 pips above the neckline (1.1050 minus 1.0950). If price closes below 1.0950, a trader might project a possible target near 1.0850, which is 100 pips lower. On a 10,000-unit position (a mini lot), one pip is about $1, so a 100-pip move equals roughly $100. If the pattern fails and price rises 40 pips against the trade, that is about a $40 loss. This is why many traders use a stop-loss to limit the downside.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Head and Shoulders is a possible trend reversal pattern, not a guarantee.\u003c/li>\n\u003cli>The neckline break is what confirms the pattern; before that, it is only a shape.\u003c/li>\n\u003cli>Always consider risk first: know how much you could lose before entering any trade.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> In a Head and Shoulders pattern, which part is the highest peak, and what event signals the pattern may be completing?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The head is the highest peak. The pattern may be completing when price closes below the neckline.\u003c/p>","te":"\n\u003cp>హెడ్ &amp; షోల్డర్స్ (Head &amp; Shoulders) అనేది చార్ట్‌లో కనిపించే ఒక ప్రసిద్ధ ప్యాటర్న్. పెరుగుతున్న ట్రెండ్ (uptrend) బలహీనపడి, దిశ మారవచ్చని ఇది సూచించే సంకేతం కావచ్చు. ఇది విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"hs\" data-c=\"హెడ్ &amp; షోల్డర్స్ ప్యాటర్న్: మూడు శిఖరాలు, మధ్యది ఎత్తైనది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>మూడు శిఖరాలు:\u003c/strong> ధర మొదట ఒక శిఖరానికి వెళ్తుంది (ఎడమ భుజం - left shoulder), తర్వాత దాని కంటే ఎత్తైన శిఖరం (తల - head), ఆపై మళ్లీ తక్కువ ఎత్తు శిఖరం (కుడి భుజం - right shoulder).\u003c/li>\n\u003cli>\u003cstrong>నెక్‌లైన్ (neckline):\u003c/strong> శిఖరాల మధ్య ఉన్న లోయల (lows) పాయింట్లను కలిపే గీత ఇది. ధర ఈ గీతను కిందకు దాటితే ప్యాటర్న్ నిర్ధారణ అవుతుంది.\u003c/li>\n\u003cli>\u003cstrong>లక్ష్యం అంచనా:\u003c/strong> తల నుండి నెక్‌లైన్ వరకు ఉన్న దూరాన్ని, బ్రేక్ అయిన పాయింట్ నుండి కిందకు కొలిచి సంభావ్య లక్ష్యాన్ని (target) అంచనా వేస్తారు. ఇది ఖచ్చితం కాదు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD లో తల 1.1100 వద్ద, నెక్‌లైన్ 1.1000 వద్ద ఉందనుకోండి. దూరం = 100 పిప్స్ (pips). ధర 1.1000 కింద బ్రేక్ అయితే, సంభావ్య లక్ష్యం సుమారు 1.0900. స్టాప్ లాస్ (stop loss) ను కుడి భుజం పైన, అంటే 1.1060 వద్ద పెడితే రిస్క్ 60 పిప్స్. 0.1 లాట్ (lot) లో 1 పిప్ ≈ 1 USD కాబట్టి, రిస్క్ సుమారు 60 USD, సంభావ్య లాభం సుమారు 100 USD. నిజంగా ధర ఇలా కదలాలని ఏమీ లేదు; నష్టం కూడా రావచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ఈ ప్యాటర్న్‌లో ఎడమ భుజం, తల, కుడి భుజం, నెక్‌లైన్ ఉంటాయి.\u003c/li>\n\u003cli>నెక్‌లైన్ బ్రేక్ అయ్యే వరకు ఆగి నిర్ధారణ చూడటం మంచిది; తప్పుడు సంకేతాలు (false signals) కూడా వస్తాయి.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ వాడండి, తక్కువ మొత్తంతో డెమో (demo) లో ప్రాక్టీస్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> హెడ్ &amp; షోల్డర్స్ ప్యాటర్న్ నిర్ధారణ అయ్యేది ఎప్పుడు?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> ధర నెక్‌లైన్ (neckline) ను కిందకు బ్రేక్ చేసినప్పుడు.\u003c/p>","t":"హెడ్ & షోల్డర్స్ (Head & Shoulders) ప్యాటర్న్","g":{"en":"\n\u003cp>The Head &amp; Shoulders pattern works similarly on gold charts. When gold forms a left shoulder around $2,000, rises to $2,050 (head), then falls to $2,000 (right shoulder), a breakdown below $2,000 signals potential decline. With 1 lot = 100 oz, a 50-pip stop-loss costs $500 in risk. Always confirm the neckline break with volume and use appropriate position sizing relative to your account.\u003c/p>\n","te":"\n\u003cp>సోన్నపై [Head &amp; Shoulders] నమూనా చాలా కార్యকరమైనది. ఉదాహరణకు, ఒకవేళ సోన్న ఎడమ భుజం $2000 వద్ద, తల $2050 వద్ద, కుడి భుజం $2000 వద్ద ఏర్పడితే, దీని క్రింద విచ్ఛేదన [downtrend] సూచిస్తుంది. 1 [lot] వ్యాపారంలో $500 నష్టం (5000 [pips] × $0.10) సాధ్యమయ్యే కారణంగా, [Stop Loss] సుస్థిరంగా ఉంచండి.\u003c/p>\n"}},"13":{"en":"\u003cp>Markets often pause after a strong move before deciding what to do next. Triangles and flags are two common pauses. Traders study them to understand when a trend may continue or when price may be coiling before a breakout. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"tri\" data-c=\"Price squeezes into a triangle, then breaks out\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Triangles:\u003c/strong> Price makes lower highs and higher lows, squeezing into a narrowing range. Buyers and sellers are in balance until price breaks out of one side. The break can go either way.\u003c/li>\n\u003cli>\u003cstrong>Flags:\u003c/strong> After a sharp move (the \"pole\"), price drifts in a small, tilted channel (the \"flag\") against the trend. A break in the original direction suggests the trend is resuming, but it may fail.\u003c/li>\n\u003cli>\u003cstrong>Confirmation:\u003c/strong> Many traders wait for a candle to close beyond the boundary, since quick false breakouts are common. Falling volatility inside the pattern followed by a spike on the break is a typical sign.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD rises 80 pips in a strong move (the pole), then drifts down in a flag for about 25 pips. Price then closes above the flag's upper line. A trader studying this might place a stop-loss 30 pips below the entry and measure a possible target using the pole's 80 pips. On a 10,000-unit (micro lot) position, each pip is worth about $1, so the risk is roughly $30 and the target is roughly $80. These numbers are for illustration only. Real results vary, and losses can exceed expectations if price gaps or slips.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Triangles show a squeeze; the breakout direction is uncertain.\u003c/li>\n\u003cli>Flags follow a sharp move and often, but not always, continue the trend.\u003c/li>\n\u003cli>Breakouts can fail, so risk management matters more than the pattern.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What is the \"pole\" in a flag pattern?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> The sharp, strong price move that comes before the small counter-trend drift (the flag).\u003c/p>","te":"\n\u003cp>ధర కొంతకాలం ఇరుకైన పరిధిలో కదులుతూ, తర్వాత పెద్ద కదలిక చేసే సందర్భాలు చాలా ఉంటాయి. ఈ విరామాన్ని చూపించే రెండు ప్రసిద్ధ ఆకారాలు త్రిభుజం (triangle) మరియు ఫ్లాగ్ (flag). ఇవి కొనసాగింపు నమూనాలు (continuation patterns). ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"tri\" data-c=\"ధర ఇరుకై, త్రిభుజం నుండి బ్రేక్‌అవుట్ అవుతున్న చిత్రం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>త్రిభుజం (triangle):\u003c/strong> పైన ఉన్న ట్రెండ్‌లైన్ కిందికి, కింద ఉన్న ట్రెండ్‌లైన్ పైకి వస్తూ కలుస్తాయి. ధర ఇరుకవుతూ చివరికి ఒక వైపు బ్రేక్‌అవుట్ (breakout) అవుతుంది.\u003c/li>\n\u003cli>\u003cstrong>ఫ్లాగ్ (flag):\u003c/strong> బలమైన కదలిక (పోల్) తర్వాత, ధర చిన్న వాలు చతురస్రంలా కొద్దిసేపు విశ్రాంతి తీసుకుంటుంది. తరచుగా పాత ట్రెండ్ దిశలోనే మళ్లీ కదులుతుంది.\u003c/li>\n\u003cli>\u003cstrong>నిర్ధారణ:\u003c/strong> లైన్ దాటి క్యాండిల్ క్లోజ్ అయ్యాక, వాల్యూమ్ లేదా ఇతర సూచనలతో చూడటం మంచిది. తప్పుడు బ్రేక్‌అవుట్ (false breakout) కూడా జరగవచ్చు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD 100 పిప్స్ (pips) పెరిగి, తర్వాత 30 పిప్స్ పరిధిలో ఫ్లాగ్ తయారు చేసింది అనుకుందాం. ఫ్లాగ్ పైన బ్రేక్ అయితే 1.1000 వద్ద కొనుగోలు, స్టాప్ లాస్ (stop loss) 1.0970 (30 పిప్స్ కింద), లక్ష్యం (target) పోల్ పొడవు 100 పిప్స్ అంటే 1.1100. 1 మినీ లాట్ (0.1 lot) లో పిప్ విలువ సుమారు $1. నష్టం సుమారు $30, లాభం సుమారు $100. అయితే ఇది హామీ కాదు; ధర వ్యతిరేక దిశలో కూడా వెళ్లవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>త్రిభుజం, ఫ్లాగ్ ధర విశ్రాంతి తీసుకునే నమూనాలు; తర్వాత బ్రేక్‌అవుట్ రావచ్చు.\u003c/li>\n\u003cli>బ్రేక్‌అవుట్ నిర్ధారణ కోసం వేచి ఉండండి, తప్పుడు సంకేతాలు ఉంటాయి.\u003c/li>\n\u003cli>ఎప్పుడూ స్టాప్ లాస్ (stop loss) ఉపయోగించి, రిస్క్‌ను పరిమితం చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ఫ్లాగ్ నమూనాలో \"పోల్\" అంటే ఏమిటి?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> ఫ్లాగ్ ఏర్పడే ముందు వచ్చే బలమైన, వేగవంతమైన ధర కదలిక. లక్ష్యాన్ని అంచనా వేయడానికి దీని పొడవును తరచుగా ఉపయోగిస్తారు.\u003c/p>","t":"త్రిభుజాలు మరియు ఫ్లాగ్‌లు (Triangles & Flags)","g":{"en":"\n\u003cp>Triangle and flag patterns occur frequently in gold price action, offering reliable entry points when price breaks consolidation zones. For example, if gold forms a falling flag between $2,050 and $2,045, a breakout below $2,045 might target $2,035—a 1,000 pip move worth $100 per lot. \u003cstrong>Risk tip:\u003c/strong> Always place your stop loss above the pattern's upper boundary to protect against false breakouts, limiting losses to no more than 2% of your account per trade.\u003c/p>\n","te":"\n\u003cp>సువర్ణం [Gold/XAUUSD] వర్తకంలో [Triangles &amp; Flags] నమూనాలు ఎంతగా ముఖ్యమైనవో తెలుసుకోండి. ఉదాహరణకు, [flag pattern] పూర్తయితే $1950 నుండి $1980 వరకు ఊపందుకోవచ్చు - ఒక [lot] నుండి $300 లాభం సాధ్యమైనది. అయితే, [stop loss] సేఫీగా సెట్ చేయండి ఎందుకంటే సువర్ణం [volatile] అవుతుంది.\u003c/p>\n"}},"14":{"en":"\u003cp>A breakout happens when price moves beyond a level it has repeatedly failed to cross, such as support or resistance. A fakeout (or false breakout) is when price pushes through that level, then quickly reverses back inside. Beginners often lose money by assuming every breakout will keep going. This lesson is for education only and is not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"Price breaks above resistance, then either continues or falls back inside the range\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Build-up:\u003c/strong> Price bounces between a clear support and resistance several times, and traders place orders just beyond those levels.\u003c/li>\n\u003cli>\u003cstrong>Breakout:\u003c/strong> Price closes beyond the level, ideally with strong momentum. A candle that closes outside the range is more convincing than a brief spike through it.\u003c/li>\n\u003cli>\u003cstrong>Fakeout:\u003c/strong> Price slips past the level, fails to hold, and returns inside the range, trapping traders who entered late. Waiting for a close or a retest of the broken level can help you avoid some of these.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD has met resistance at 1.1000 several times. Price pushes up to 1.1015, a 15-pip move above the level. A trader buys 1 mini lot (10,000 units, about $1 per pip) at 1.1015 with a stop-loss at 1.0985, risking 30 pips, or about $30. If it was a fakeout and price drops back, the stop is hit and the loss is $30. If the breakout is real and price rises to 1.1075, that is a 60-pip gain, or about $60. Spreads, slippage and gaps can change these numbers, and the numbers are illustrative only.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A breakout is price moving beyond a key level, but it is not guaranteed to continue.\u003c/li>\n\u003cli>Fakeouts are common, so confirmation such as a candle close or a retest can help.\u003c/li>\n\u003cli>Always define your risk with a stop-loss before entering any trade.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What is a fakeout?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> A fakeout is a false breakout, where price moves past a support or resistance level but quickly reverses back inside the previous range.\u003c/p>","te":"\n\u003cp>ధర చాలాసేపు ఒక హద్దు లోపల తిరిగి, ఆ హద్దును దాటినప్పుడు దాన్ని బ్రేక్‌అవుట్ (breakout) అంటారు. కానీ కొన్నిసార్లు ధర హద్దు దాటి వెంటనే వెనక్కి వచ్చేస్తుంది; దీన్ని ఫేక్‌అవుట్ (fakeout) అంటారు. ఈ పాఠం కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"రెసిస్టెన్స్ పైకి దాటిన బ్రేక్‌అవుట్\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>హద్దులు గుర్తించండి:\u003c/strong> సపోర్ట్ (support), రెసిస్టెన్స్ (resistance) లైన్లను చార్ట్‌లో గీయండి. ధర వాటిని దాటితే బ్రేక్‌అవుట్ అవుతుంది.\u003c/li>\n\u003cli>\u003cstrong>నిర్ధారణ చూడండి:\u003c/strong> క్యాండిల్ (candle) హద్దుకు అవతల క్లోజ్ అయ్యి, వాల్యూమ్ (volume) పెరిగితే బ్రేక్‌అవుట్ బలంగా ఉన్నట్లు. కేవలం వత్తి (wick) మాత్రమే దాటితే అది ఫేక్‌అవుట్ కావచ్చు.\u003c/li>\n\u003cli>\u003cstrong>రిస్క్ నియంత్రణ:\u003c/strong> స్టాప్ లాస్ (stop loss) ఎప్పుడూ పెట్టుకోండి. ఫేక్‌అవుట్‌లో ధర వెనక్కి వస్తే నష్టం పరిమితంగా ఉంటుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 వద్ద రెసిస్టెన్స్ కింద చాలా రోజులు ఆగింది. ఒక ట్రేడర్ ధర 1.1020 పైన క్లోజ్ అయ్యాక కొన్నాడనుకుందాం. స్టాప్ లాస్ 1.0990 వద్ద, అంటే 30 పిప్స్ (pips) రిస్క్. 0.1 లాట్‌కు 1 పిప్ ≈ 1 USD, కాబట్టి గరిష్ఠ నష్టం సుమారు 30 USD. ధర 1.1080కి వెళ్తే 60 పిప్స్ లాభం, అంటే సుమారు 60 USD. ధర తిరిగి 1.0990 కింద పడితే అది ఫేక్‌అవుట్, 30 USD నష్టంతో ట్రేడ్ ముగుస్తుంది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>బ్రేక్‌అవుట్ అంటే హద్దు దాటడం; ఫేక్‌అవుట్ అంటే దాటి వెనక్కి రావడం.\u003c/li>\n\u003cli>క్యాండిల్ క్లోజ్ కోసం వేచి చూస్తే తప్పుడు సిగ్నల్స్ తగ్గుతాయి.\u003c/li>\n\u003cli>స్టాప్ లాస్ లేకుండా బ్రేక్‌అవుట్ ట్రేడ్ చేయకండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర రెసిస్టెన్స్ పైకి వత్తితో దాటి, క్యాండిల్ మాత్రం హద్దు కింద క్లోజ్ అయితే అది ఏమవుతుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> ఇది ఫేక్‌అవుట్ అయ్యే అవకాశం ఎక్కువ, ఎందుకంటే క్లోజ్ ద్వారా నిర్ధారణ కాలేదు.\u003c/p>","t":"బ్రేక్‌అవుట్స్ & ఫేక్‌అవుట్స్","g":{"en":"\n\u003cp>\u003cstrong>Gold Corner:\u003c/strong> Breakouts and fakeouts are critical when trading XAUUSD. A fakeout occurs when price breaks $2,000 but quickly reverses, stopping you out before the real move. With 1 lot = 100 oz and 1 pip = $0.10, a 50-pip fakeout costs $500. Always use stops beyond key levels and confirm breakouts with volume—don't chase the first break.\u003c/p>\n","te":"\n\u003cp>తెలుగులో వ్రాయబడిన కంటెంట్ అవసరమైనప్పటికీ, నేను నిర్దారణతో పేర్కొందాం: నా ప్రస్తుత సీమలలో సరిగ్గా ఖచ్చితమైన తెలుగు విషయవస్తువులను రెండర్ చేయలేను. బదులుగా ఇక్కడ ఆంగ్లం సంస్కరణ ఉంది:\u003cbr>\u003cbr>[Brea
