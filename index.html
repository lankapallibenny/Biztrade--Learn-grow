ష్టానికి [loss] స్టాప్ సెట్ చేస్తే, అది $500 నష్టం ($0.10 × 50 [pips] × 100 oz). ఎప్పుడూ మీ ఖాతా [account] పై 2% కంటే ఎక్కువ ఝుఁకి [risk] తీసుకోవద్దు.\u003c/p>\n"}},"30":{"en":"\u003cp>Most beginners lose money not because they lack strategy, but because emotions take over. Fear, greed, and impatience push traders to break their own rules. This lesson is educational only, not financial advice. Forex trading is high risk, and you can lose more than you expect.\u003c/p>\n\n\u003cfigure data-k=\"vee\" data-c=\"Panic selling into a sharp drop, then a fast reversal: emotional exits often happen at the worst moment\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Fear\u003c/strong> makes traders close winning trades too early or skip valid setups after a few losses.\u003c/li>\n\u003cli>\u003cstrong>Greed\u003c/strong> leads to oversized positions, moving stop-losses further away, or chasing price after a big move.\u003c/li>\n\u003cli>\u003cstrong>Revenge trading\u003c/strong> is trying to win back a loss immediately, usually with bigger risk and less thought.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Anna has a $2,000 demo account and a rule to risk 1% ($20) per trade. She buys EUR/USD with a 20-pip stop-loss, so each pip is worth $1. The trade hits her stop and she loses $20.\u003c/p>\n\u003cp>Frustrated, she doubles her size to $2 per pip and skips her stop-loss rules. Price falls 35 pips, and she loses $70 instead of a controlled $40 at her original rules. One emotional decision turned a small, planned loss into a much larger one. Had she stuck to her plan, her account would have stayed healthy.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Write a trading plan with entry, stop-loss, and risk size before you trade, then follow it.\u003c/li>\n\u003cli>Risk only a small, fixed percentage per trade so no single loss hurts your mindset.\u003c/li>\n\u003cli>Losses are normal. Take breaks after a losing streak and review your trades calmly.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> After a losing trade, you feel the urge to immediately open a bigger trade to recover the money. What is this called, and what should you do instead?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> It is revenge trading. Step away, stick to your planned risk size, and only take trades that meet your written rules.\u003c/p>","te":"\n\u003cp>ట్రేడింగ్‌లో విజయం కేవలం చార్టులు, స్ట్రాటజీల మీద కాదు, మన భావోద్వేగాల మీద కూడా ఆధారపడుతుంది. భయం (fear) మరియు అత్యాశ (greed) నిర్ణయాలను పాడుచేస్తాయి. ఈ పాఠంలో మనసును అదుపులో ఉంచుకునే సులభమైన మార్గాలు తెలుసుకుందాం. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"vee\" data-c=\"భయంతో ధర పడిపోయినప్పుడు తొందరగా అమ్మేయడం, తర్వాత ధర తిరిగి పైకి రావడం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>భయం (Fear):\u003c/strong> ఒక నష్టం తర్వాత తర్వాతి మంచి ట్రేడ్‌ను తీసుకోవడానికి భయపడతాం, లేదా లాభాన్ని చాలా తొందరగా మూసేస్తాం.\u003c/li>\n\u003cli>\u003cstrong>అత్యాశ (Greed):\u003c/strong> ఎక్కువ లాభం కోసం లాట్ సైజ్ పెంచడం, లేదా టార్గెట్ దాటినా ట్రేడ్‌లో ఉండిపోవడం.\u003c/li>\n\u003cli>\u003cstrong>రివెంజ్ ట్రేడింగ్ (Revenge trading):\u003c/strong> నష్టాన్ని వెంటనే తిరిగి సంపాదించాలని ప్లాన్ లేకుండా ట్రేడ్ చేయడం. ఇది చాలా ప్రమాదకరం.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>రవి ఖాతాలో $1,000 ఉంది. అతను 1% రిస్క్ అంటే $10 మాత్రమే పెట్టాలని ప్లాన్ చేశాడు, స్టాప్ లాస్ (stop loss) 20 పిప్స్ (pips). ట్రేడ్ నష్టంతో ముగిసి $10 పోయింది. కోపంతో అతను ప్లాన్ వదిలేసి రివెంజ్ ట్రేడ్ చేశాడు, రిస్క్‌ను $50కి పెంచాడు. మళ్లీ 20 పిప్స్ నష్టం వస్తే $50 పోతుంది, అంటే ఖాతాలో 5%. ప్లాన్ ప్రకారం ఉంటే నష్టం $10 దగ్గరే ఆగేది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ట్రేడ్ చేయక ముందే ట్రేడింగ్ ప్లాన్ (trading plan) రాసుకుని, దాన్ని పాటించండి.\u003c/li>\n\u003cli>ప్రతి ట్రేడ్‌కు రిస్క్‌ను చిన్నగా, స్థిరంగా ఉంచండి.\u003c/li>\n\u003cli>నష్టాలు ట్రేడింగ్‌లో సహజం. భావోద్వేగంగా ఉన్నప్పుడు విరామం తీసుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> నష్టం తర్వాత వెంటనే ఎక్కువ సైజ్‌తో ట్రేడ్ చేయడాన్ని ఏమంటారు, ఇది ఎందుకు ప్రమాదకరం?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> దీన్ని రివెంజ్ ట్రేడింగ్ (revenge trading) అంటారు. ప్లాన్ లేకుండా, భావోద్వేగంతో రిస్క్ పెంచడం వల్ల ఖాతాకు పెద్ద నష్టం కలిగే అవకాశం ఉంటుంది.\u003c/p>","t":"ట్రేడింగ్ సైకాలజీ (Trading Psychology)","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>Trading psychology is crucial in gold markets where emotional decisions amplify losses. For example, fear-driven panic selling after a $50 drop (500 pips) in a 1-lot position can lock in losses unnecessarily. \u003cstrong>Risk tip:\u003c/strong> Set stop-losses before entering trades and never adjust them based on emotions—predetermined rules protect your capital from psychological errors.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] వర్తకంలో మీ మనస్సు పరిస్థితి చాలా ముఖ్యమైనది. ఉదాహరణకు, ఒక [lot] (100 oz) సోనెలో [long position] తీసుకొని, ధర $10 తగ్గితే $100 నష్టం జరుగుతుంది - అప్పుడు భయం వలన తీసుకున్న తీర్పు వలన మరిన్ని చీకటి నష్టాలు జరుగుతాయి. ఎప్పుడూ [stop loss] నిర్ణయించుకోండి మరియు ఆవేగం కంటే [trading plan] ను అనుసరించండి.\u003c/p>\n"}},"31":{"en":"\u003cp>Trading is as much about managing your emotions as reading charts. Fear, greed, and revenge trading are three common emotional traps that cause beginners to break their own rules and lose money. This lesson is educational only, not financial advice. Forex trading is high risk, and you can lose more than you expect.\u003c/p>\n\n\u003cfigure data-k=\"vee\" data-c=\"Sharp drop and snap-back: emotions often peak at the extremes\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Fear:\u003c/strong> You close a good trade too early, or skip a valid setup after a few losses, because you dread being wrong again.\u003c/li>\n\u003cli>\u003cstrong>Greed:\u003c/strong> You oversize positions, move your take-profit further away, or hold a winner too long, hoping for more.\u003c/li>\n\u003cli>\u003cstrong>Revenge trading:\u003c/strong> After a loss, you jump straight into another trade, usually bigger, to \"win it back.\" There is no plan, only emotion.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>A trader with a $2,000 account risks 1% ($20) per trade. A 20-pip stop on a 0.1 lot position (about $1 per pip) loses $20. Annoyed, the trader instantly re-enters with a 0.5 lot position (about $5 per pip) and no clear setup. The price moves 20 pips against them again, and this time the loss is $100, or 5% of the account. One emotional decision multiplied the damage by five. Two more like it and the account is down more than 10%.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Write a trading plan with entry, stop-loss, target, and position size before you click anything.\u003c/li>\n\u003cli>Keep risk per trade small and fixed, and never increase size to recover losses.\u003c/li>\n\u003cli>After a loss or a string of losses, step away. Set a daily loss limit and stop when you reach it.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> You just took a loss and feel the urge to double your position size on the next trade to get your money back. What is this called, and what should you do instead?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> It is revenge trading. Instead, stick to your fixed risk per trade, take a break, and only enter again when a setup in your plan appears.\u003c/p>","te":"\n\u003cp>ట్రేడింగ్‌లో చార్టుల కంటే మన భావోద్వేగాలే ఎక్కువ నష్టం చేస్తాయి. భయం (fear), అత్యాశ (greed), నష్టాన్ని త్వరగా తిరిగి పొందాలనే కోపం (revenge trading) ఈ మూడూ బిగినర్స్ చేసే తప్పులకు ప్రధాన కారణాలు. ఈ పాఠం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ అధిక రిస్క్ ఉన్న మార్కెట్.\u003c/p>\n\n\u003cfigure data-k=\"vee\" data-c=\"భయంతో ధర వేగంగా పడి, మళ్లీ వేగంగా పైకి వచ్చే V ఆకారం: భయంతో అమ్మేసినవారు రికవరీని మిస్ అవుతారు\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>భయం (fear):\u003c/strong> ధర కొంచెం వ్యతిరేకంగా వెళ్ళగానే ట్రేడ్‌ను త్వరగా మూసేస్తాం, లేదా మంచి సెటప్ వచ్చినా ఎంటర్ అవ్వం.\u003c/li>\n\u003cli>\u003cstrong>అత్యాశ (greed):\u003c/strong> లాభం వస్తుంటే టేక్ ప్రాఫిట్ (take profit) దాటి ఉంచడం, లేదా లాట్ సైజ్ (lot size) పెంచడం వల్ల లాభాలు తిరిగి పోతాయి.\u003c/li>\n\u003cli>\u003cstrong>రివెంజ్ ట్రేడింగ్:\u003c/strong> నష్టం తర్వాత ప్లాన్ లేకుండా పెద్ద సైజ్‌తో వెంటనే మళ్లీ ట్రేడ్ చేయడం. ఇది నష్టాలను పెంచుతుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>రవి అకౌంట్‌లో $1,000 ఉంది. అతను 1% రిస్క్ ($10) తో 20 పిప్స్ (pips) స్టాప్ లాస్ (stop loss) పెట్టి ట్రేడ్ చేశాడు, అది హిట్ అయి $10 నష్టం వచ్చింది. కోపంతో వెంటనే లాట్ సైజ్ 5 రెట్లు పెంచాడు. ఇప్పుడు అదే 20 పిప్స్ నష్టం $50 అవుతుంది. మళ్లీ ఓడిపోతే మొత్తం నష్టం $60 అయి అకౌంట్‌లో 6% పోతుంది. ప్లాన్ ప్రకారం కొనసాగి ఉంటే నష్టం కేవలం $10 వద్దే ఆగేది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ట్రేడ్ ముందే ఎంట్రీ, స్టాప్ లాస్, టార్గెట్‌తో రాతపూర్వక ప్లాన్ రాసుకుని దానినే అనుసరించండి.\u003c/li>\n\u003cli>వరుసగా రెండు లేదా మూడు నష్టాలు వస్తే విరామం తీసుకోండి, నష్టాన్ని వెంటనే తిరిగి పొందాలని ప్రయత్నించకండి.\u003c/li>\n\u003cli>ప్రతి ట్రేడ్‌కు రిస్క్ చిన్నగా (ఉదా. 1%) ఉంచితే భావోద్వేగాలు తక్కువగా ఉంటాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> నష్టం తర్వాత లాట్ సైజ్ పెంచి వెంటనే మళ్లీ ట్రేడ్ చేయడాన్ని ఏమంటారు, అది ఎందుకు ప్రమాదకరం?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> దీనిని రివెంజ్ ట్రేడింగ్ (revenge trading) అంటారు. ఇది ప్లాన్ లేకుండా భావోద్వేగంతో చేసే పెద్ద రిస్క్ కాబట్టి నష్టాలు వేగంగా పెరుగుతాయి.\u003c/p>","t":"భయం, అత్యాశ & రివెంజ్ ట్రేడింగ్","g":{"en":"\n\u003cp>Fear, greed, and revenge can distort gold trading decisions. For example, after losing $50 on a 500-pip drop, revenge trading might tempt you to immediately open a 5-lot position to recover losses quickly—risking $250 more. \u003cstrong>Risk tip:\u003c/strong> Set predetermined stop-losses and position sizes before entering any trade; never adjust them based on emotions or recent losses.\u003c/p>\n","te":"\n\u003cp>సోने [gold/XAUUSD] వర్తకంలో [trading] భయం, దురాశ, ప్రతీకారం తప్పక నివారించాలి. ఉదాహరణకు, ఒక [lot] నష్టం వచ్చిన తర్వాత చిన్న [pip] లాభానికి సంతోషించకుండా ఎక్కువ [lots] తీసుకోవటం [revenge trading] పతనానికి దారితీస్తుంది. నెలకు ₹500 నష్టం [pip] నుండి ₹5000 నష్టం [pip] అవుతుంది. ఎప్పుడూ భావోద్వేగాన్ని [emotions] దూరంగా ఉంచి [plan] అనుసరించండి.\u003c/p>\n"}},"32":{"en":"\u003cp>A trading plan is a written set of rules that tells you what you will trade, when you will enter, when you will exit, and how much you will risk. Having it on paper before you trade helps you act on logic instead of emotion. This lesson is for education only and is not financial advice. Forex trading is high risk, and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"A breakout above resistance: a plan defines the entry, stop-loss and target before the trade\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Define your setup:\u003c/strong> Choose the pair, timeframe and the exact condition that triggers a trade, such as price closing above a resistance level.\u003c/li>\n\u003cli>\u003cstrong>Set your risk:\u003c/strong> Decide in advance how much of your account you will risk per trade (many learners practice with 1%) and place a stop-loss at a level that proves the idea wrong.\u003c/li>\n\u003cli>\u003cstrong>Plan the exit and review:\u003c/strong> Set a profit target, ideally larger than your risk, and record each trade in a journal so you can learn from the results.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine a practice account of $5,000 and a rule to risk 1%, which is $50. Price breaks above resistance on EUR/USD at 1.1000. Your plan puts the stop-loss at 1.0975, which is 25 pips away, and the target at 1.1050, which is 50 pips away. That gives a 1:2 risk-to-reward ratio.\u003c/p>\n\u003cp>With a pip worth about $2 per 0.2 mini lot, a 25-pip stop risks about $50. If the target is hit, the gain would be about $100. If the stop is hit, the loss is about $50. Real results vary, and losses are a normal part of trading.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A trading plan sets entry, stop-loss, target and position size before you trade.\u003c/li>\n\u003cli>Risking a small, fixed percentage per trade helps protect your account.\u003c/li>\n\u003cli>A journal turns each trade, win or lose, into a lesson.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why should you write your stop-loss and target before entering a trade?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> It lets you make decisions calmly and by rule, instead of reacting to fear or greed while the price is moving.\u003c/p>","te":"\n\u003cp>ట్రేడింగ్ ప్లాన్ (trading plan) అంటే ట్రేడ్ చేసే ముందే రాసుకునే నియమాల జాబితా. ఎప్పుడు ట్రేడ్ తీసుకోవాలి, ఎప్పుడు బయటకు రావాలి, ఎంత రిస్క్ చేయాలి అనేది ముందే నిర్ణయించుకుంటే భయం, అత్యాశ వల్ల తప్పులు తగ్గుతాయి. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో నష్టపోయే ప్రమాదం ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"రెసిస్టెన్స్ బ్రేక్ అయినప్పుడు ఎంట్రీ, కింద స్టాప్ లాస్\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ఎంట్రీ (entry) నియమం:\u003c/strong> ఏ సంకేతం కనిపిస్తే ట్రేడ్ తీసుకుంటారో ముందే రాయండి. ఉదాహరణకు, ధర రెసిస్టెన్స్ (resistance) పైన క్లోజ్ అయినప్పుడు.\u003c/li>\n\u003cli>\u003cstrong>ఎగ్జిట్ (exit) నియమం:\u003c/strong> స్టాప్ లాస్ (stop loss) మరియు టేక్ ప్రాఫిట్ (take profit) స్థాయిలను ట్రేడ్ మొదలుపెట్టే ముందే సెట్ చేయండి.\u003c/li>\n\u003cli>\u003cstrong>రిస్క్ (risk) నియమం:\u003c/strong> ప్రతి ట్రేడ్‌లో ఖాతాలో 1% కంటే ఎక్కువ కోల్పోకూడదని పరిమితి పెట్టుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>ఖాతా బ్యాలెన్స్ $1,000 అనుకుందాం. ప్రతి ట్రేడ్‌కు రిస్క్ 1% అంటే $10. EUR/USD లో స్టాప్ లాస్ 20 పిప్స్ (pips) దూరంలో పెడితే, ప్రతి పిప్‌కు విలువ $0.50 ఉండేలా ట్రేడ్ సైజ్ ఎంచుకోవాలి (20 × $0.50 = $10). టేక్ ప్రాఫిట్ 40 పిప్స్ వద్ద పెడితే, లాభం వస్తే 40 × $0.50 = $20. అంటే రిస్క్:రివార్డ్ (risk:reward) 1:2. స్టాప్ లాస్ తగిలితే నష్టం $10 మాత్రమే. ఇవి కేవలం ఉదాహరణ సంఖ్యలు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ప్లాన్‌ను ట్రేడ్ చేసే ముందే రాసుకోండి, ట్రేడ్ మధ్యలో మార్చకండి.\u003c/li>\n\u003cli>ఎంట్రీ, ఎగ్జిట్, రిస్క్ మూడూ ప్లాన్‌లో తప్పనిసరిగా ఉండాలి.\u003c/li>\n\u003cli>చిన్న రిస్క్ (1%) వల్ల వరుస నష్టాలు వచ్చినా ఖాతా బతికి ఉంటుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> $2,000 ఖాతాలో 1% రిస్క్ నియమం ప్రకారం ఒక ట్రేడ్‌లో గరిష్ట నష్టం ఎంత?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> $20 (2,000 లో 1%).\u003c/p>","t":"ట్రేడింగ్ ప్లాన్ తయారు చేయడం (Building a Trading Plan)","g":{"en":"\n\u003cp>A solid trading plan is essential for gold trading. For example, if you plan to buy 1 lot at $2,000 with a stop loss at $1,995 (50 pips = $500 risk), you define your maximum loss upfront. This disciplined approach prevents emotional decisions during volatile gold moves. \u003cstrong>Risk tip:\u003c/strong> Never risk more than 1-2% of your account per trade, ensuring you survive multiple losing streaks.\u003c/p>\n","te":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>గోల్డ్ ట్రేడింగ్‌లో [trading plan] చాలా ముఖ్యమైనది. ఉదాహరణకు, మీరు [XAUUSD] ను $2000 వద్ద కొని, $2050 వద్ద విక్రయించాలని ప్లాన్ చేస్తే, ఆ 50 పిప్‌ల లాభం 1 [lot]‌కు $500 (50 × $0.10 = $500). కానీ [stop loss]‌ ను ఎప్పుడూ సెట్ చేయండి—ఇది మీ నష్టాలను నియంత్రించడానికి [risk management]‌ కీలకం.\u003c/p>\n\u003c/div>\n"}},"33":{"en":"\u003cp>A trading journal is a written record of every trade you take, including why you took it and how it turned out. Beginners often rely on memory, which tends to forget mistakes and exaggerate wins. A journal turns your trading into data you can review and learn from. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"A ranging market: a journal helps you review whether your entries near support and resistance followed your plan\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Record before and after:\u003c/strong> Note the pair, date, direction, entry, stop-loss, target, position size, and your reason for the trade. After closing, add the exit price, result, and what you felt.\u003c/li>\n\u003cli>\u003cstrong>Add a screenshot:\u003c/strong> Save the chart at entry and at exit. Seeing the setup later helps you judge whether you followed your rules.\u003c/li>\n\u003cli>\u003cstrong>Review weekly:\u003c/strong> Look for patterns, such as which setups work, which times of day you trade badly, and when emotions broke your plan.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine a demo trade: you buy EUR/USD at 1.0850 with a stop-loss at 1.0820 (30 pips risk) and a target at 1.0910 (60 pips reward). With a 10,000-unit position, each pip is about $1, so you risk roughly $30 to make $60. The price hits 1.0835 and your stop closes the trade at a 15-pip loss, about -$15. Your journal entry notes: \"Entered early, before the candle closed. Broke my rule.\" After ten such entries, you notice most of your losses came from early entries. That is a fixable habit you would likely have missed without writing it down.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A journal replaces unreliable memory with real evidence.\u003c/li>\n\u003cli>Record your reasons and emotions, not just the numbers.\u003c/li>\n\u003cli>Review regularly, because the value comes from spotting patterns and adjusting your plan.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why should you record your reason for a trade and not just the profit or loss?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Because the reason lets you judge whether you followed your plan. A trade can win through poor decisions or lose despite good ones, and only the recorded reasoning shows which habits to keep or fix.\u003c/p>","te":"\n\u003cp>ప్రతి ట్రేడర్ తన ట్రేడ్‌లను రాసి పెట్టుకోవడం మంచి అలవాటు. దీన్నే ట్రేడింగ్ జర్నల్ (trading journal) అంటారు. ఇందులో మీరు ఎందుకు ట్రేడ్ తీసుకున్నారో, ఏం జరిగిందో రాస్తే, మీ తప్పులు, బలాలు స్పష్టంగా తెలుస్తాయి. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"బ్రేక్ అవుట్ ట్రేడ్‌ను జర్నల్‌లో నమోదు చేయడానికి ఉదాహరణ\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ఎంట్రీ వివరాలు:\u003c/strong> తేదీ, కరెన్సీ పెయిర్ (currency pair), ఎంట్రీ (entry), స్టాప్ లాస్ (stop loss), టార్గెట్ (target) రాయండి.\u003c/li>\n\u003cli>\u003cstrong>కారణం, భావోద్వేగం:\u003c/strong> ట్రేడ్ ఎందుకు తీసుకున్నారో, భయం లేదా అత్యాశ ఉందేమో రాయండి. చార్ట్ స్క్రీన్‌షాట్ కూడా జతచేయండి.\u003c/li>\n\u003cli>\u003cstrong>ఫలితం, సమీక్ష:\u003c/strong> లాభం లేదా నష్టం ఎంత, ప్లాన్ ప్రకారం చేశారా అని వారానికి ఒకసారి చూసుకోండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీరు EUR/USD లో బ్రేక్ అవుట్ (breakout) చూసి బయ్ (buy) చేశారని అనుకోండి. స్టాప్ లాస్ 20 పిప్స్ (pips), టార్గెట్ 40 పిప్స్. ఒక పిప్ విలువ సుమారు $1 (మినీ లాట్‌కు $1 అనుకుంటే). ట్రేడ్ టార్గెట్ తాకితే +40 పిప్స్ = +$40. జర్నల్‌లో \"ప్లాన్ ప్రకారం చేశాను, రిస్క్:రివార్డ్ 1:2\" అని రాశారు. 10 ట్రేడ్‌లలో 4 గెలిచి (+$160), 6 ఓడితే (−$120), నికరం +$40. మీ గెలుపు రేటు, సగటు లాభ నష్టాలు జర్నల్ ద్వారానే తెలుస్తాయి.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ప్రతి ట్రేడ్‌ను, గెలిచినా ఓడినా, నిజాయితీగా రాయండి.\u003c/li>\n\u003cli>కారణాలు, భావోద్వేగాలు రాస్తే మీ పునరావృత తప్పులు బయటపడతాయి.\u003c/li>\n\u003cli>క్రమం తప్పకుండా సమీక్షిస్తేనే జర్నల్ ఉపయోగపడుతుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ట్రేడింగ్ జర్నల్‌లో కేవలం లాభం, నష్టం సంఖ్యలే రాస్తే సరిపోతుందా?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> సరిపోదు. ట్రేడ్ తీసుకున్న కారణం, ఎంట్రీ, స్టాప్ లాస్, టార్గెట్, అప్పటి భావోద్వేగాలు కూడా రాయాలి. అప్పుడే మీ నిర్ణయాలను మెరుగుపరచుకోవచ్చు.\u003c/p>","t":"ట్రేడింగ్ జర్నల్ (Trading Journal)","g":{"en":"\n\u003cp>Maintaining a trading journal is crucial for gold (XAUUSD) traders. Document every trade's entry price, exit price, and reasoning to identify patterns. For example, if you entered at $2,050 and exited at $2,055 (50 pips = $5 profit on 1 lot), recording this helps you review whether your analysis was sound. \u003cstrong>Risk tip:\u003c/strong> Always log your stop-loss levels and actual losses to prevent repeating costly mistakes.\u003c/p>\n","te":"\n\u003cp>\n[Trading Journal] వాడితే [Gold/XAUUSD] వర్తిస్తుంది. ఉదాహరణకు, $2000 నుండి [entry] చేసి $2010 వరకు [profit] తీసుకున్నట్లు రాయండి - ఇది 100 [pips] × $0.10 = $1000 లాభం [1 lot] కోసం. ప్రతిరోజు [trades] రాయడం ద్వారా పాటర్న్లు అర్థం అవుతాయి. [Risk tip]: ఎప్పుడూ [stop loss] లేకుండా [trade] చేయవద్దు - ఆకస్మిక [price movements] నుండి రక్షణ ఉండటం ముఖ్యం.\n\u003c/p>\n"}},"34":{"en":"\u003cp>Scalping is a very short-term trading style. Scalpers open and close trades within seconds to minutes, aiming to collect small profits of a few pips many times a day. Because gains per trade are tiny, costs and discipline matter a great deal. This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money quickly.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price bouncing inside a tight range, a common scalping setting\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Tiny targets:\u003c/strong> A scalper may aim for 5 to 10 pips per trade, using one-minute or five-minute charts and exiting fast.\u003c/li>\n\u003cli>\u003cstrong>Costs matter:\u003c/strong> The spread (the gap between buy and sell prices) is paid on every trade. With many trades, spreads and commissions can erase profits.\u003c/li>\n\u003cli>\u003cstrong>Tight risk control:\u003c/strong> Stop-losses are small, such as 5 pips. Scalpers prefer liquid pairs like EUR/USD and busy sessions, when spreads are lower.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Imagine a scalper trades 1 mini lot (10,000 units) of EUR/USD, where 1 pip is worth about $1. She buys, targets 6 pips of profit, and sets a stop-loss 4 pips away. The spread costs 1 pip.\u003c/p>\n\u003cul>\n\u003cli>Winning trade: +6 pips minus 1 pip spread = +5 pips, about \u003cstrong>+$5\u003c/strong>.\u003c/li>\n\u003cli>Losing trade: -4 pips minus 1 pip spread = -5 pips, about \u003cstrong>-$5\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Notice the spread makes the real reward-to-risk ratio only 1:1, so she would need to win more than half her trades just to break even on results.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Scalping seeks many small gains over very short holding times.\u003c/li>\n\u003cli>Spreads and fees take a large share of profit, so costs can decide success.\u003c/li>\n\u003cli>It demands focus, speed, and strict risk control, and it is not risk-free.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why are trading costs especially important for scalpers?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Scalpers make many trades with small profit targets, so the spread and commissions paid on each trade take up a big portion of the gains and can turn a winning strategy into a losing one.\u003c/p>","te":"\n\u003cp>స్కాల్పింగ్ (scalping) అనేది చాలా తక్కువ సమయంలో, చిన్న లాభాల కోసం ఎక్కువ ట్రేడ్‌లు చేసే పద్ధతి. ట్రేడ్‌లు కొన్ని సెకన్ల నుండి కొన్ని నిమిషాల వరకు మాత్రమే ఉంటాయి. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex)లో ఎక్కువ రిస్క్ ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"రేంజ్‌లో ధర పైకి కిందకు కదులుతుంటే చిన్న కదలికలను స్కాల్పర్లు వాడుకుంటారు\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>ట్రేడర్ 1 నిమిషం లేదా 5 నిమిషాల చార్ట్ (chart) చూసి, 5 నుండి 10 పిప్స్ (pips) లాభం లక్ష్యంగా పెట్టుకుంటాడు.\u003c/li>\n\u003cli>స్ప్రెడ్ (spread) మరియు కమిషన్ (commission) ఖర్చులు ప్రతి ట్రేడ్‌కు వర్తిస్తాయి. ట్రేడ్‌లు ఎక్కువైతే ఈ ఖర్చులు లాభాన్ని తినేస్తాయి.\u003c/li>\n\u003cli>చిన్న స్టాప్ లాస్ (stop loss) తప్పనిసరి. నిరంతరం స్క్రీన్ చూడాలి, త్వరగా నిర్ణయాలు తీసుకోవాలి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD రేంజ్‌లో కదులుతోంది. ఒక ట్రేడర్ 1 మినీ లాట్ (mini lot, 10,000 యూనిట్లు) తో కొంటాడు; 1 పిప్ ≈ 1 USD. లక్ష్యం 6 పిప్స్ = 6 USD, స్టాప్ లాస్ 4 పిప్స్ = 4 USD. స్ప్రెడ్ 1 పిప్ (1 USD) అనుకుంటే, లాభం వస్తే నికరంగా సుమారు 5 USD; నష్టం వస్తే సుమారు 5 USD (4 + 1 స్ప్రెడ్). రోజుకు 20 ట్రేడ్‌లు చేస్తే స్ప్రెడ్ ఖర్చే 20 USD అవుతుంది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>స్కాల్పింగ్ అంటే తక్కువ సమయంలో చిన్న లాభాలు, ఎక్కువ ట్రేడ్‌లు.\u003c/li>\n\u003cli>స్ప్రెడ్ మరియు ఖర్చులు ఫలితాన్ని బాగా ప్రభావితం చేస్తాయి.\u003c/li>\n\u003cli>క్రమశిక్షణ, స్టాప్ లాస్ లేకుండా ఇది చాలా ప్రమాదకరం; ముందుగా డెమో (demo) ఖాతాలో ప్రాక్టీస్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> స్కాల్పింగ్‌లో ఎక్కువ ట్రేడ్‌లు చేస్తే ఏ ఖర్చు పెరుగుతుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> స్ప్రెడ్ (spread) మరియు కమిషన్ ఖర్చులు పెరుగుతాయి, ఎందుకంటే ప్రతి ట్రేడ్‌కు అవి చెల్లించాలి.\u003c/p>","t":"స్కాల్పింగ్ (Scalping) అంటే ఏమిటి?","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003ch3>Gold (XAUUSD) Corner\u003c/h3>\n  \u003cp>Scalping gold means capturing small price movements quickly. For example, if gold moves from $2,050 to $2,050.10 (1 pip = $0.10), you'd profit $10 per lot (100 oz). With leverage amplifying both gains and losses, always use stop-losses to protect against sudden reversals. Gold volatility during economic announcements can trigger rapid price swings that catch unprepared scalpers.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>సువర్ణం [Gold/XAUUSD] వర్తకంలో [Scalping] చిన్న ధర మార్పులను సద్దాపించుకోవడం సులభం. ఉదాహరణకు, ధర $2000 నుండి $2000.10 కు పెరిగితే, ఒక లాట్ [1 lot] కు $10 లాభం వస్తుంది. అయితే, [Stop loss] నిర్ణయం చాలా ముఖ్యం ఎందుకంటే చిన్న నష్టాలు త్వరగా పెద్దదవుతాయి [Scalping]లో.\u003c/p>\n"}},"35":{"en":"\u003cp>Day trading forex means opening and closing trades within the same day, so no position is held overnight. Traders aim to profit from small price moves, but this style is fast, demanding, and risky. This lesson is for education only and is not financial advice. Most beginners lose money, and you can lose more than you expect.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price moving sideways in a range, a common day trading setting\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cp>\u003cstrong>Short time frames:\u003c/strong> Day traders use 1-minute to 1-hour charts and look for quick moves, often in ranges or short breakouts.\u003c/p>\n\u003cp>\u003cstrong>Active sessions:\u003c/strong> Prices move most when markets are busy, such as the London and New York overlap. Quiet hours can mean small moves and wider relative costs.\u003c/p>\n\u003cp>\u003cstrong>Costs and risk limits:\u003c/strong> Every trade pays the spread, and frequent trading adds up. Traders set a stop-loss on every trade and risk only a small part of the account, often 1% or less.\u003c/p>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose you have a $2,000 account and risk 1%, which is $20. EUR/USD is ranging, and you buy at 1.0800 with a stop-loss at 1.0790, a 10-pip risk. At roughly $2 per pip (a 0.2 mini lot), a 10-pip loss costs $20.\u003c/p>\n\u003cp>You set a take-profit at 1.0820, a 20-pip target worth about $40, for a 2:1 reward-to-risk ratio. If the spread is 1 pip (about $2), your real profit would be about $38 and your real loss about $22. If price hits the stop, you lose roughly $22 and the trade is over. Without a stop, the loss could grow far larger.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Day trading closes all positions by day's end, but it is not safer for being short-term.\u003c/li>\n\u003cli>Spreads and frequent trades add costs that make profit harder.\u003c/li>\n\u003cli>Always define your stop-loss and risk per trade before entering, and practice on a demo account first.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> You risk 1% of a $2,000 account on a trade. What is the most you plan to lose, and why does the stop-loss matter?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> $20. The stop-loss automatically closes the trade at your chosen level, keeping the loss near that planned amount instead of letting it grow.\u003c/p>","te":"\u003cp>డే ట్రేడింగ్ (day trading) అంటే ఒకే రోజులో ట్రేడ్ తెరిచి, అదే రోజు ముగిసేలోపు మూసివేయడం. రాత్రంతా ట్రేడ్ ఉంచరు, కాబట్టి రాత్రి వచ్చే ధర మార్పుల రిస్క్ తగ్గుతుంది. కానీ ఫారెక్స్ (forex) అధిక రిస్క్ ఉన్న మార్కెట్; ఇది కేవలం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు.\u003c/p>\n\u003cfigure data-k=\"range\" data-c=\"రోజులో ధర సపోర్ట్ మరియు రెసిస్టెన్స్ మధ్య కదలడం\">\u003c/figure>\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>సమయం ఎంచుకోండి:\u003c/strong> లండన్ మరియు న్యూయార్క్ సెషన్లలో (sessions) కదలిక ఎక్కువ, స్ప్రెడ్ (spread) తక్కువ ఉంటుంది. ఇవి ట్రేడింగ్‌కు అనుకూలం.\u003c/li>\n\u003cli>\u003cstrong>స్థాయిలు గుర్తించండి:\u003c/strong> సపోర్ట్ (support), రెసిస్టెన్స్ (resistance) లెవెల్స్ చూసి, ఎంట్రీ (entry), స్టాప్ లాస్ (stop loss), టేక్ ప్రాఫిట్ (take profit) ముందే నిర్ణయించండి.\u003c/li>\n\u003cli>\u003cstrong>రిస్క్ నియంత్రణ:\u003c/strong> ఒక్క ట్రేడ్‌లో ఖాతాలో 1% కంటే ఎక్కువ రిస్క్ చేయవద్దు. రోజుకు ట్రేడ్‌ల సంఖ్యను పరిమితం చేయండి.\u003c/li>\n\u003c/ul>\n\u003ch3>Simple example\u003c/h3>\n\u003cp>ఖాతాలో $1,000 ఉందనుకోండి. EUR/USD 1.0800 వద్ద కొంటారు (buy). స్టాప్ లాస్ 1.0780 వద్ద (20 పిప్స్ / pips), టేక్ ప్రాఫిట్ 1.0840 వద్ద (40 పిప్స్). ఒక పిప్ విలువ $0.50 ఉండే చిన్న సైజ్‌లో, నష్టం 20 × $0.50 = $10 (ఖాతాలో 1%), లాభం 40 × $0.50 = $20. అంటే రిస్క్:రివార్డ్ (risk:reward) 1:2. ధర 1.0780 తాకితే $10 నష్టం, 1.0840 తాకితే $20 లాభం. ఇది ఉదాహరణ మాత్రమే, ఫలితానికి హామీ లేదు.\u003c/p>\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>డే ట్రేడింగ్‌లో ట్రేడ్‌లు అదే రోజు మూసివేస్తారు.\u003c/li>\n\u003cli>స్టాప్ లాస్ ఎల్లప్పుడూ వాడండి, ప్రతి ట్రేడ్‌కు ముందే ప్లాన్ చేసుకోండి.\u003c/li>\n\u003cli>ఎక్కువ ట్రేడ్‌లు చేయడం కంటే క్రమశిక్షణ ముఖ్యం; నష్టపోయే ప్రమాదం ఎక్కువ.\u003c/li>\n\u003c/ul>\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> $2,000 ఖాతాలో 1% రిస్క్ అంటే ఒక ట్రేడ్‌లో గరిష్ఠ నష్టం ఎంత?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> $20 (2,000 × 1%).\u003c/p>","t":"డే ట్రేడింగ్ ఫారెక్స్ (Day Trading Forex)","g":{"en":"\n\u003cp>Day trading gold follows the same principles as forex pairs. For example, if gold rises from $2,000 to $2,001 in a single session, that's a 100-pip move worth $1,000 on one lot. Quick intraday positions can capitalize on volatility, but always use stop-losses—a sudden $20 drop (200 pips) could wipe out significant capital if unprotected. Gold's liquidity during US and London sessions offers optimal day-trading opportunities.\u003c/p>\n","te":"\n\u003cp>సువర్ణం [Gold/XAUUSD] వర్తకరంలో రోజువారీ [day trading] ఆలోచనలు ఉపయోగకరమైనవి. ఉదాహరణకు, ఉదయం $2000 వద్ద చిన్న [position] తెరిస్తే, $2001 వరకు పెరిగినప్పుడు [profit] తీసుకోవచ్చు - అది ఒక [lot]కు $100 లాభం. కానీ [leverage] ఎక్కువ ఉపయోగించకండి; [stop loss] నిర్ణయించుకోండి.\u003c/p>\n"}},"36":{"en":"\u003cp>Swing trading is a style where you hold a forex position for several days to a few weeks, aiming to capture a single \"swing\" in price rather than every small move. It suits beginners who cannot watch charts all day. This lesson is for education only, not financial advice, and forex trading carries a high risk of loss.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"An uptrend with pullbacks: swing traders look to enter near the pullbacks\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Find the trend:\u003c/strong> Use the daily or 4-hour chart to spot whether price is making higher highs and higher lows (up) or lower highs and lower lows (down).\u003c/li>\n\u003cli>\u003cstrong>Wait for a pullback:\u003c/strong> Instead of chasing price, wait for a temporary move against the trend, often near support, resistance, or a moving average, then look for signs it is resuming.\u003c/li>\n\u003cli>\u003cstrong>Plan the exit first:\u003c/strong> Place a stop-loss beyond the recent swing point and set a profit target, ideally at least twice the distance of your risk.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD is trending up and pulls back to 1.0800. You buy at 1.0800 with a stop-loss at 1.0750 (50 pips risk) and a target at 1.0900 (100 pips reward). With a 10,000-unit position, each pip is about $1. Risking 50 pips means about $50 at risk for a potential $100 gain. If the stop is hit, you lose about $50; if the target is hit, you gain about $100. Holding overnight may also add or subtract small swap (rollover) fees.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Swing trading targets multi-day moves and needs less screen time than day trading.\u003c/li>\n\u003cli>Trade with the trend, enter on pullbacks, and always define your stop-loss before entering.\u003c/li>\n\u003cli>Risk only a small portion of your account per trade, and expect some losing trades.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> In the example above, what is the reward-to-risk ratio?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> 2:1, because the potential gain is 100 pips and the risk is 50 pips.\u003c/p>","te":"\n\u003cp>స్వింగ్ ట్రేడింగ్ (swing trading) అంటే ధర ఒక దిశలో కొన్ని రోజుల నుండి కొన్ని వారాల వరకు కదిలే \"స్వింగ్\" ను పట్టుకునే పద్ధతి. ఇందులో రోజంతా చార్ట్ చూడాల్సిన అవసరం లేదు. ఇది కేవలం విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో నష్టం వచ్చే ప్రమాదం ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"అప్‌ట్రెండ్‌లో చిన్న పుల్‌బ్యాక్ తర్వాత ధర మళ్ళీ పైకి వెళ్తుంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ట్రెండ్ గుర్తించండి:\u003c/strong> డైలీ లేదా 4 గంటల చార్ట్‌లో ట్రెండ్ (trend) ఏ దిశలో ఉందో చూడండి.\u003c/li>\n\u003cli>\u003cstrong>పుల్‌బ్యాక్ కోసం వేచి ఉండండి:\u003c/strong> ధర కొంచెం వెనక్కి వచ్చినప్పుడు, సపోర్ట్ (support) లేదా రెసిస్టెన్స్ (resistance) దగ్గర ఎంట్రీ (entry) ప్లాన్ చేయండి.\u003c/li>\n\u003cli>\u003cstrong>రిస్క్ నియంత్రణ:\u003c/strong> స్టాప్ లాస్ (stop loss) మరియు టార్గెట్ (take profit) ముందే నిర్ణయించండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD అప్‌ట్రెండ్‌లో ఉంది. ధర 1.0800 దగ్గర సపోర్ట్‌ను తాకి పైకి తిరిగింది. మీరు 1.0810 వద్ద కొనుగోలు (buy) చేశారని అనుకుందాం. స్టాప్ లాస్ 1.0760 వద్ద, అంటే 50 పిప్స్ (pips) రిస్క్. టార్గెట్ 1.0910 వద్ద, అంటే 100 పిప్స్. 0.1 లాట్ (lot) కు ఒక పిప్ సుమారు $1. కాబట్టి రిస్క్ సుమారు $50, సాధ్యమైన లాభం సుమారు $100. అంటే రిస్క్:రివార్డ్ (risk:reward) 1:2. ధర స్టాప్ లాస్ తాకితే $50 నష్టం వస్తుంది; లాభం ఎప్పుడూ హామీ కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>స్వింగ్ ట్రేడింగ్‌లో ట్రెండ్ దిశలో, తక్కువ ట్రేడ్‌లతో ఓపికగా ఉండాలి.\u003c/li>\n\u003cli>ప్రతి ట్రేడ్‌కు స్టాప్ లాస్ తప్పనిసరి; మీ ఖాతాలో కొద్ది శాతం మాత్రమే రిస్క్ చేయండి.\u003c/li>\n\u003cli>రాత్రిపూట ట్రేడ్ ఉంచితే స్వాప్ (swap) ఫీజు, గ్యాప్ (gap) ప్రమాదం ఉంటాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> పై ఉదాహరణలో స్టాప్ లాస్ 50 పిప్స్, టార్గెట్ 100 పిప్స్ అయితే రిస్క్:రివార్డ్ ఎంత?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> 1:2. అంటే ఒక భాగం రిస్క్ చేసి రెండు భాగాల లాభం ఆశిస్తున్నారు.\u003c/p>","t":"ఫారెక్స్ స్వింగ్ ట్రేడింగ్","g":{"en":"\n\u003cp>Swing trading gold (XAUUSD) involves holding positions over multiple days to capture larger price moves. For example, if gold swings from $2,000 to $2,050 per ounce, that's a 5,000 pip move equaling $500 profit per lot. \u003cstrong>Risk tip:\u003c/strong> Always use stop losses—a 100 pip stop means risking $10 per lot, so size positions accordingly to protect your account from unexpected overnight gaps.\u003c/p>\n","te":"\n\u003cp>Swing Trading [స్వింగ్ ట్రేడింగ్] Gold లో, మీరు రెండు నుండి పది రోజుల మధ్య [ట్రెండ్] మార్పులను పట్టుకోవచ్చు. ఉదాహరణకు, Gold $2000 నుండి $2050 వరకు ఎగసిన చోట, మీరు $2010 వద్ద [ఎంట్రీ] చేసి, $2040 వద్ద [టార్గెట్] సెట్ చేయవచ్చు - ఇది 300 [పిప్‌స్] లాభం, ఒక [లాట్] కోసం $3,000. ఎల్లప్పుడు [స్టాప్ లాస్] ఉపయోగించండి మరియు మీ [అకౌంట్] యొక్క 2-3% కంటే ఎక్కువ రిస్క్ చేయవద్దు.\u003c/p>\n"}},"37":{"en":"\u003cp>A trend following strategy aims to trade in the direction the market is already moving, rather than guessing where it will turn. The idea is simple: prices that have been rising often keep rising for a while, and prices that have been falling often keep falling. This lesson is for education only and is not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"An uptrend: higher highs and higher lows\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Identify the trend:\u003c/strong> In an uptrend, price makes higher highs and higher lows. In a downtrend, it makes lower highs and lower lows. Many traders also check whether price is above or below a moving average.\u003c/li>\n\u003cli>\u003cstrong>Enter on pullbacks:\u003c/strong> Rather than chasing a big move, some traders wait for a small dip against the trend and look for signs that the trend is resuming.\u003c/li>\n\u003cli>\u003cstrong>Plan the exit first:\u003c/strong> Place a stop-loss below the most recent low (in an uptrend) to limit the loss if the trend fails. Let winning trades run while the trend holds.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD has been making higher highs and higher lows. After a small pullback, a trader buys at 1.1000 with a stop-loss at 1.0950, risking 50 pips. The target is 1.1100, a 100-pip gain. With a 10,000-unit position (a 0.1 lot), each pip is worth about $1.\u003c/p>\n\u003cul>\n\u003cli>Risk: 50 pips = about $50\u003c/li>\n\u003cli>Potential reward: 100 pips = about $100\u003c/li>\n\u003cli>Reward-to-risk ratio: 2:1\u003c/li>\n\u003c/ul>\n\u003cp>If the trend fails, the loss is about $50. Even a 2:1 ratio does not guarantee profit, since many trades will lose.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Trend following trades with the market direction, not against it.\u003c/li>\n\u003cli>Trends can end suddenly, and sideways markets often cause false signals.\u003c/li>\n\u003cli>Always define your risk with a stop-loss before entering.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> In an uptrend, what pattern of highs and lows would you expect to see?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Higher highs and higher lows.\u003c/p>","te":"\n\u003cp>మార్కెట్ ఒక దిశలో కదులుతున్నప్పుడు, ఆ దిశతోనే వెళ్లడాన్ని ట్రెండ్ ఫాలోయింగ్ (trend following) అంటారు. \"ట్రెండ్ ఈజ్ యువర్ ఫ్రెండ్\" అనే మాట దీని ఆధారం. ఇది విద్య కోసం మాత్రమే; ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో ఎక్కువ రిస్క్ (risk) ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"పైకి వెళ్తున్న ట్రెండ్: ఎత్తైన హై, ఎత్తైన లో\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ట్రెండ్ గుర్తించడం:\u003c/strong> ధర ఎత్తైన హైలు (higher highs), ఎత్తైన లోలు (higher lows) చేస్తే అప్‌ట్రెండ్ (uptrend). తగ్గుతున్న హైలు, లోలు ఉంటే డౌన్‌ట్రెండ్ (downtrend).\u003c/li>\n\u003cli>\u003cstrong>పుల్‌బ్యాక్ కోసం వేచి ఉండటం:\u003c/strong> ధర కొంచెం వెనక్కి వచ్చినప్పుడు (pullback), ట్రెండ్ దిశలో ఎంట్రీ (entry) చూడటం. మూవింగ్ యావరేజ్ (moving average) ట్రెండ్ చూపడానికి సహాయపడుతుంది.\u003c/li>\n\u003cli>\u003cstrong>రిస్క్ నియంత్రణ:\u003c/strong> ప్రతి ట్రేడ్‌కు స్టాప్ లాస్ (stop loss) పెట్టాలి. ట్రెండ్ ముగిసే సంకేతం వచ్చే వరకు ట్రేడ్ కొనసాగించవచ్చు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD అప్‌ట్రెండ్‌లో ఉందని అనుకుందాం. ధర 1.1000 నుంచి 1.1100కి పెరిగి, తర్వాత 1.1060కి వెనక్కి వచ్చింది. మీరు 1.1060 వద్ద కొనుగోలు (buy) చేస్తారు. స్టాప్ లాస్ 1.1030 వద్ద, అంటే 30 పిప్స్ (pips) రిస్క్. లక్ష్యం (target) 1.1120, అంటే 60 పిప్స్. 0.1 లాట్ (lot)లో 1 పిప్ ≈ 1 USD అనుకుంటే, రిస్క్ సుమారు 30 USD, సంభావ్య లాభం సుమారు 60 USD. రిస్క్:రివార్డ్ 1:2. ధర స్టాప్ లాస్ తాకితే నష్టం వస్తుంది; ఇది కేవలం ఉదాహరణ.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ట్రెండ్ దిశలోనే ట్రేడ్ చేయడం ట్రెండ్ ఫాలోయింగ్.\u003c/li>\n\u003cli>పుల్‌బ్యాక్ వద్ద ఎంట్రీ, స్టాప్ లాస్ తప్పనిసరి.\u003c/li>\n\u003cli>రేంజ్ మార్కెట్‌లో (range) ఈ వ్యూహం తరచూ విఫలమవుతుంది; నష్టాలు కూడా వస్తాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> అప్‌ట్రెండ్‌లో ట్రెండ్ ఫాలోయింగ్ ట్రేడర్ సాధారణంగా ఏ దిశలో ట్రేడ్ చూస్తాడు?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> పైకి, అంటే కొనుగోలు (buy) దిశలో, ముఖ్యంగా పుల్‌బ్యాక్ తర్వాత.\u003c/p>","t":"ట్రెండ్ ఫాలోయింగ్ వ్యూహం (Trend Following Strategy)","g":{"en":"\n\u003cp>Trend following applies perfectly to gold trading. For example, if XAUUSD breaks above $2,050 resistance, you might enter long at $2,051 with a 50-pip stop loss ($5 risk per lot). Following the uptrend, you could trail your stop at $2,045, locking in $60 profit while staying in the trade. \u003cstrong>Risk tip:\u003c/strong> Always use stops to protect capital; gold can reverse sharply on economic data releases.\u003c/p>\n","te":"\n\u003cp>తెలుగులో: సోన్న [XAUUSD] కోసం [Trend Following] చాలా ఉపయోగకరమైనది. ఉదాహరణకు, ధర ఎగిరిపోతున్నప్పుడు [uptrend] లో కొనండి - అయితే చిన్న [lots] తో మొదలు పెట్టండి. చెరువు నుండి బయటపడటానికి [stop loss] నిర్ణయించుకోండి, ఎందుకంటే [volatility] కారణంగా ఆకస్మిక నష్టాలు సంభవించవచ్చు.\u003c/p>\n"}},"38":{"en":"\u003cp>A breakout happens when price moves beyond a level it has repeatedly failed to cross, such as support or resistance. Breakout traders believe that once price escapes a tight range, it often keeps moving in that direction. This lesson is for education only and is not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"Price breaks above resistance after consolidating in a range\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Find the range:\u003c/strong> Mark a clear support and resistance level where price has bounced at least two or three times.\u003c/li>\n\u003cli>\u003cstrong>Wait for a close:\u003c/strong> Many traders wait for a candle to close beyond the level, which helps avoid \"false breakouts\" where price quickly snaps back.\u003c/li>\n\u003cli>\u003cstrong>Plan the exit first:\u003c/strong> Place a stop-loss just inside the old range, and choose a target before entering.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD has hovered between 1.0800 and 1.0850 for several days. A candle closes at 1.0860, above resistance. A trader buys one mini lot (10,000 units, about $1 per pip) with a stop-loss at 1.0830, which is 30 pips of risk, or about $30. The target is 1.0920, which is 60 pips, or about $60 of potential profit. That gives a 2:1 reward-to-risk ratio. If price falls back to 1.0830, the trade loses about $30. Real results vary, and losses can exceed expectations when markets move fast.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>A breakout is price closing beyond established support or resistance.\u003c/li>\n\u003cli>False breakouts are common, so confirmation and a stop-loss matter.\u003c/li>\n\u003cli>Decide your risk and target before you enter, and never risk money you can't afford to lose.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why do some traders wait for a candle to close beyond the level before entering a breakout?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> To reduce the chance of a false breakout, where price briefly pokes past the level and then reverses back into the range.\u003c/p>","te":"\n\u003cp>ధర కొంతకాలం ఒక పరిధిలో తిరుగుతూ ఉంటుంది. ఆ పరిధి పైకి లేదా కిందికి దాటినప్పుడు దాన్ని బ్రేక్అవుట్ (breakout) అంటారు. ఈ పాఠం విద్య కోసం మాత్రమే, ఇది ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"ధర రెసిస్టెన్స్ స్థాయిని దాటి పైకి బ్రేక్అవుట్ అవుతున్న చిత్రం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>ముందుగా సపోర్ట్ (support), రెసిస్టెన్స్ (resistance) స్థాయిలను గుర్తించండి. ధర ఆ రెండింటి మధ్య కదులుతుంటే అది రేంజ్ (range).\u003c/li>\n\u003cli>ధర రెసిస్టెన్స్ పైన క్యాండిల్ క్లోజ్ అయితే పైకి బ్రేక్అవుట్. సపోర్ట్ కింద క్లోజ్ అయితే కిందికి బ్రేక్అవుట్. వాల్యూమ్ (volume) పెరిగితే బ్రేక్అవుట్ బలంగా ఉన్నట్లు.\u003c/li>\n\u003cli>కొన్ని బ్రేక్అవుట్లు తప్పుడువి (false breakout). ధర తిరిగి రేంజ్‌లోకి వచ్చేస్తుంది. అందుకే స్టాప్ లాస్ (stop loss) తప్పనిసరిగా వాడాలి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD రెసిస్టెన్స్ 1.1000 వద్ద ఉందనుకోండి. ధర 1.1010 పైన క్లోజ్ అయ్యింది. ఒక ట్రేడర్ 1.1010 వద్ద బై (buy) చేసి, స్టాప్ లాస్‌ను 1.0980 వద్ద పెట్టాడు. అంటే రిస్క్ 30 పిప్స్ (pips). టార్గెట్ 1.1070, అంటే లాభం 60 పిప్స్. 0.1 లాట్‌లో ఒక పిప్ విలువ సుమారు $1. కాబట్టి నష్టం గరిష్ఠంగా సుమారు $30, లాభం సుమారు $60. రిస్క్:రివార్డ్ (risk:reward) 1:2. ఇది కేవలం ఉదాహరణ, ఫలితం గ్యారంటీ కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>బ్రేక్అవుట్ అంటే ధర సపోర్ట్ లేదా రెసిస్టెన్స్‌ను దాటడం.\u003c/li>\n\u003cli>క్యాండిల్ క్లోజ్ అయ్యే వరకు ఆగి నిర్ధారణ చూడండి, తప్పుడు బ్రేక్అవుట్లతో జాగ్రత్త.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ పెట్టండి, తక్కువ మొత్తంతో రిస్క్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర రెసిస్టెన్స్ దాటి వెంటనే తిరిగి రేంజ్‌లోకి వస్తే దాన్ని ఏమంటారు?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> తప్పుడు బ్రేక్అవుట్ (false breakout).\u003c/p>","t":"బ్రేక్అవుట్ స్ట్రాటజీ (Breakout Strategy)","g":{"en":"\n\u003cp>In gold trading, breakout strategy applies when XAUUSD breaks key resistance or support levels. For example, if gold breaks above $2,050 resistance with volume confirmation, traders might enter long, targeting $2,070 (a 20-pip potential gain = $200 per lot). \u003cstrong>Risk tip:\u003c/strong> Always place stop-losses below the breakout level—if trading 1 lot and risking 10 pips, your maximum loss would be $100.\u003c/p>\n","te":"\n\u003cp>\n[Breakout Strategy] ఆలోచన [Gold/XAUUSD] వర్తకం లో ఎలా ఉపయోగపడుతుందో చూద్దాం. ఉదాహరణకు, [price] $2000 చుట్టూ బలమైన [resistance level] ఉంటే, [breakout] పై $2010 దాటితే [buy signal] వస్తుంది - 1 [lot] కోసం $100 లాభం. ఎప్పుడూ [stop loss] నిర్ణయించండి [false breakout] నుండి రక్షణ కోసం.\n\u003c/p>\n"}},"39":{"en":"\u003cp>Prices often reverse or pause at the same areas again and again. Traders mark these areas as \u003cstrong>supply zones\u003c/strong> (where selling pressure previously pushed price down) and \u003cstrong>demand zones\u003c/strong> (where buying pressure previously pushed price up). This lesson is for education only, not financial advice. Forex trading is high risk and you can lose money.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price bouncing between a demand zone (bottom) and a supply zone (top)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Find the zone:\u003c/strong> Look for a spot where price left quickly and strongly. The small area just before that sharp move is the zone. A sharp rise marks demand; a sharp drop marks supply.\u003c/li>\n\u003cli>\u003cstrong>Draw a band, not a line:\u003c/strong> Zones are areas, so draw a rectangle covering the small candles' highs and lows rather than one exact price.\u003c/li>\n\u003cli>\u003cstrong>Watch the return:\u003c/strong> When price comes back to a zone, it may bounce again. Each retest tends to weaken the zone, and a strong close through it suggests the zone has failed.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD rallies sharply from 1.0800, so you mark a demand zone at 1.0800-1.0815. Later price falls back to 1.0810. A learner practicing on a demo account might imagine buying there with a stop-loss below the zone at 1.0790 (20 pips of risk) and a target near the previous high at 1.0870 (60 pips of reward).\u003c/p>\n\u003cp>With a 10,000-unit position (a mini lot), each pip is worth about $1. Risk is roughly $20 and the potential reward roughly $60, a 1:3 ratio. If price instead closes below 1.0790, the trade loses about $20. Nothing is guaranteed, and many zones fail.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Demand zones are where buyers previously took control; supply zones are where sellers did.\u003c/li>\n\u003cli>Zones are areas, and they weaken each time price revisits them.\u003c/li>\n\u003cli>Always plan your risk first and practice on a demo account before using real money.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Price dropped sharply from a small area of candles. Is that area a supply zone or a demand zone?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> A supply zone, because sellers overwhelmed buyers there and pushed price down.\u003c/p>","te":"\n\u003cp>మార్కెట్‌లో ధర ఒకే చోట పదే పదే ఆగి, తిరిగి వెళ్లే ప్రాంతాలు ఉంటాయి. వీటినే సప్లై &amp; డిమాండ్ జోన్లు (Supply &amp; Demand Zones) అంటారు. ఇవి ఒక్క గీత కాదు, ఒక చిన్న ప్రాంతం (zone). ఈ పాఠం కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"ధర డిమాండ్ జోన్ నుంచి పైకి, సప్లై జోన్ నుంచి కిందికి తిరుగుతోంది\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>డిమాండ్ జోన్ (Demand Zone):\u003c/strong> కొనేవాళ్లు ఎక్కువగా ఉన్న ప్రాంతం. ధర ఇక్కడినుంచి బలంగా పైకి వెళ్లి ఉంటుంది.\u003c/li>\n\u003cli>\u003cstrong>సప్లై జోన్ (Supply Zone):\u003c/strong> అమ్మేవాళ్లు ఎక్కువగా ఉన్న ప్రాంతం. ధర ఇక్కడినుంచి బలంగా కిందికి వచ్చి ఉంటుంది.\u003c/li>\n\u003cli>\u003cstrong>గుర్తించడం:\u003c/strong> పెద్ద కదలిక మొదలైన చోట ఉన్న చిన్న కన్సాలిడేషన్ (consolidation) ప్రాంతాన్ని గుర్తించండి. ధర మళ్లీ ఆ జోన్‌కు తిరిగి వచ్చినప్పుడు ప్రతిస్పందన చూడండి. ఎక్కువసార్లు తాకిన జోన్లు బలహీనపడతాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.0800 దగ్గర ఆగి, తర్వాత 100 పిప్స్ (pips) పైకి వెళ్లిందనుకోండి. 1.0800–1.0810 ఒక డిమాండ్ జోన్. ధర మళ్లీ 1.0805కు వచ్చినప్పుడు ఒక ట్రేడర్ కొనుగోలు పరిశీలిస్తాడు. స్టాప్ లాస్ (stop loss) జోన్ కింద 1.0790 వద్ద, అంటే 15 పిప్స్ రిస్క్. టార్గెట్ 1.0850, అంటే 45 పిప్స్. 0.1 లాట్‌కు పిప్ విలువ సుమారు $1 కాబట్టి, రిస్క్ సుమారు $15, సంభావ్య లాభం సుమారు $45. ఇది కేవలం ఉదాహరణ; ధర జోన్‌ను ఛేదించి నష్టం కూడా రావచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>జోన్ అంటే ఒక గీత కాదు, ఒక ప్రాంతం.\u003c/li>\n\u003cli>డిమాండ్ జోన్ దగ్గర కొనుగోలుదారులు, సప్లై జోన్ దగ్గర అమ్మకందారులు బలంగా ఉంటారు.\u003c/li>\n\u003cli>ఎప్పుడూ స్టాప్ లాస్ (stop loss) వాడండి; ఏ జోన్ కూడా గ్యారంటీ కాదు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ధర బలంగా కిందికి వచ్చిన ప్రాంతాన్ని ఏమంటారు?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> సప్లై జోన్ (Supply Zone), ఎందుకంటే అక్కడ అమ్మకందారులు ఎక్కువగా ఉన్నారు.\u003c/p>","t":"సప్లై & డిమాండ్ జోన్లు (Supply & Demand Zones)","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>Supply and demand zones are critical for gold trading. When XAUUSD forms a demand zone around $2,030, traders often see strong bounces. For example, if price pulls back to $2,030 and rebounds 50 pips higher, that's a $500 move per lot. Always use stop losses below demand zones—if gold breaks below $2,020, your position could gap through your level, risking $1,000+ per lot unexpectedly.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>సరఫరా &amp; డిమాండ్ జోన్‌లు [Supply &amp; Demand Zones] బంగారం వర్తకంలో చాలా ముఖ్యమైనవి. ఉదాహరణకు, బంగారం $2000 వద్ద [resistance] గా నిలిచినప్పుడు, అది [supply zone]. ఇక్కడ ధర తిరిగివస్తుంది. ఒకవేళ ధర $2000 నుండి $1990 కు పడితే, 100 [pips] ని损్కటం అవుతుంది ($1000 నష్టం). ఈ జోన్‌ల నుండి దూరంగా [stop loss] పెట్టండి.\u003c/p>\n"}},"40":{"en":"\u003cp>Interest rates are one of the biggest drivers of currency values. Central banks, such as the U.S. Federal Reserve or the European Central Bank, set the rate at which money is borrowed in their economy. Traders watch these decisions closely because even small shifts in expectations can move a currency. This lesson is for education only, not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"A currency may trend higher when markets expect rising interest rates\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Higher rates can attract capital.\u003c/strong> Investors often seek better returns, so demand for that currency may rise and its value may strengthen.\u003c/li>\n\u003cli>\u003cstrong>Expectations matter most.\u003c/strong> Markets price in what they think a central bank will do. A surprise versus the forecast often moves price more than the decision itself.\u003c/li>\n\u003cli>\u003cstrong>Tone counts.\u003c/strong> Statements and press conferences are called \"hawkish\" (leaning toward higher rates) or \"dovish\" (leaning toward lower rates). Traders read these for clues.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose the market expects the Fed to hold rates, but it unexpectedly raises them. EUR/USD falls from 1.1000 to 1.0950, a drop of 50 pips. A trader holding 1 standard lot (100,000 units) would see about $10 per pip, so a 50-pip move equals roughly $500 in profit or loss, depending on the position direction. Prices can also reverse quickly, so such moves carry real risk.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Central bank rate decisions and expectations are major forex drivers.\u003c/li>\n\u003cli>Surprises versus market forecasts often cause the biggest moves.\u003c/li>\n\u003cli>Hawkish and dovish language hints at future policy direction.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> If a central bank raises rates exactly as the market expected, why might the currency barely move?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Because the expected decision was already priced in. Price usually reacts to surprises, not to outcomes everyone anticipated.\u003c/p>","te":"\n\u003cp>ప్రతి దేశానికి ఒక సెంట్రల్ బ్యాంక్ (central bank) ఉంటుంది, ఉదాహరణకు అమెరికాలో ఫెడ్ (Fed), భారత్‌లో RBI. అవి నిర్ణయించే వడ్డీ రేటు (interest rate) ఆ దేశ కరెన్సీ విలువపై పెద్ద ప్రభావం చూపుతుంది. ఈ పాఠం కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"వడ్డీ రేట్లు పెరిగినప్పుడు కరెన్సీ పైకి వెళ్ళే ధోరణి (uptrend)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>వడ్డీ రేటు పెరిగితే (rate hike), ఆ దేశంలో డబ్బు దాచుకుంటే ఎక్కువ లాభం వస్తుంది. అందువల్ల పెట్టుబడిదారులు ఆ కరెన్సీని కొంటారు, దాని విలువ తరచూ పెరుగుతుంది.\u003c/li>\n\u003cli>వడ్డీ రేటు తగ్గితే (rate cut), ఆకర్షణ తగ్గి కరెన్సీ బలహీనపడవచ్చు.\u003c/li>\n\u003cli>మార్కెట్ ముందుగానే అంచనా వేస్తుంది. అందుకే అసలు ప్రకటన కంటే అంచనాలతో ఎంత తేడా వచ్చింది (expectation vs. result) అనేది ముఖ్యం. ప్రకటన సమయంలో ధరలు వేగంగా కదులుతాయి (volatility).\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>EUR/USD ధర 1.1000 వద్ద ఉందని అనుకోండి. ఫెడ్ ఊహించిన దానికంటే ఎక్కువగా వడ్డీ రేటు పెంచిందనుకుందాం. డాలర్ బలపడి ధర 1.0950కి పడిపోయింది. అంటే 50 పిప్స్ (pips) కదలిక. 1 స్టాండర్డ్ లాట్ (standard lot)లో ఒక పిప్ విలువ సుమారు 10 USD, కాబట్టి 50 పిప్స్ = సుమారు 500 USD. ఇది కేవలం ఉదాహరణ మాత్రమే. నిజంగా ధరలు ఊహించినట్లు కదలకపోవచ్చు, నష్టాలు కూడా రావచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>అధిక వడ్డీ రేటు సాధారణంగా కరెన్సీకి మద్దతు ఇస్తుంది, తక్కువ రేటు బలహీనపరుస్తుంది.\u003c/li>\n\u003cli>మార్కెట్ అంచనాలతో పోలిస్తే వచ్చిన ఫలితమే ధరను ఎక్కువగా కదిలిస్తుంది.\u003c/li>\n\u003cli>సెంట్రల్ బ్యాంక్ ప్రకటనల సమయంలో రిస్క్ ఎక్కువ, కాబట్టి స్టాప్ లాస్ (stop loss) వాడటం ముఖ్యం.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ఒక సెంట్రల్ బ్యాంక్ ఊహించిన దానికంటే ఎక్కువగా వడ్డీ రేటు పెంచితే, ఆ దేశ కరెన్సీ సాధారణంగా ఎలా స్పందిస్తుంది?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> సాధారణంగా ఆ కరెన్సీ బలపడుతుంది, ఎందుకంటే పెట్టుబడిదారులకు ఎక్కువ రాబడి కనిపిస్తుంది. అయితే ఇది ఎల్లప్పుడూ జరగదు.\u003c/p>","t":"ప్రాథమిక విశ్లేషణ: వడ్డీ రేట్లు మరియు సెంట్రల్ బ్యాంకులు","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>Interest rates heavily influence gold prices inversely—when central banks raise rates, gold typically falls as USD strengthens, and vice versa. For example, if the Fed signals rate hikes, XAUUSD might drop 50 pips ($500 loss on 1 lot). Always use stop-losses before major central bank announcements, as volatile rate expectations can create sudden 100+ pip swings, risking significant capital quickly.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>సరళ సంక్షిప్తంగా, సెంట్రల్ బ్యాంక్ [interest rate] నిర్ణయాలు [gold] ధరలను ప్రభావితం చేస్తాయి. ఉదాహరణకు, [Federal Reserve] రేట్‌ను పెంచితే, డాలర్ బలపడి [XAUUSD] పడిపోయేది - ఒక [lot] (100 oz)లో 50 [pips] ($500) నష్టం సాధ్యమయ్యేది. ఎప్పుడూ [central bank] ఉచ్చారణల ముందు [position size] తగ్గించండి - [volatility] ఎక్కువగా ఉండిపోతుంది.\u003c/p>\n"}},"41":{"en":"\u003cp>Some of the biggest moves in forex happen within minutes of a scheduled news release. Three reports matter most: NFP (US Non-Farm Payrolls, a monthly jobs report), CPI (Consumer Price Index, a measure of inflation), and FOMC (the US Federal Reserve's interest rate decision). This lesson is for education only, not financial advice. Forex trading is high risk, and news events raise that risk.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"Price consolidates before news, then breaks out sharply on the release\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Surprise drives price.\u003c/strong> Markets react to the gap between the actual number and the forecast, not the number alone. A stronger-than-expected US report often lifts the USD, and a weaker one often pushes it down.\u003c/li>\n\u003cli>\u003cstrong>Volatility and spreads jump.\u003c/strong> Prices can spike in both directions within seconds, spreads can widen, and stop-losses may fill at worse prices (slippage).\u003c/li>\n\u003cli>\u003cstrong>Check the economic calendar.\u003c/strong> Release times are published in advance. Many beginners choose to stay out of the market until the first wild moves settle.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose EUR/USD trades at 1.0800 before an NFP release. The report beats forecasts, and price falls 40 pips to 1.0760 in two minutes. It then bounces 25 pips to 1.0785.\u003c/p>\n\u003cp>On a 1 standard lot (100,000 units), each pip is worth about $10. The 40-pip drop is roughly $400 against a buyer, or in favor of a seller. A trader with a 15-pip stop ($150 risk) could be filled 10 pips further away because of slippage, making the loss about 25 pips, or $250. This is why news trading can be costly for beginners.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>NFP, CPI, and FOMC are scheduled events that often cause sharp, fast moves.\u003c/li>\n\u003cli>Results versus forecasts matter more than the raw figures.\u003c/li>\n\u003cli>Slippage and wide spreads can make losses larger than planned, so size positions carefully or stay out.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why can a stop-loss lose more than planned during a news release?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Prices move so fast and liquidity thins so much that orders may fill at worse prices than requested. This is called slippage.\u003c/p>","te":"\n\u003cp>ఫారెక్స్ మార్కెట్‌లో కొన్ని ముఖ్యమైన ఆర్థిక వార్తలు వచ్చినప్పుడు ధరలు చాలా వేగంగా కదులుతాయి. అమెరికా ఉద్యోగ గణాంకాలు NFP, ద్రవ్యోల్బణ గణాంకాలు CPI, వడ్డీ రేట్ల నిర్ణయం FOMC వీటిలో ముఖ్యమైనవి. ఈ పాఠం విద్య కోసం మాత్రమే, ఇది ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"వార్త తర్వాత ధర రేంజ్ నుంచి బయటకు దూకడం (breakout)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>NFP:\u003c/strong> ప్రతి నెల మొదటి శుక్రవారం వచ్చే అమెరికా ఉద్యోగాల సంఖ్య (Non-Farm Payrolls). అంచనా కంటే ఎక్కువ వస్తే USD సాధారణంగా బలపడుతుంది.\u003c/li>\n\u003cli>\u003cstrong>CPI:\u003c/strong> వస్తువుల ధరల పెరుగుదల (inflation). ఎక్కువ ద్రవ్యోల్బణం ఉంటే వడ్డీ రేట్లు పెరగవచ్చని మార్కెట్ భావిస్తుంది.\u003c/li>\n\u003cli>\u003cstrong>FOMC:\u003c/strong> అమెరికా సెంట్రల్ బ్యాంక్ (Fed) వడ్డీ రేటు (interest rate) నిర్ణయం. ప్రకటన సమయంలో స్ప్రెడ్ (spread) పెరిగి, స్లిప్పేజ్ (slippage) జరగవచ్చు.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>NFP రాకముందు EUR/USD 1.0800 వద్ద రేంజ్‌లో ఉంది. అంచనా కంటే మంచి డేటా రావడంతో ధర 60 పిప్స్ (pips) పడి 1.0740 అయింది. ఒక మినీ లాట్ (0.1 lot)లో ఒక పిప్ విలువ సుమారు $1, కాబట్టి 60 పిప్స్ అంటే సుమారు $60 కదలిక. అదే కదలిక వ్యతిరేక దిశలో వెళ్తే, స్టాప్ లాస్ (stop loss) లేని ట్రేడర్‌కు $60 నష్టం, స్లిప్పేజ్ వల్ల ఇంకా ఎక్కువ కూడా కావచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>వార్తల సమయంలో అస్థిరత (volatility) చాలా పెరుగుతుంది, రిస్క్ కూడా పెరుగుతుంది.\u003c/li>\n\u003cli>ఎకనామిక్ క్యాలెండర్ (economic calendar) చూసి వార్తల సమయాన్ని ముందే తెలుసుకోండి.\u003c/li>\n\u003cli>చిన్న లాట్ సైజ్, స్టాప్ లాస్ వాడండి, లేదా వార్తల సమయంలో ట్రేడ్ చేయకుండా ఉండటం కూడా ఒక నిర్ణయమే.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> FOMC ప్రకటన సమయంలో ట్రేడర్లు ఏ ప్రమాదం గురించి జాగ్రత్తగా ఉండాలి?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> ధరలు అకస్మాత్తుగా వేగంగా కదలడం, స్ప్రెడ్ పెరగడం, స్లిప్పేజ్ జరగడం. అందుకే చిన్న పొజిషన్ సైజ్, స్టాప్ లాస్ ముఖ్యం.\u003c/p>","t":"న్యూస్ ట్రేడింగ్: NFP, CPI & FOMC","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Major economic data like NFP, CPI, and FOMC decisions drive gold volatility significantly. For example, a stronger-than-expected NFP report might push gold down 50 pips ($500 loss on 1 lot). \u003cstrong>Risk tip:\u003c/strong> Use tight stop-losses during these releases—consider placing orders 30-40 pips away to avoid whipsaws from initial volatility spikes.\u003c/p>\n","te":"\n\u003cp>గోల్డ్ ట్రేడింగ్లో [NFP], [CPI] మరియు [FOMC] ఈవెంట్‌లు చాలా ముఖ్యమైనవి. అమెరికా జాబ్ డేటా విడుదలైనప్పుడు, గోల్డ్ ధర వేగంగా కదులుతుంది. ఉదాహరణకు, [NFP] ఆశించిన సంఖ్య కంటే చాలా తక్కువ వచ్చినప్పుడు, గోల్డ్ 50 [pips] పైకి లేదా 500 డాలర్లు (1 [lot] = 100 oz) పెరగవచ్చు. ఎప్పుడూ [stop loss] ఉపయోగించండి - ఈ [volatility] సమయాలలో చాలా ఖతరం ఎక్కువ.\u003c/p>\n"}},"42":{"en":"\u003cp>Currency pairs do not move in isolation. Because every pair contains two currencies, many pairs rise and fall together, or in opposite directions. Understanding correlation and currency strength helps beginners avoid accidentally doubling their risk. This lesson is for education only and is not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"A strengthening currency often pulls several of its pairs in the same direction\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Correlation\u003c/strong> measures how two pairs move relative to each other, from +1 (move together) to -1 (move opposite). Near 0 means no reliable link.\u003c/li>\n\u003cli>\u003cstrong>Shared currencies\u003c/strong> create links. EUR/USD and GBP/USD often rise together because both are quoted against the USD. EUR/USD and USD/CHF often move in opposite directions.\u003c/li>\n\u003cli>\u003cstrong>Currency strength\u003c/strong> compares one currency against several others. If the USD rises against EUR, GBP and JPY, the USD is broadly strong, which is a stronger signal than one pair alone. Correlations change over time, so they are never guaranteed.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>A trader buys 1 mini lot (10,000 units) of EUR/USD and 1 mini lot of GBP/USD, thinking these are two separate trades. A pip is worth about $1 on each. If the USD strengthens, both pairs fall 50 pips: a loss of about $50 on each, or $100 in total. The trader effectively took one USD bet twice. With a single position, the loss would have been about $50.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Positively correlated pairs held in the same direction can multiply your risk.\u003c/li>\n\u003cli>Checking several pairs shows whether a move is about one currency or just one pair.\u003c/li>\n\u003cli>Correlations shift, so check them regularly and keep position sizes small.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> You buy both EUR/USD and GBP/USD, and the USD strengthens sharply. What is likely to happen, and why?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Both positions will likely lose at the same time, because both pairs are positively correlated and share the USD as the quote currency. Your risk is concentrated rather than diversified.\u003c/p>","te":"\n\u003cp>ఫారెక్స్‌లో కరెన్సీ జతలు ఒకదానితో ఒకటి సంబంధం లేకుండా కదలవు. కొన్ని జతలు ఒకే దిశలో కదులుతాయి, కొన్ని వ్యతిరేక దిశలో కదులుతాయి. దీన్ని సహసంబంధం (correlation) అంటారు. ఈ పాఠం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్‌లో రిస్క్ ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"ఒక కరెన్సీ బలపడినప్పుడు దానికి సంబంధించిన జతలు ఒకే దిశలో కదులుతాయి\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>పాజిటివ్ సహసంబంధం (positive correlation):\u003c/strong> EUR/USD, GBP/USD లాంటి జతలు తరచుగా ఒకే దిశలో కదులుతాయి, ఎందుకంటే రెండింటిలో USD ఒకటే.\u003c/li>\n\u003cli>\u003cstrong>నెగటివ్ సహసంబంధం (negative correlation):\u003c/strong> EUR/USD పెరిగినప్పుడు USD/CHF తరచుగా తగ్గుతుంది. సహసంబంధం ఎప్పటికీ స్థిరంగా ఉండదు, అది మారుతూ ఉంటుంది.\u003c/li>\n\u003cli>\u003cstrong>కరెన్సీ బలం (currency strength):\u003c/strong> ఒక కరెన్సీ మిగతా వాటితో పోలిస్తే ఎంత బలంగా ఉందో చూడాలి. USD బలంగా ఉంటే EUR/USD, GBP/USD తగ్గే అవకాశం ఉంటుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీరు EUR/USD మీద బై (buy) చేసి, GBP/USD మీద కూడా బై చేశారనుకోండి. రెండు ట్రేడ్‌లకు 1 లాట్ బదులు 0.1 లాట్ చొప్పున తీసుకున్నారు, అంటే పిప్‌కు సుమారు $1. USD బలపడి రెండు జతలు 40 పిప్స్ తగ్గితే, ప్రతి ట్రేడ్‌లో నష్టం సుమారు $40, మొత్తం $80. అంటే రెండు వేర్వేరు ట్రేడ్‌లు అనిపించినా, నిజానికి అది USD మీద ఒకే పందెం, రిస్క్ రెట్టింపు అయింది.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>సహసంబంధం ఉన్న జతల్లో ఒకే దిశలో ట్రేడ్‌లు తీసుకుంటే రిస్క్ పెరుగుతుంది.\u003c/li>\n\u003cli>ట్రేడ్ చేసే ముందు ఆ జతలోని రెండు కరెన్సీల బలం చూడండి.\u003c/li>\n\u003cli>సహసంబంధాలు మారతాయి, కాబట్టి వాటిని ఎప్పటికప్పుడు తనిఖీ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> EUR/USD, GBP/USD రెండింటిపై బై చేయడం ఎందుకు ఎక్కువ రిస్క్?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> ఈ రెండు జతలు తరచుగా ఒకే దిశలో కదులుతాయి, రెండింటిలో USD సాధారణం. USD బలపడితే రెండు ట్రేడ్‌లూ ఒకేసారి నష్టపోవచ్చు, కాబట్టి మొత్తం రిస్క్ రెట్టింపు అవుతుంది.\u003c/p>","t":"కరెన్సీ సహసంబంధాలు & కరెన్సీ బలం","g":{"en":"\n\u003cdiv class=\"gold-corner\">\n  \u003cp>Gold (XAUUSD) strengthens when the US dollar weakens, since gold is priced in USD. If the dollar index drops 2% due to Fed policy shifts, gold might rally 40 pips ($4 profit per lot on 100 oz). Always hedge currency risk: a strong dollar can offset gold gains, so consider dollar correlation when sizing positions on volatile economic data days.\u003c/p>\n\u003c/div>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] యొక్క ధర డాలర్ శక్తిపై ఎక్కువ ఆధారపడుతుంది. డాలర్ బలంగా ఉన్నప్పుడు సోన ధర సాధారణంగా పడిపోతుంది. ఉదాహరణకు, డాలర [USD] 2% బలపడితే, సోన 1 lot (100 oz) నుండి 2,000 pips పడిపోతుంది - అంటే $200 నష్టం. ఎల్లప్పుడు [Stop Loss] ఉపయోగించండి డాలర్ సంబంధాల [Correlations] ఎందుకంటే సోన [Gold] నుండి రక్షణ పొందటానికి.\u003c/p>\n"}},"43":{"en":"\u003cp>A carry trade means buying a currency that pays a higher interest rate while funding the position with a currency that pays a lower one. The small daily interest difference, called the swap (or rollover), is credited or charged when you hold a position past the broker's daily cutoff. This lesson is for education only, not financial advice. Forex trading is high risk.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"Carry trades often work best in steady, low-volatility uptrends\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Interest differential:\u003c/strong> If you buy a high-rate currency against a low-rate one, you may earn a positive swap. If you sell it, you usually pay.\u003c/li>\n\u003cli>\u003cstrong>Broker swap rates:\u003c/strong> Brokers add their own markup, so the real swap is often lower than the pure rate gap. It can be negative in both directions. Triple swap is commonly charged on Wednesdays to cover the weekend.\u003c/li>\n\u003cli>\u003cstrong>Price risk comes first:\u003c/strong> A currency pair can move far more than the interest earned. Carry trades tend to suffer when markets turn risk-averse and prices fall sharply.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Say you buy 1 standard lot (100,000 units) of a pair, and your broker credits a swap of about $4 per night. Over 20 nights, that is about \u003cstrong>$80\u003c/strong> in swap income.\u003c/p>\n\u003cp>Now suppose the price falls 80 pips against you. At roughly $10 per pip on a standard lot, that is a \u003cstrong>$800\u003c/strong> loss. The swap covered only a tenth of it. If the price instead rose 80 pips, you would gain $800 plus the $80 swap.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Swap is the interest difference between two currencies, credited or charged daily on positions held overnight.\u003c/li>\n\u003cli>Swap can be positive or negative, so check your broker's swap table before holding a trade.\u003c/li>\n\u003cli>Price movement usually outweighs swap income, so manage risk with stops and sensible position size.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> You earn $4 per night in swap, but the price moves 50 pips against you on a $10-per-pip position. Does the swap protect you?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> No. The loss is about $500, so about $4 per night in swap would take over 100 nights to offset it. Swap is a small bonus, not protection against price risk.\u003c/p>","te":"\n\u003cp>ఫారెక్స్‌లో ప్రతి కరెన్సీకి దేశపు వడ్డీ రేటు (interest rate) ఉంటుంది. ఒక ట్రేడ్‌ను రాత్రికి రాత్రి తెరిచి ఉంచితే, రెండు కరెన్సీల వడ్డీ తేడా ప్రకారం మీ ఖాతాలో కొంత మొత్తం కలుస్తుంది లేదా తగ్గుతుంది. దీనినే స్వాప్ (swap) అంటారు. ఈ తేడాను ఆదాయంగా వాడుకునే పద్ధతి క్యారీ ట్రేడ్ (carry trade). ఇది విద్యా సమాచారం మాత్రమే, ఆర్థిక సలహా కాదు.\u003c/p>\n\n\u003cfigure data-k=\"up\" data-c=\"అధిక వడ్డీ కరెన్సీ నెమ్మదిగా పైకి వెళ్తున్న ట్రెండ్ (uptrend)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>తక్కువ వడ్డీ ఉన్న కరెన్సీని అమ్మి (sell), ఎక్కువ వడ్డీ ఉన్న కరెన్సీని కొంటారు (buy). వడ్డీ తేడా స్వాప్ రూపంలో వస్తుంది.\u003c/li>\n\u003cli>స్వాప్ పాజిటివ్ (positive) లేదా నెగటివ్ (negative) కావచ్చు. బ్రోకర్ ఫీజులు కూడా కలుస్తాయి, కాబట్టి మీ బ్రోకర్ స్వాప్ రేట్లను ముందే చూడండి.\u003c/li>\n\u003cli>ధర మీకు వ్యతిరేకంగా కదిలితే నష్టం స్వాప్ ఆదాయం కంటే చాలా ఎక్కువ కావచ్చు. వడ్డీ రేట్లు మారినా పరిస్థితి మారుతుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీరు 1 లాట్ (lot) ట్రేడ్ తెరిచారనుకోండి; ఒక పిప్ (pip) విలువ సుమారు $10. రోజువారీ స్వాప్ +$2 అనుకుందాం. 30 రోజులకు స్వాప్ = $60. కానీ ధర మీకు వ్యతిరేకంగా 80 పిప్స్ కదిలితే నష్టం 80 × $10 = $800. అంటే స్వాప్ ఆదాయం $60 ఆ నష్టాన్ని భర్తీ చేయలేదు. అందుకే స్టాప్ లాస్ (stop loss) వాడటం ముఖ్యం. (ఇవి ఉదాహరణ సంఖ్యలు మాత్రమే.)\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>స్వాప్ అంటే రాత్రిపూట ట్రేడ్ ఉంచినందుకు వచ్చే లేదా చెల్లించే వడ్డీ తేడా.\u003c/li>\n\u003cli>క్యారీ ట్రేడ్‌లో స్వాప్ లాభం చిన్నది, ధర కదలిక ప్రమాదం పెద్దది.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్వాప్ రేట్లు చూసి, రిస్క్ నిర్వహణ (risk management) పాటించండి. ఫారెక్స్ అధిక రిస్క్ కలిగినది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>ప్రశ్న: తక్కువ వడ్డీ కరెన్సీని అమ్మి, ఎక్కువ వడ్డీ కరెన్సీని కొంటే స్వాప్ సాధారణంగా ఎలా ఉంటుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> సాధారణంగా పాజిటివ్ (positive) గా ఉంటుంది, అయితే బ్రోకర్ ఫీజుల వల్ల అసలు విలువ మారవచ్చు, అందుకే బ్రోకర్ రేటు చూడాలి.\u003c/p>","t":"క్యారీ ట్రేడ్ & స్వాప్ (Carry Trade & Swap)","g":{"en":"\n\u003cp>In gold trading, carry trade strategies apply when interest rate differentials favor holding long positions. For example, if USD rates exceed gold lease rates, holding 1 lot (100 oz) of XAUUSD overnight generates swap income—potentially $5-15 daily depending on rate spreads. \u003cstrong>Risk tip:\u003c/strong> Always calculate overnight swap costs before entering trades, as adverse rate differentials can erode profits on intraday moves under 50 pips.\u003c/p>\n","te":"\n\u003cp>\nగోల్డ్ ట్రేడింగ్‌లో [carry trade] ఉపయోగించినప్పుడు, వివిధ దేశల రుణदर తేడా నుండి లాభం పొందవచ్చు. ఉదాహరణకు, మీరు 1 [lot] (100 oz) గోల్డ్ కొనితే మరియు 50 [pips] పెరిగితే, $500 లాభం పొందుతారు ($0.10 × 50 = $5, × 100 oz). అయితే, [interest rate] మార్పులు మీ [swap] ఖర్చులను పెంచవచ్చు, కాబట్టి [carry costs] పర్యవేక్షించండి మరియు [risk management] ఉపయోగించండి.\n\u003c/p>\n"}},"44":{"en":"\u003cp>Gold, quoted as XAUUSD, is the price of one troy ounce of gold in US dollars. It is one of the most widely traded instruments in retail forex, known for sharp moves and frequent reactions to economic news. This lesson is for education only and is not financial advice. Trading gold carries a high risk of loss.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"Gold breaking out above a resistance level\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Pricing and pips:\u003c/strong> Most brokers quote gold with two decimals, such as 2350.00. Many treat a 0.10 move as one pip, but this varies, so check your broker's contract specifications.\u003c/li>\n\u003cli>\u003cstrong>Contract size:\u003c/strong> One standard lot is usually 100 ounces. A $1 move in gold then equals about $100 of profit or loss per lot.\u003c/li>\n\u003cli>\u003cstrong>What moves it:\u003c/strong> Gold often reacts to US dollar strength, interest rate expectations, inflation data, and global uncertainty. Spreads can widen and prices can jump around major news.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Suppose gold breaks above resistance and you buy 0.10 lot (10 ounces) at 2350.00, with a stop-loss at 2345.00 and a target at 2360.00.\u003c/p>\n\u003cul>\n\u003cli>Risk: $5 move x 10 ounces = \u003cstrong>$50\u003c/strong> (50 pips at 0.10 per pip).\u003c/li>\n\u003cli>Reward: $10 move x 10 ounces = \u003cstrong>$100\u003c/strong> (100 pips).\u003c/li>\n\u003cli>Risk-to-reward is 1:2. If the stop is hit, you lose $50, and the trade can also lose more if the price gaps past your stop.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Gold is volatile, so use smaller position sizes than you would on many currency pairs.\u003c/li>\n\u003cli>Always confirm pip value and contract size with your broker before trading.\u003c/li>\n\u003cli>Plan your stop-loss first and risk only a small percentage of your account per trade.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> If you hold 0.50 lot of gold (50 ounces) and the price moves $2 against you, how much do you lose?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> $2 x 50 ounces = $100.\u003c/p>","te":"\n\u003cp>బంగారం (Gold) ను ట్రేడింగ్‌లో XAUUSD అంటారు. అంటే ఒక ఔన్స్ బంగారం ధర అమెరికన్ డాలర్లలో (USD) ఎంత అనేది చూపిస్తుంది. ఇది చాలా వేగంగా కదులుతుంది, అందుకే కొత్తవారు జాగ్రత్తగా నేర్చుకోవాలి. ఈ పాఠం కేవలం విద్య కోసమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో నష్టభయం ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"బంగారం ధర ఒక పరిధిలో కదులుతున్న చార్ట్ (range)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>ధర కదలిక:\u003c/strong> చాలా బ్రోకర్లలో XAUUSD ధర 0.01 కదిలితే అది 1 పైప్ (pip) అని లెక్కిస్తారు కొందరు, కొందరు 0.10 ను పైప్ అంటారు. కాబట్టి మీ బ్రోకర్ నిబంధన తప్పక చూడండి.\u003c/li>\n\u003cli>\u003cstrong>లాట్ సైజ్ (lot size):\u003c/strong> సాధారణంగా 1 స్టాండర్డ్ లాట్ = 100 ఔన్సులు. ధర $1 కదిలితే 1 లాట్‌కు సుమారు $100 లాభం లేదా నష్టం.\u003c/li>\n\u003cli>\u003cstrong>ప్రభావం చూపేవి:\u003c/strong> డాలర్ బలం, వడ్డీ రేట్లు (interest rates), ద్రవ్యోల్బణం (inflation), ప్రపంచ ఉద్రిక్తతలు బంగారం ధరను ప్రభావితం చేస్తాయి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీరు XAUUSD ను $2,000.00 వద్ద 0.1 లాట్ (10 ఔన్సులు) కొన్నారనుకుందాం. స్టాప్ లాస్ (stop loss) $1,995.00 వద్ద, అంటే $5 దూరం. నష్టం గరిష్టంగా 10 × $5 = $50. టేక్ ప్రాఫిట్ (take profit) $2,010.00 అయితే లాభం 10 × $10 = $100. ఇక్కడ రిస్క్:రివార్డ్ (risk:reward) 1:2. ఇది కేవలం ఉదాహరణ మాత్రమే; నిజమైన ఫలితాలు మారవచ్చు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>XAUUSD అంటే ఒక ఔన్స్ బంగారం ధర USD లో.\u003c/li>\n\u003cli>చిన్న లాట్ సైజ్‌తో మొదలుపెట్టండి, ఎందుకంటే బంగారం వేగంగా కదులుతుంది.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ (stop loss) వాడండి, మీరు భరించగలిగిన మొత్తాన్నే రిస్క్ చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> 1 లాట్ (100 ఔన్సులు) XAUUSD లో ధర $3 పెరిగితే లాభం ఎంత?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> 100 × $3 = $300 లాభం (కొనుగోలు చేసి ఉంటే). ధర $3 తగ్గితే అదే మొత్తం నష్టం.\u003c/p>","t":"బంగారం (XAUUSD) ట్రేడింగ్ ప్రాథమికాలు","g":{"en":"\n\u003cp>Gold responds dramatically to US dollar strength and interest rate expectations. If the Fed signals rate hikes, gold typically weakens as USD strengthens. For example, a 50-pip drop ($5 loss per lot) can occur within hours of hawkish Fed comments. \u003cstrong>Risk tip:\u003c/strong> Use stop-losses within 100-200 pips of entry to protect against sudden macro-driven reversals in this volatile market.\u003c/p>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] వర్తకంలో [trading] ఈ పాఠం ఆలోచన చేతనగా ఉపయోగించండి. ఉదాహరణకు, మీరు 1 [lot] (100 ఔన్సులు) కొనితే మరియు ధర 10 [pips] పెరిగితే, మీ లాభం $100 ($0.10 × 10 × 100). అయితే, ఆపద నియంత్రణ [risk management] ముఖ్యమైనది - ఎప్పుడూ మీ ఖాతాను నష్టపరచే పెద్ద [lot size] ఉపయోగించవద్దు.\u003c/p>\n"}},"45":{"en":"\u003cp>Before risking real money, smart traders practice. A demo account lets you trade with virtual funds in live market conditions, while backtesting means applying your strategy rules to past price charts to see how they would have performed. Together they help you learn without financial pain. This lesson is for education only, not financial advice. Forex trading is high
