risk.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"A breakout above range resistance: a setup you could backtest on past charts\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Demo account:\u003c/strong> Open one with a broker, practice placing orders, setting stop-losses, and managing position size. Treat the virtual money as if it were real, or the habits you build won't transfer.\u003c/li>\n\u003cli>\u003cstrong>Backtesting:\u003c/strong> Write clear rules first (entry, stop, target). Scroll back on a chart and record every time the setup appeared, noting win or loss in a journal. Avoid cherry-picking only the good trades.\u003c/li>\n\u003cli>\u003cstrong>Limits:\u003c/strong> Demo fills are often cleaner than live ones, and past results never guarantee future results. Emotions also feel different when real money is at stake.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>You test a breakout rule on EUR/USD over 40 past setups. Each trade risks 20 pips with a 40-pip target. Say 16 trades win and 24 lose.\u003c/p>\n\u003cp>Wins: 16 × 40 = 640 pips. Losses: 24 × 20 = 480 pips. Net: +160 pips. On a 0.1-lot position (about $1 per pip), that is roughly +$160 over 40 trades, before spreads and fees. If costs average 2 pips per trade (80 pips, about $80), the net falls to about +$80. This shows why costs must be included.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Practice on a demo account until your rules are consistent, and treat it seriously.\u003c/li>\n\u003cli>Backtest with fixed rules and record every trade honestly, including losers.\u003c/li>\n\u003cli>Results from demo or past data are not guarantees; costs and emotions change real outcomes.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why should you include spreads and fees when backtesting?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Because they reduce every trade's result, and a strategy that looks slightly profitable without costs can turn out to be unprofitable once they are counted.\u003c/p>","te":"\n\u003cp>నిజమైన డబ్బు పెట్టే ముందు ప్రాక్టీస్ చేయడం తెలివైన పని. డెమో అకౌంట్ (demo account) లో వర్చువల్ డబ్బుతో ట్రేడింగ్ నేర్చుకోవచ్చు. బ్యాక్‌టెస్టింగ్ (backtesting) అంటే పాత చార్టులపై మీ నియమాలను పరీక్షించడం. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ (forex) లో నష్టభయం ఎక్కువ.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"పాత చార్టులో బ్రేకౌట్ (breakout) ను పరీక్షించడం\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>డెమో అకౌంట్ (demo account):\u003c/strong> బ్రోకర్ ఉచితంగా ఇచ్చే వర్చువల్ డబ్బు ఖాతా. ప్లాట్‌ఫారమ్ వాడటం, ఆర్డర్లు పెట్టడం నేర్చుకోవచ్చు.\u003c/li>\n\u003cli>\u003cstrong>బ్యాక్‌టెస్టింగ్ (backtesting):\u003c/strong> చార్టును వెనక్కి జరిపి, మీ ఎంట్రీ, స్టాప్ లాస్ (stop loss), టార్గెట్ నియమాలను ప్రతి సంఘటనకు వర్తింపజేసి ఫలితాలను నోట్ చేయండి.\u003c/li>\n\u003cli>\u003cstrong>రికార్డు (journal):\u003c/strong> ప్రతి ట్రేడ్ ఫలితాన్ని రాసుకోండి. కనీసం 50 ట్రేడ్‌ల తర్వాత మాత్రమే ఒక అభిప్రాయానికి రండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>మీరు బ్రేకౌట్ నియమాన్ని 20 ట్రేడ్‌లపై పరీక్షించారు అనుకోండి. స్టాప్ లాస్ 20 పిప్స్ (pips), టార్గెట్ 40 పిప్స్. 1 మినీ లాట్ (mini lot) లో ఒక పిప్ విలువ సుమారు $1. 8 ట్రేడ్‌లు గెలిస్తే 8 × 40 = 320 పిప్స్ ($320). 12 ట్రేడ్‌లు ఓడితే 12 × 20 = 240 పిప్స్ ($240). నికర లాభం 80 పిప్స్ ($80). నియమం పనిచేసినట్లే కనిపిస్తుంది, కానీ నమూనా చిన్నది, కాబట్టి ఇంకా పరీక్షించాలి. గతంలో పనిచేసినది భవిష్యత్తులో పనిచేస్తుందని హామీ లేదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>మొదట డెమో అకౌంట్‌లో నేర్చుకోండి, తర్వాత మాత్రమే నిజమైన డబ్బు గురించి ఆలోచించండి.\u003c/li>\n\u003cli>బ్యాక్‌టెస్టింగ్ ఫలితాలు నిజాయితీగా నమోదు చేయండి; మంచి ఫలితాల కోసం నియమాలను మార్చవద్దు.\u003c/li>\n\u003cli>డెమోలో భయం, ఆశ ఉండవు, కాబట్టి నిజమైన ట్రేడింగ్ భిన్నంగా అనిపిస్తుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> బ్యాక్‌టెస్టింగ్ (backtesting) అంటే ఏమిటి?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> పాత చార్టు డేటాపై మీ ట్రేడింగ్ నియమాలను వర్తింపజేసి, అవి గతంలో ఎలా పనిచేసేవో పరీక్షించడం.\u003c/p>","t":"డెమో అకౌంట్ & బ్యాక్‌టెస్టింగ్","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Demo accounts let you practice gold trading risk-free. Test a strategy: buy 1 lot at $2,000, set stop-loss at $1,990 (100 pips = $10 loss). Backtest this entry across historical data to refine your approach. Never risk more than 1-2% of account capital per trade—here, risking $10 on a $5,000 account keeps you safe while learning.\u003c/p>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] వర్తకంలో [demo account] ఉపయోగించటం చాలా ముఖ్యం. ఉదాహరణకు, మీరు $2000 డెమో ఖాతాతో ప్రారంభించండి. ఒక [lot] (100 oz) [buy] చేసి, 50 [pips] లాభం పొందితే, అది $5.00 లాభం ($0.10 × 50). ప్రకృత [trading] ప్రారంభించక ముందు, [demo] లో వేర్వేరు [strategies] పరీక్షించండి. గుర్తుంచుకోండి: [real money] కంటే [demo] ఎల్లప్పుడు భిన్నంగా ఉంటుంది, కాబట్టి [risk management] నేర్చుకోవడం ఎంతో ముఖ్యం.\u003c/p>\n"}},"46":{"en":"\u003cp>A proprietary (prop) trading firm lets you trade its money after you prove yourself in a paid evaluation. If you pass, you get a \"funded account\" and usually keep a share of any profits. This lesson is for education only, not financial advice. Forex trading is high risk, and most beginners lose money.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Price stays inside a range: prop firm rules reward patience and discipline, not constant trading\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Evaluation:\u003c/strong> You pay a fee to trade a simulated account and must reach a profit target (for example 8%) without breaking the rules.\u003c/li>\n\u003cli>\u003cstrong>Risk rules:\u003c/strong> Firms set a maximum daily loss (often 5%) and a maximum total drawdown (often 10%). Breaking either one usually ends the account immediately.\u003c/li>\n\u003cli>\u003cstrong>Funded stage:\u003c/strong> After passing, you trade under the same rules and receive a profit split (commonly 70-90%). Check carefully whether the money is real or simulated, and read the payout terms.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>You buy a $10,000 evaluation account for a $100 fee. The profit target is 8% ($800) and the max daily loss is 5% ($500). You risk 1% ($100) per trade with a 20-pip stop loss, which is about $5 per pip. If a trade hits its 40-pip target, you gain 40 x $5 = $200. If the stop is hit, you lose 20 x $5 = $100. Four such wins would reach the $800 target. Five straight stop-outs would lose $500 and breach the daily limit, ending the attempt and costing you the $100 fee.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Prop firms limit your downside to the evaluation fee, but most traders fail the evaluation, so expect to lose fees.\u003c/li>\n\u003cli>Risk rules matter more than profit targets. Small position sizes keep you inside the limits.\u003c/li>\n\u003cli>Research the firm first: read the terms, payout history, and any hidden restrictions. Some firms are unreliable.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> On a $10,000 evaluation with a 5% max daily loss, what is the most you can lose in one day before breaking the rule?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> $500 (5% of $10,000). Going beyond that typically fails the evaluation.\u003c/p>","te":"\n\u003cp>ప్రాప్ ఫర్మ్ (prop firm) అంటే ట్రేడర్లకు తమ డబ్బుతో ట్రేడ్ చేసే అవకాశం ఇచ్చే కంపెనీ. దానికి ముందు ట్రేడర్ ఒక పరీక్ష (challenge) పాస్ అవ్వాలి, దానికి ఫీజు చెల్లించాలి. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్ చాలా రిస్క్ ఉన్నది.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"నియమాల పరిధిలో (range) ట్రేడ్ చేయడం: డ్రాడౌన్ లిమిట్ దాటకూడదు\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>మొదట ఫీజు చెల్లించి ఎవాల్యుయేషన్ (evaluation) తీసుకోవాలి. ప్రాఫిట్ టార్గెట్ (profit target) చేరాలి, అలాగే డ్రాడౌన్ (drawdown) లిమిట్ దాటకూడదు.\u003c/li>\n\u003cli>పాస్ అయితే ఫండెడ్ అకౌంట్ (funded account) ఇస్తారు. వచ్చిన లాభంలో కొంత భాగం (profit split) ట్రేడర్‌కు వస్తుంది.\u003c/li>\n\u003cli>నియమం ఒక్కసారి ఉల్లంఘించినా అకౌంట్ పోవచ్చు. ఫీజు తిరిగి రాదు. కంపెనీల నియమాలు, నమ్మకత్వం వేర్వేరుగా ఉంటాయి, కాబట్టి జాగ్రత్తగా చదవండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>అకౌంట్ సైజు 10,000 USD అనుకోండి. ప్రాఫిట్ టార్గెట్ 8% అంటే 800 USD. గరిష్ట డ్రాడౌన్ 10% అంటే 1,000 USD. ఒక ట్రేడ్‌లో స్టాప్ లాస్ (stop loss) 50 పిప్స్ (pips), రిస్క్ 100 USD (1%) అయితే, వరుసగా 10 నష్టాలు వస్తే 1,000 USD పోయి అకౌంట్ ఫెయిల్ అవుతుంది. ఫండెడ్ అయ్యాక 500 USD లాభం వచ్చి, 80% ప్రాఫిట్ స్ప్లిట్ ఉంటే ట్రేడర్‌కు 400 USD. ఇవి ఉదాహరణ సంఖ్యలు మాత్రమే, లాభం గ్యారంటీ కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ప్రాప్ ఫర్మ్‌లో ట్రేడ్ చేయడానికి ఫీజు కట్టాలి, ఆ ఫీజును కోల్పోయే ప్రమాదం ఉంది.\u003c/li>\n\u003cli>రిస్క్ మేనేజ్‌మెంట్ (risk management) మరియు డ్రాడౌన్ నియమాలు అత్యంత ముఖ్యం.\u003c/li>\n\u003cli>చేరే ముందు నియమాలు, ఫీజులు, పేఅవుట్ (payout) షరతులు పూర్తిగా చదవండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ఫండెడ్ అకౌంట్‌లో డ్రాడౌన్ లిమిట్ దాటితే ఏమవుతుంది?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> సాధారణంగా అకౌంట్ మూసివేస్తారు, ట్రేడర్ ఫీజు తిరిగి రాదు.\u003c/p>","t":"ప్రాప్ ఫర్మ్స్ & ఫండెడ్ అకౌంట్స్ (Prop Firms & Funded Accounts)","g":{"en":"\n\u003cp>Prop firms offer funded accounts perfect for gold trading. With a $10,000 account, you might risk $100 per trade (1% rule). Trading 1 lot of gold, a 10-pip stop loss costs $100, while a 50-pip target profit gains $500. Funded accounts let you scale this strategy without personal capital. \u003cstrong>Risk tip:\u003c/strong> Always verify the prop firm's withdrawal rules and drawdown limits before trading.\u003c/p>\n","te":"\n\u003cp>గోల్డ్ ట్రేడింగ్లో [prop firms] ఆలోచన చాలా ఉపయోగకరమైనది. ఉదాహరణకు, మీరు [funded account] నుండి 1 [lot] గోల్డ్ కొనితే, ఒక్క [pip] కదలిక మీకు $0.10 లాభం లేదా నష్టం ఇస్తుంది - 50 [pips] కదలిక $5 మార్పు. ముఖ్యమైన పరిచయం: [drawdown limits] నియమాలు గుర్తుంచుకోండి, కారణంగా గోల్డ్ ధరలు త్వరితంగా మారుతాయి.\u003c/p>\n"}},"47":{"en":"\u003cp>Almost every new forex trader makes the same handful of errors. Knowing them in advance won't make trading safe, since forex is high risk and you can lose more than you expect, but it can help you avoid the most common traps. This lesson is for education only and is not financial advice.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"A false breakout: price pushes past a level, then reverses, trapping early entries\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Over-leverage:\u003c/strong> High leverage magnifies losses as much as gains. A small price move against a large position can wipe out an account quickly.\u003c/li>\n\u003cli>\u003cstrong>No stop-loss or plan:\u003c/strong> Entering without a defined exit point leads to emotional decisions, such as holding losers too long or cutting winners too early.\u003c/li>\n\u003cli>\u003cstrong>Chasing and overtrading:\u003c/strong> Jumping into fast moves, such as breakouts that fail, or trading constantly after a loss (\"revenge trading\") tends to compound mistakes and costs, including spreads.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>A beginner with a $1,000 account buys 1 standard lot of EUR/USD (about $10 per pip) without a stop-loss. Price drops 50 pips against them: 50 pips × $10 = \u003cstrong>$500 loss\u003c/strong>, or half the account in one trade.\u003c/p>\n\u003cp>Now suppose they instead trade 1 micro lot (about $0.10 per pip) with a 30-pip stop. The maximum loss is 30 × $0.10 = \u003cstrong>$3\u003c/strong>, or 0.3% of the account. The market is the same, but the risk is far smaller.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Keep position sizes small so that no single trade can seriously damage your account.\u003c/li>\n\u003cli>Decide your entry, stop-loss, and exit before you trade, and practice on a demo account first.\u003c/li>\n\u003cli>Avoid revenge trading and chasing moves; losses are part of trading, and patience is a skill.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> Why is trading without a stop-loss and with very high leverage considered a common beginner mistake?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Because high leverage magnifies losses, and without a stop-loss there is no predefined limit, so a modest adverse move can cause a large loss, potentially most or all of the account.\u003c/p>","te":"\n\u003cp>ఫారెక్స్ (forex) నేర్చుకునే కొత్తవారు తరచుగా కొన్ని ఒకే రకమైన తప్పులు చేస్తారు. వాటిని ముందే తెలుసుకుంటే నష్టాలు తగ్గించుకోవచ్చు. ఇది విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్ (trading)లో అధిక రిస్క్ (risk) ఉంది.\u003c/p>\n\n\u003cfigure data-k=\"dtop\" data-c=\"ధర రెండుసార్లు ఒకే స్థాయిని తాకి పడిపోవడం: త్వరగా ప్రవేశించి నష్టపోయే సాధారణ తప్పు\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>అతి లెవరేజ్ (over-leverage):\u003c/strong> చిన్న ఖాతాలో పెద్ద లాట్ (lot) తీసుకుంటే, చిన్న ధర కదలికకే ఖాతా ఖాళీ అవుతుంది.\u003c/li>\n\u003cli>\u003cstrong>స్టాప్ లాస్ (stop loss) లేకపోవడం:\u003c/strong> నష్టం పెరుగుతున్నా ట్రేడ్ మూసివేయకపోతే, చిన్న నష్టం పెద్దదిగా మారుతుంది.\u003c/li>\n\u003cli>\u003cstrong>భావోద్వేగ ట్రేడింగ్ (emotional trading):\u003c/strong> నష్టం తర్వాత వెంటనే \"తిరిగి సంపాదిస్తా\" అని ట్రేడ్ చేయడం (revenge trading), లేదా అత్యాశతో ప్లాన్ వదిలేయడం.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>రవి వద్ద $500 ఖాతా ఉంది. అతను స్టాప్ లాస్ లేకుండా 1 స్టాండర్డ్ లాట్ (standard lot) తీసుకున్నాడు. ఇక్కడ 1 పిప్ (pip) ≈ $10. ధర 50 పిప్స్ వ్యతిరేకంగా కదిలితే నష్టం 50 × $10 = $500, అంటే మొత్తం ఖాతా పోతుంది. బదులుగా అతను 0.01 లాట్ (1 పిప్ ≈ $0.10) తీసుకుని 20 పిప్స్ స్టాప్ లాస్ పెడితే, గరిష్ట నష్టం 20 × $0.10 = $2 మాత్రమే, అంటే ఖాతాలో 0.4%.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>ప్రతి ట్రేడ్‌లో ఖాతాలో కొద్ది శాతం మాత్రమే రిస్క్ చేయండి.\u003c/li>\n\u003cli>ఎల్లప్పుడూ స్టాప్ లాస్ వాడండి, ప్లాన్ ప్రకారమే ట్రేడ్ చేయండి.\u003c/li>\n\u003cli>నిజమైన డబ్బుకు ముందు డెమో ఖాతా (demo account)లో సాధన చేయండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> నష్టం వచ్చిన వెంటనే నష్టాన్ని పూడ్చడానికి పెద్ద లాట్‌తో ట్రేడ్ చేయడాన్ని ఏమంటారు, అది ఎందుకు ప్రమాదకరం?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> దీన్ని రివెంజ్ ట్రేడింగ్ (revenge trading) అంటారు. ఇది ప్లాన్ లేకుండా భావోద్వేగంతో చేసే పని, రిస్క్ పెంచి నష్టాలను మరింత పెంచుతుంది.\u003c/p>","t":"సాధారణ ప్రారంభకుల తప్పులు (Common Beginner Mistakes)","g":{"en":"\n\u003cp>\u003cstrong>Gold (XAUUSD) Corner:\u003c/strong> Beginners often over-leverage when trading gold, risking account wipeout. If you trade 10 lots ($1,000 notional per pip) on a $5,000 account and gold drops 50 pips, you lose $500—10% of your account. \u003cstrong>Risk Tip:\u003c/strong> Always calculate position size before entering: risk no more than 1-2% per trade to survive drawdowns and learn effectively.\u003c/p>\n","te":"\n\u003cp>సోने [Gold/XAUUSD] వర్తకం [trading] చేస్తున్నప్పుడు, గందరగోళ [confusion] నుండి బయటపడండి. ఉదాహరణకు, మీరు 1 [lot] (100 oz) కొన్నారు, ధర $10 పెరిగింది - ఇది $100 లాభం, కానీ మీ [stop loss] సరిగా సెట్ చేయకపోతే, $500 నష్టం కూడా సాధ్యం. [Risk management] ఎల్లప్పుడూ మొదట ఆలోచించండి, ఎక్కువ [leverage] ఉపయోగించవద్దు.\u003c/p>\n"}},"48":{"en":"\u003cp>Forex is a legitimate market, but it attracts scammers who prey on beginners. Choosing a safe broker matters as much as any trading skill. This lesson is education only, not financial advice, and forex trading carries a high risk of loss.\u003c/p>\n\n\u003cfigure data-k=\"vee\" data-c=\"Scam-style 'guaranteed' spike: a sharp rise, then a sudden collapse\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Check regulation:\u003c/strong> A trustworthy broker is licensed by a recognized regulator (such as the FCA in the UK, ASIC in Australia, or the CFTC/NFA in the US). Verify the license number on the regulator's own website, not just the broker's page.\u003c/li>\n\u003cli>\u003cstrong>Spot red flags:\u003c/strong> Promises of guaranteed profits, pressure to deposit quickly, \"signal sellers\" or \"account managers\" who contact you first, and bonuses that lock up your withdrawals.\u003c/li>\n\u003cli>\u003cstrong>Protect your money:\u003c/strong> Test a small withdrawal early, use secure payment methods, never share passwords, and never give anyone control of your account.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>A stranger messages you: \"Deposit $1,000 and I'll turn it into $5,000 in a month, guaranteed.\" That would be a 400% return, far beyond what any professional can reliably deliver. After you deposit, the platform shows a fake gain of +$4,000, but it demands a $800 \"tax fee\" before you can withdraw. For comparison, a real trade might risk 20 pips on EUR/USD with a 0.1 lot, where each pip is about $1, so your risk is around $20. Real trading involves small, defined risks, never guarantees.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>No one can guarantee profits in forex.\u003c/li>\n\u003cli>Verify a broker's license directly with the regulator.\u003c/li>\n\u003cli>Be wary of anyone who asks for fees to release your own money or for control of your account.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> A \"trader\" you met online promises guaranteed monthly returns and asks you to send money to his personal account. What should you do?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> Walk away. Guaranteed returns and requests to pay a personal account are classic scam signs. Only deal with brokers whose regulation you have verified yourself.\u003c/p>","te":"\n\u003cp>ఫారెక్స్‌లో లాభాల ఆశ చూపి మోసం చేసేవారు చాలామంది ఉంటారు. డబ్బు పెట్టే ముందు బ్రోకర్ (broker) నిజమైనదో కాదో తెలుసుకోవడం చాలా ముఖ్యం. ఇది కేవలం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది.\u003c/p>\n\n\u003cfigure data-k=\"break\" data-c=\"నకిలీ లాభాల ఆశ: ధర ఒక్కసారిగా పైకి చూపి, తర్వాత కుప్పకూలే మోసపు బ్రేక్‌అవుట్ (breakout)\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>లైసెన్స్ (regulation) చూడండి:\u003c/strong> బ్రోకర్ నమ్మదగిన నియంత్రణ సంస్థ వద్ద నమోదై ఉన్నాడో లేదో అధికారిక వెబ్‌సైట్‌లో స్వయంగా తనిఖీ చేయండి.\u003c/li>\n\u003cli>\u003cstrong>హామీ లాభాల హెచ్చరిక:\u003c/strong> \"నెలకు 30% గ్యారంటీ\", సిగ్నల్ సెల్లర్లు, \"అకౌంట్ మేనేజ్‌మెంట్\" ఆఫర్లు, తొందర పెట్టడం అన్నీ ప్రమాద సంకేతాలు.\u003c/li>\n\u003cli>\u003cstrong>డబ్బు భద్రత:\u003c/strong> చిన్న మొత్తంతో మొదలుపెట్టి, విత్‌డ్రా (withdrawal) సులభంగా వస్తుందో పరీక్షించండి. పాస్‌వర్డ్, OTP ఎవరికీ ఇవ్వకండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>ఒక వ్యక్తి \"50 పిప్స్ (pips) రోజూ గ్యారంటీ\" అని చెప్పి $500 డిపాజిట్ అడిగాడు. 50 పిప్స్ అంటే 0.01 లాట్ (micro lot)లో సుమారు $5 మాత్రమే, కానీ అతను నెలకు $1,000 వస్తుందన్నాడు. అది అసాధ్యమైన వాగ్దానం. మీరు $500 పంపాక విత్‌డ్రా అడిగితే \"ముందు $200 ట్యాక్స్ కట్టండి\" అన్నాడు. ఇది స్పష్టమైన మోసం. చివరికి మొత్తం $700 నష్టం.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>గ్యారంటీ లాభం అనేది ఫారెక్స్‌లో ఉండదు. అలా చెప్పేవారిని నమ్మకండి.\u003c/li>\n\u003cli>డిపాజిట్ చేసే ముందు బ్రోకర్ లైసెన్స్‌ను అధికారిక సైట్‌లో ధృవీకరించుకోండి.\u003c/li>\n\u003cli>విత్‌డ్రాకు ముందు డబ్బు అడిగితే వెంటనే ఆపండి.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> ఒక బ్రోకర్ \"విత్‌డ్రా చేయాలంటే ముందు ఫీజు కట్టండి\" అంటే అది సురక్షితమా?\u003c/p>\n\u003cp>\u003cstrong>జవాబు:\u003c/strong> కాదు. ఇది సాధారణ మోసపు సంకేతం. నిజమైన బ్రోకర్ అలా ముందస్తు ఫీజు అడగడు, కాబట్టి ఇక డబ్బు పంపకూడదు.\u003c/p>","t":"మోసాలు & బ్రోకర్ భద్రత (Scams & Broker Safety)","g":{"en":"\n\u003cp>When trading gold, scams often target inexperienced traders with unrealistic profit promises. For example, a fraudulent broker might claim you'll earn $500 on a 50-pip move with 1 lot (100 oz), then disappear with deposits. Always verify brokers through official regulatory bodies like the NFA or FCA before funding your account. Never trust guarantees of consistent profits in any market.\u003c/p>\n","te":"\n\u003cp>గోల్డ్ ట్రేడింగ్‌లో [scams] నుండి రక్షణ పొందడం చాలా ముఖ్యం. నిర్భరమైన [brokers] మాత్రమే ఎంచుకోండి. ఉదాహరణకు, ఒక [fraudulent broker] $100 లాభం వాగ్దానం చేసి, మీ $1,000 డిపాజిట్‌ను దొంగిలిస్తుంది. [Gold] ట్రేడింగ్‌లో, ఒక [lot] = 100 oz, 1 [pip] = $0.10, కాబట్టి నిరాপద [broker] ఎంపిక చేసుకోండి. ఎల్లప్పుడు [regulated] ఖాతాలు ఉపయోగించండి మరియు అపరిచితమైన [brokers]‌కు సంవత్సరాలు ఖర్చు చేయవద్దు.\u003c/p>\n"}},"49":{"en":"\u003cp>Congratulations on reaching the final lesson. Your first 30 days are not about making money. They are about building habits, protecting your capital, and learning how markets behave. This lesson is for education only and is not financial advice. Forex trading is high risk, and you can lose more than you expect.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"Early on, most price action looks like a range: patience beats prediction\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Week 1, demo only:\u003c/strong> Practice on a demo account. Learn your platform, place orders, and set stop-losses until it feels routine.\u003c/li>\n\u003cli>\u003cstrong>Weeks 2-3, follow a written plan:\u003c/strong> Pick one or two pairs and one simple setup. Write down your entry, stop, target, and risk per trade. Log every trade with a short note on why you took it.\u003c/li>\n\u003cli>\u003cstrong>Week 4, review:\u003c/strong> Study your journal. Look for mistakes such as overtrading, moving stops, or ignoring your plan. Only then consider whether live trading, at very small size, makes sense for you.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>Say your demo account is $5,000 and your rule is to risk 1% per trade, which is $50. You buy EUR/USD with a stop 25 pips away. A pip is worth about $0.20 on a 2,000-unit position, so your 25-pip stop risks about $5. To risk the full $50, you would size the position so each pip is worth $2, which is a 20,000-unit position. If the trade hits a 50-pip target, that is about $100, or 2 times your risk. If it hits the stop, you lose $50 and move on. After 30 days, the quality of your process matters far more than the profit or loss figure.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>Your first month is for learning and building discipline, not for profit.\u003c/li>\n\u003cli>Risk a small fixed percentage per trade and always use a stop-loss.\u003c/li>\n\u003cli>Keep a journal and review it weekly. It is your best teacher.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>Question:\u003c/strong> What is the main goal of your first 30 days of trading?\u003c/p>\n\u003cp>\u003cstrong>Answer:\u003c/strong> To build good habits, such as following a plan, managing risk, and journaling, rather than to chase profits.\u003c/p>","te":"\n\u003cp>ఫారెక్స్ (forex) ప్రయాణంలో మొదటి 30 రోజులు లాభాల కోసం కాదు, నేర్చుకోవడం కోసం. ఈ పాఠం విద్య కోసం మాత్రమే, ఆర్థిక సలహా కాదు. ఫారెక్స్ ట్రేడింగ్‌లో అధిక రిస్క్ ఉంటుంది, పెట్టిన డబ్బు మొత్తం కోల్పోవచ్చు.\u003c/p>\n\n\u003cfigure data-k=\"range\" data-c=\"మొదటి నెలలో ధర పరిధిలో కదులుతున్నప్పుడు ఓపికగా గమనించడం నేర్చుకోండి\">\u003c/figure>\n\n\u003ch3>How it works\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>మొదటి 2 వారాలు:\u003c/strong> డెమో అకౌంట్ (demo account)లో ప్రాక్టీస్ చేయండి. చార్ట్‌లు చదవడం, ఆర్డర్లు పెట్టడం నేర్చుకోండి. నిజమైన డబ్బు వాడకండి.\u003c/li>\n\u003cli>\u003cstrong>3వ వారం:\u003c/strong> ఒక ట్రేడింగ్ ప్లాన్ (trading plan) రాసుకోండి: ఏ జంట (pair), ఎప్పుడు ఎంటర్ అవ్వాలి, స్టాప్ లాస్ (stop loss) ఎక్కడ, ఎంత రిస్క్ (risk).\u003c/li>\n\u003cli>\u003cstrong>4వ వారం:\u003c/strong> ప్రతి ట్రేడ్‌ను జర్నల్ (journal)లో నమోదు చేయండి. ఫలితం కంటే మీరు ప్లాన్ పాటించారా అన్నదే ముఖ్యం.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Simple example\u003c/h3>\n\u003cp>డెమో అకౌంట్‌లో $1,000 ఉందనుకోండి. ప్రతి ట్రేడ్‌లో 1% మాత్రమే రిస్క్ చేస్తే అది $10. EUR/USDలో స్టాప్ లాస్ (stop loss) 20 పిప్స్ (pips) దూరంలో పెడితే, పిప్‌కు $0.50 వచ్చేలా లాట్ సైజ్ (lot size) ఎంచుకోవాలి. అప్పుడు నష్టం వచ్చినా గరిష్టంగా 20 × $0.50 = $10 మాత్రమే. 30 రోజుల్లో 20 ట్రేడ్‌లు చేసి, 8 గెలిచి 12 ఓడినా, లాభం 30 పిప్స్ చొప్పున ఉంటే మొత్తం ఎలా ఉందో జర్నల్‌లో లెక్కించి చూడండి. ఇది కేవలం ఉదాహరణ, హామీ కాదు.\u003c/p>\n\n\u003ch3>Key takeaways\u003c/h3>\n\u003cul>\n\u003cli>మొదటి 30 రోజులు డెమోలో నేర్చుకోవడానికి, డబ్బు సంపాదించడానికి కాదు.\u003c/li>\n\u003cli>ప్రతి ట్రేడ్‌కు స్టాప్ లాస్ (stop loss) పెట్టి, రిస్క్‌ను 1% లోపు ఉంచండి.\u003c/li>\n\u003cli>జర్నల్ రాయడం మీ తప్పులను గుర్తించడానికి సహాయపడుతుంది.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Quick check\u003c/h3>\n\u003cp>\u003cstrong>ప్రశ్న:\u003c/strong> $1,000 అకౌంట్‌లో 1% రిస్క్ అంటే ఒక ట్రేడ్‌లో గరిష్ట నష్టం ఎంత?\u003c/p>\n\u003cp>\u003cstrong>సమాధానం:\u003c/strong> $10.\u003c/p>","t":"మీ మొదటి 30 రోజులు","g":{"en":"\n\u003cp>In your first 30 days trading Gold (XAUUSD), focus on consistent position sizing. If you risk $50 per trade with 1 lot (100 oz) at a 50-pip stop loss ($500 risk), you're learning proper money management—the foundation successful traders build. \u003cstrong>Risk tip:\u003c/strong> Never risk more than 1-2% of your account on a single trade, even when learning.\u003c/p>\n","te":"\n\u003cdiv>\n  \u003ch3>Gold (XAUUSD) Corner\u003c/h3>\n  \u003cp>మీ మొదటి 30 రోజుల్లో [gold trading] నేర్చుకోవడం చాలా ముఖ్యం. ఉదాహరణకు, మీరు [1 lot] కొనితే అది 100 oz [gold]. ఒక [pip] ($0.10) కదిలితే $10 లాభం లేదా నష్టం వస్తుంది. 2 [pips] కదిలితే $20 మారుతుంది. నమ్మండి, [stop loss] ఎల్లప్పుడు ఉపయోగించండి - పెద్ద నష్టం నుండి రక్షణ అది.\u003c/p>\n\u003c/div>\n"}}},"salt":"6783b1b7fe1d0ad13769650a","rev":[]}</script>

const body=[{en:`<p>Forex (foreign exchange) is the global market where currencies are traded against each other, like EUR/USD. It is open 24 hours a day, 5 days a week, and is the largest financial market in the world.</p><p>In a pair like EUR/USD = 1.0850, one euro costs 1.0850 US dollars. If you think the euro will get stronger, you <b>buy</b>; if you think it will get weaker, you <b>sell</b>.</p><p class="ex"><b>Example:</b> You buy EUR/USD at 1.0850 and it rises to 1.0900. That is a move of 50 pips. With a 0.10 lot (1 pip ≈ $1), the profit is about $50. If it falls to 1.0800, you lose about $50.</p><h3>Key points</h3><ul><li>You always trade one currency against another.</li><li>Prices move in pips (0.0001 for most pairs).</li><li>Leverage magnifies both profits and losses, so risk small.</li></ul>`,te:`<p>ఫారెక్స్ (ఫారిన్ ఎక్స్ఛేంజ్) అంటే కరెన్సీలను ఒకదానితో ఒకటి ట్రేడ్ చేసే ప్రపంచ మార్కెట్, ఉదా: EUR/USD. ఇది రోజుకు 24 గంటలు, వారానికి 5 రోజులు తెరిచి ఉంటుంది మరియు ప్రపంచంలోనే అతిపెద్ద ఆర్థిక మార్కెట్.</p><p>EUR/USD = 1.0850 అంటే ఒక యూరో ధర 1.0850 అమెరికన్ డాలర్లు. యూరో బలపడుతుందని అనుకుంటే <b>బై</b> చేస్తారు; బలహీనపడుతుందని అనుకుంటే <b>సెల్</b> చేస్తారు.</p><p class="ex"><b>ఉదాహరణ:</b> మీరు EUR/USD ని 1.0850 వద్ద కొన్నారు, అది 1.0900 కి పెరిగింది. అంటే 50 పిప్స్ కదలిక. 0.10 లాట్ (1 పిప్ ≈ $1) తో లాభం సుమారు $50. 1.0800 కి పడితే సుమారు $50 నష్టం.</p><h3>ముఖ్యాంశాలు</h3><ul><li>మీరు ఎల్లప్పుడూ ఒక కరెన్సీని మరొకదానితో ట్రేడ్ చేస్తారు.</li><li>ధర పిప్స్‌లో కదులుతుంది (చాలా పెయిర్లలో 0.0001).</li><li>లివరేజ్ లాభాన్ని, నష్టాన్ని రెండింటినీ పెంచుతుంది, కాబట్టి తక్కువ రిస్క్ తీసుకోండి.</li></ul>`}];

const AGR={en:`<ol><li><b>Education only.</b> BizTrade lessons are for learning. Nothing here is financial, investment or legal advice, and nothing is a trading signal or recommendation.</li><li><b>High risk.</b> Forex and leveraged trading carry a high risk. You can lose all the money you trade with. Past results do not guarantee future results. No profit is promised.</li><li><b>Your decisions.</b> Every trade you place is your own decision and your own responsibility. BizTrade and its owner are not liable for any loss or damage from using these lessons.</li><li><b>Personal access.</b> Your access code is for you only. Do not share it. Do not copy, record, resell or republish the lessons without written permission.</li><li><b>Age and law.</b> You are 18 or older, and trading is legal where you live.</li><li><b>Certificate.</b> The certificate only shows that you completed the lessons. It is not a licence or a regulated qualification.</li><li><b>Accuracy.</b> Lessons may contain mistakes or become outdated. Check important facts with trusted sources before you act.</li></ol>`,te:`<ol><li><b>విద్య కోసమే.</b> BizTrade పాఠాలు నేర్చుకోవడానికి మాత్రమే. ఇక్కడ ఉన్నదేదీ ఆర్థిక, పెట్టుబడి లేదా న్యాయ సలహా కాదు, ట్రేడింగ్ సిగ్నల్ లేదా సిఫారసు కాదు.</li><li><b>అధిక రిస్క్.</b> ఫారెక్స్, లివరేజ్ ట్రేడింగ్‌లో రిస్క్ చాలా ఎక్కువ. మీరు ట్రేడ్ చేసే డబ్బంతా కోల్పోవచ్చు. గత ఫలితాలు భవిష్యత్తుకు హామీ కాదు. లాభాలకు ఎటువంటి హామీ లేదు.</li><li><b>మీ నిర్ణయాలు.</b> మీరు చేసే ప్రతి ట్రేడ్ మీ స్వంత నిర్ణయం, మీ బాధ్యత. ఈ పాఠాల వల్ల కలిగే ఏ నష్టానికీ BizTrade, దాని యజమాని బాధ్యులు కారు.</li><li><b>వ్యక్తిగత యాక్సెస్.</b> మీ యాక్సెస్ కోడ్ మీ కోసమే. ఇతరులకు ఇవ్వకండి. రాతపూర్వక అనుమతి లేకుండా పాఠాలను కాపీ, రికార్డ్, అమ్మడం లేదా తిరిగి ప్రచురించడం చేయకండి.</li><li><b>వయస్సు, చట్టం.</b> మీకు 18 ఏళ్లు లేదా అంతకంటే ఎక్కువ, మరియు మీ ప్రాంతంలో ట్రేడింగ్ చట్టబద్ధం.</li><li><b>సర్టిఫికెట్.</b> సర్టిఫికెట్ మీరు పాఠాలు పూర్తి చేశారని మాత్రమే చూపిస్తుంది. ఇది లైసెన్స్ లేదా నియంత్రిత అర్హత కాదు.</li><li><b>ఖచ్చితత్వం.</b> పాఠాల్లో తప్పులు ఉండవచ్చు లేదా పాతవి కావచ్చు. ముఖ్యమైన విషయాలను నమ్మదగిన వనరులతో సరిచూసుకోండి.</li></ol>`};

ord:()=>S('📝 '+T('Pending order checker','పెండింగ్ ఆర్డర్ చెకర్'),`<div class="row"><select id="t1"><option>Buy Limit</option><option>Buy Stop</option><option>Sell Limit</option><option>Sell Stop</option></select><input id="t2" type="number" step="0.0001" value="1.0850"><input id="t3" type="number" step="0.0001" value="1.0830"></div><small>${T('Order type · Current price · Your entry price','ఆర్డర్ రకం · ప్రస్తుత ధర · మీ ఎంట్రీ ధర')}</small>`,()=>{const t=t1.selectedIndex,cp=+t2.value,en=+t3.value,ok=[en<cp,en>cp,en>cp,en<cp][t],how=[T('buys when price FALLS to your level (cheaper entry)','ధర మీ లెవల్‌కు పడినప్పుడు కొంటుంది (చౌక ఎంట్రీ)'),T('buys when price RISES to your level (breakout)','ధర మీ లెవల్‌కు పెరిగినప్పుడు కొంటుంది (బ్రేక్‌అవుట్)'),T('sells when price RISES to your level (better sell price)','ధర మీ లెవల్‌కు పెరిగినప్పుడు అమ్ముతుంది (మంచి సెల్ ధర)'),T('sells when price FALLS to your level (breakdown)','ధర మీ లెవల్‌కు పడినప్పుడు అమ్ముతుంది (బ్రేక్‌డౌన్)')][t];so.innerHTML=ok?`✅ ${T('Valid.','సరైనది.')} ${t1.value} ${how}. ${T('Distance','దూరం')}: <b>${Math.round(Math.abs(en-cp)*1e4)} ${T('pips','పిప్స్')}</b>`:`❌ ${T('Invalid: a','చెల్లదు:')} ${t1.value} ${T('must be placed','ఉండాలి')} <b>${[T('below','కింద'),T('above','పైన'),T('above','పైన'),T('below','కింద')][t]}</b> ${T('the current price.','ప్రస్తుత ధర.')}`}),
slx:()=>{const run=()=>{const sl=gv('sl'),tp=gv('tp');let p=0,path=[0],res='';for(let j=0;j<400;j++){p+=(Math.random()-.5)*8;path.push(p);if(p<=-sl){res=`❌ ${T('Stop loss hit','స్టాప్ లాస్ తగిలింది')}: −${sl} ${T('pips','పిప్స్')} (−$${sl} @0.10 lot)`;break}if(p>=tp){res=`✅ ${T('Take profit hit','టేక్ ప్రాఫిట్ తగిలింది')}: +${tp} ${T('pips','పిప్స్')} (+$${tp} @0.10 lot)`;break}}if(!res)res='⏳ '+T('Neither hit','ఏదీ తగలలేదు');const m2=Math.max(sl,tp,20)*1.2;so.innerHTML=LC([[path,'#3b82f6']],{lo:-m2,hi:m2,r:[[tp,G,'TP +'+tp],[-sl,RD,'SL −'+sl],[0,'#888','Entry']]})+res+`<br><small>R:R 1:${(tp/sl).toFixed(1)} · ${T('Press Run again: some trades win, some lose.','మళ్లీ రన్ చేయండి: కొన్ని గెలుస్తాయి, కొన్ని ఓడతాయి.')}</small>`};S('🛡 '+T('Stop-loss & take-profit lab','స్టాప్-లాస్ & టేక్-ప్రాఫిట్ ల్యాబ్'),RS('sl',T('Stop loss (pips)','స్టాప్ లాస్ (పిప్స్)'),5,60,20)+RS('tp',T('Take profit (pips)','టేక్ ప్రాఫిట్ (పిప్స్)'),5,120,40)+`<button class="p" id="go2">▶ ${T('Run a trade (random market)','ట్రేడ్ రన్ చేయండి (రాండమ్ మార్కెట్)')}</button>`,run);go2.onclick=run},
rr:()=>{S('⚖ '+T('Risk-reward expectancy','రిస్క్-రివార్డ్ ఎక్స్‌పెక్టెన్సీ'),RS('w',T('Win rate %','విన్ రేట్ %'),20,80,40)+RS('r',T('Reward : Risk','రివార్డ్ : రిస్క్'),0.5,4,2,.5)+`<button id="rb">🎲 ${T('Run again','మళ్లీ రన్')}</button>`,()=>{const w=gv('w')/100,r=gv('r'),ex=w*r-(1-w),runs=['#3b82f6','#f5a524','#a855f7'].map(cc=>{let b=0,a=[0];for(let j=0;j<100;j++){b+=Math.random()<w?r:-1;a.push(b)}return[a,cc]});so.innerHTML=LC(runs,{r:[[0,'#888','0R']]})+`${T('Expectancy per trade','ట్రేడ్‌కు ఎక్స్‌పెక్టెన్సీ')}: <b style="color:${ex>=0?G:RD}">${ex.toFixed(2)}R</b> · ${T('Break-even win rate','బ్రేక్-ఈవెన్ విన్ రేట్')}: <b>${(100/(1+r)).toFixed(0)}%</b><br><small>${T('3 random runs of 100 trades. Positive expectancy wins over time, even with a low win rate.','100 ట్రేడ్ల 3 రాండమ్ రన్‌లు. పాజిటివ్ ఎక్స్‌పెక్టెన్సీ తక్కువ విన్ రేట్‌తో కూడా కాలక్రమేణా గెలుస్తుంది.')}</small>`});rb.onclick=()=>e.oninput()},
ruin:()=>{S('☠ '+T('Risk of ruin','రిస్క్ ఆఫ్ రూయిన్'),RS('r',T('Risk per trade %','ట్రేడ్‌కు రిస్క్ %'),0.5,20,2,.5)+`<button id="rb">🎲 ${T('New 100 trades','కొత్త 100 ట్రేడ్లు')}</button>`,()=>{const r=gv('r')/100;let b=1000,mn=1000,a=[b];for(let j=0;j<100;j++){b*=Math.random()<.5?1+r:1-r;a.push(b);mn=Math.min(mn,b)}so.innerHTML=LC([[a,b>=1000?G:RD]],{r:[[1000,'#888','$1000']]})+`${T('After 100 coin-flip trades (1:1)','100 కాయిన్-ఫ్లిప్ ట్రేడ్ల తర్వాత (1:1)')}: <b>$${b.toFixed(0)}</b> · ${T('lowest','కనిష్టం')}: $${mn.toFixed(0)}<br><small>${T('5 losses in a row at this risk leaves','ఈ రిస్క్‌తో వరుసగా 5 నష్టాల తర్వాత')} <b>$${(1000*(1-r)**5).toFixed(0)}</b> ${T('from $1000. Small risk survives losing streaks.','$1000 నుండి. చిన్న రిస్క్ నష్టాల పరంపరను తట్టుకుంటుంది.')}</small>`});rb.onclick=()=>e.oninput()},
disc:()=>MQ('🧠 '+T('Discipline test','క్రమశిక్షణ పరీక్ష'),[["You lose 3 trades in a row. What should you do?","వరుసగా 3 ట్రేడ్లు ఓడిపోయారు. ఏమి చేయాలి?",[["Double the lot size to win it back","లాట్ సైజ్ రెట్టింపు చేసి తిరిగి గెలవాలి"],["Stop, review your journal, then trade smaller","ఆపి, జర్నల్ సమీక్షించి, చిన్నగా ట్రేడ్ చేయాలి"],["Change strategy immediately","వెంటనే స్ట్రాటజీ మార్చాలి"]],1,["Revenge trading with bigger lots is how accounts blow up. Pause and review.","పెద్ద లాట్లతో రివెంజ్ ట్రేడింగ్ వల్లే అకౌంట్లు పోతాయి. ఆగి సమీక్షించండి."]],["Price is rushing up and you missed your entry. You feel FOMO.","ధర వేగంగా పెరుగుతోంది, మీ ఎంట్రీ మిస్ అయ్యింది. FOMO అనిపిస్తోంది.",[["Jump in late with no stop loss","స్టాప్ లాస్ లేకుండా ఆలస్యంగా దూకడం"],["Wait for the next setup","తదుపరి సెటప్ కోసం వేచి ఉండటం"],["Use maximum leverage to catch up","పట్టుకోవడానికి గరిష్ట లివరేజ్ వాడటం"]],1,["There is always another trade. Chasing price gives bad entries.","ఎప్పుడూ మరో ట్రేడ్ వస్తుంది. ధరను వెంబడిస్తే చెడ్డ ఎంట్రీలు వస్తాయి."]],["Your trade is +40 pips and the target is +60. You feel scared.","మీ ట్రేడ్ +40 పిప్స్‌లో ఉంది, టార్గెట్ +60. భయంగా ఉంది.",[["Always close early out of fear","భయంతో ఎప్పుడూ ముందే క్లోజ్ చేయడం"],["Follow the plan; maybe move the stop to break-even","ప్లాన్ పాటించడం; స్టాప్‌ను బ్రేక్-ఈవెన్‌కు మార్చవచ్చు"],["Remove the stop loss","స్టాప్ లాస్ తీసేయడం"]],1,["Rules decided in advance beat emotions in the moment.","ముందే నిర్ణయించిన రూల్స్ క్షణికావేశాన్ని గెలుస్తాయి."]]]),
rev:()=>{S('🔁 '+T('Revenge trading test','రివెంజ్ ట్రేడింగ్ టెస్ట్'),`<p>${T('Same 40 random trades (50% win, 1:1). Plan A: risk 2% every time. Plan B: DOUBLE your risk after each loss.','అవే 40 రాండమ్ ట్రేడ్లు (50% విన్, 1:1). ప్లాన్ A: ఎల్లప్పుడూ 2% రిస్క్. ప్లాన్ B: ప్రతి నష్టం తర్వాత రిస్క్ రెట్టింపు.')}</p><button class="p" id="rb">🎲 ${T('Run','రన్')}</button>`,()=>{let a=1000,b=1000,rb2=2,A=[a],B=[b];for(let j=0;j<40;j++){const w=Math.random()<.5;a*=1+(w?.02:-.02);if(b>5){b*=1+(w?rb2:-rb2)/100;rb2=w?2:Math.min(rb2*2,50)}A.push(a);B.push(Math.max(b,0));}so.innerHTML=LC([[A,G],[B,RD]])+`<span style="color:${G}">A: $${a.toFixed(0)}</span> · <span style="color:${RD}">B (${T('doubling','రెట్టింపు')}): $${b.toFixed(0)}</span><br><small>${T('Doubling after losses feels logical but one long losing streak can wipe the account.','నష్టాల తర్వాత రెట్టింపు చేయడం తార్కికంగా అనిపిస్తుంది కానీ ఒక్క పెద్ద నష్టాల పరంపర అకౌంట్‌ను తుడిచేయగలదు.')}</small>`});rb.onclick=()=>e.oninput()},
plan:()=>CK('📋 '+T('Build your trading plan','మీ ట్రేడింగ్ ప్లాన్ తయారు చేయండి'),[['I know which pairs I trade (e.g. EUR/USD, XAUUSD)','నేను ఏ పెయిర్లు ట్రేడ్ చేస్తానో తెలుసు (ఉదా EUR/USD, XAUUSD)'],['I picked my timeframe and session','నా టైమ్‌ఫ్రేమ్, సెషన్ ఎంచుకున్నాను'],['I have clear entry rules','స్పష్టమైన ఎంట్రీ రూల్స్ ఉన్నాయి'],['I have clear exit rules (stop loss and take profit)','స్పష్టమైన ఎగ్జిట్ రూల్స్ ఉన్నాయి (స్టాప్ లాస్, టేక్ ప్రాఫిట్)'],['I risk only 1-2% per trade','ట్రేడ్‌కు 1-2% మాత్రమే రిస్క్ చేస్తాను'],['I have a maximum daily loss','రోజువారీ గరిష్ట నష్ట పరిమితి ఉంది'],['I check the news calendar first','ముందు న్యూస్ క్యాలెండర్ చూస్తాను'],['I write every trade in a journal','ప్రతి ట్రేడ్‌ను జర్నల్‌లో రాస్తాను']],'✅ '+T('Your plan is complete!','మీ ప్లాన్ పూర్తయింది!')),
